  <!-- ══ LE RUBAN DE DIAGNOSTIC — `?diag` ═══════════════════════════════════
       🔴 NORMES §0 « Google Headless » dit de vérifier sur la PAGE RENDUE.
       Pendant quatre lots j'ai vérifié sur la page rendue… d'UN SEUL moteur.
       Eric voyait un défaut que mon banc ne reproduisait pas, et chaque
       correctif partait d'une mesure vraie chez moi et fausse chez lui.
       ⭐ Ce ruban rend la mesure PORTABLE : il n'apparaît qu'avec `?diag` dans
       l'adresse, et affiche ce que l'appareil calcule vraiment. Il est
       autonome (aucune classe, aucun jeton) — un instrument qui dépend de ce
       qu'il mesure ment. ⛔ Rien ne change sans le paramètre. -->
  <script>
  if (location.search.includes("diag")) addEventListener("load", () => {
    const bande = document.createElement("div");
    /* ⛔ IL NE DOIT JAMAIS BLOQUER L'USAGE — Eric, 2026-08-29, dans la minute
       qui a suivi : *« je ne peux pas avancer dans les menus car je n'ai plus
       accès au bouton Done »*. Posé en bas et opaque, le ruban recouvrait le
       pied dès que la carte était assez haute : un instrument de mesure avait
       pris la place de ce qu'il mesure.
       ⭐ TROIS GARDES, ET LA PREMIÈRE SUFFIRAIT : `pointer-events: none` le
       rend traversable au doigt (on tape le bouton À TRAVERS lui) ; il se colle
       en HAUT, loin du pied qui vit en bas ; et il reste semi-transparent pour
       qu'on voie ce qu'il survole. */
    /* ⛔ ET IL NE MASQUE PLUS RIEN NON PLUS — Eric, aussitôt après : *« comment
       je navigue dans les menus supérieurs dans le belt ? »*. Traversable, il
       ne bloquait plus le doigt, mais posé en haut il RECOUVRAIT la ceinture :
       on tapait à l'aveugle. Un instrument qui cache l'écran ne vaut guère
       mieux qu'un instrument qui le bloque.
       ⭐ Il tient désormais sur UNE ligne, en bas, sur la moitié droite : le
       pied du builder est centré, la ceinture est en haut — la seule bande
       libre est celle-là. Plus `pointer-events: none`, qui reste la garde. */
    bande.style.cssText = "position:fixed;right:0;bottom:0;z-index:99999;"
      + "max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
      + "background:rgba(17,17,17,.75);color:#0f0;font:10px/1.6 ui-monospace,monospace;"
      + "padding:1px 6px;pointer-events:none";
    const lire = () => {
      const c = document.querySelector(".decision-card");
      if (!c) return "carte absente";
      const r = c.getBoundingClientRect(), s = getComputedStyle(c);
      const p = c.parentElement, ps = getComputedStyle(p);
      return [
        "viewport " + innerWidth + "  dpr " + devicePixelRatio,
        "carte " + Math.round(r.width) + "  (g" + Math.round(r.left)
          + " d" + Math.round(innerWidth - r.right) + ")",
        "width:" + s.width + "  max:" + s.maxWidth,
        "--card-w:" + s.getPropertyValue("--card-w").trim()
          + "  --measure:" + s.getPropertyValue("--measure").trim(),
        "cadre " + ps.display + " align:" + ps.alignItems + " pad:" + ps.paddingLeft
      ].join("  ·  ");
    };
    document.body.append(bande);
    const tic = () => { bande.textContent = lire(); };
    tic(); setInterval(tic, 500);
  });
  </script>
