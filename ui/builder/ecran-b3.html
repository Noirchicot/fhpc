<title>FHPC — B3, le système de coordonnées du dressing</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     B3 — LE DRESSING. ⛔ CE FICHIER NE DESSINE PAS L'ÉCRAN : il pose son
     SYSTÈME DE COORDONNÉES, et il sert à ce qu'ERIC place les ancrages
     lui-même.

     🔴 LA QUESTION D'ERIC, ET ELLE COMMANDE TOUT (2026-08-24) : *« je veux que
     tout soit placé au pixel près sur ce B3 et que rien ne bouge d'un écran à
     l'autre, comment on fait ? »*

     ⛔ LA RÉPONSE N'EST PAS « POSER DES PIXELS ». Trois cotes justes, posées en
     pixels, sont mortes dans la nuit du 23 au 24/08 :
         --roue-pas: min(121px, …)   117+4 réglés à l'iPad → 73,8 au téléphone
         --roue-fondu: 10px          fixe pendant que le cran rétrécit
         --fiche-h: 440px            cote de CATALOGUE posée sur un FF
     Un pixel n'est pas une adresse portable.

     ⭐ CE QUI DONNE VRAIMENT LE PIXEL PRÈS : un REPÈRE. Tout ce qui doit
     s'aligner vit dans UN SEUL `viewBox`. Le corps, les ancrages, les traits :
     un seul système, mis à l'échelle d'un bloc. Rien ne peut dériver par
     rapport à rien, parce que rien n'a de repère à soi.
     ⛔ ET C'EST LA LEÇON DE LA VEILLE, MESURÉE : le tambour et la grille
     calculaient chacun leur largeur — 2,5 px d'écart, et un décalage visible.
     Deux repères = deux vérités.

     ══ CE QUE CE BANC FAIT, ET C'EST TOUT ═══════════════════════════════════
       · il pose le repère `--b3-repere` (voir le `viewBox` plus bas) ;
       · il place les DIX EMPLACEMENTS du vault en pastilles DÉPLAÇABLES ;
       · il relit leurs coordonnées et les rend en JSON, prêtes à figer.

     ⭐ POURQUOI DÉPLAÇABLES : parce que la bonne place d'un ancrage ne se
     calcule pas, elle se voit. C'est l'atelier qu'Eric emploie déjà pour les
     cartes de forces — *il place, je relis les positions*. Le pixel est alors
     le SIEN, posé à la main, puis figé. Pas le mien, deviné.

     ⏳ CE QUI MANQUE, ET QUI NE PEUT VENIR QUE D'ERIC : la SILHOUETTE. Mesurée
     dans le croquis du 23/08, elle y fait ~55 × 165 px — inexploitable pour un
     tracé. Il faut un SVG (idéal : son tracé DEVIENT le repère) ou un PNG
     détouré. En attendant, un corps de substitution tient la place, aux mêmes
     proportions ; le remplacer ne déplacera aucun ancrage, puisqu'ils vivent
     dans le repère, pas sur l'image.

     ⛔ CE QUI N'EST PAS ICI : les boîtes de slots, la bourse, les GEAR BAGS, la
     barre du bas. Elles viendront quand les ancrages seront figés — une boîte
     se pose EN FACE d'un ancrage, donc après lui.
     ⛔ ET AUCUN CÂBLAGE : Eric l'a dit — *« on dessine le pantin et le câblage
     viendra après »*. La couche `srfh` qui porte le champ `slot` n'est pas
     encore importée dans `fhpc` (c'est le lot 95).
═══════════════════════════════════════════════════════════════════════════ -->

<style>
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }

/* LE RELEVÉ — comme celui de l'écran R : on ne juge pas à l'œil ce qu'un
   chiffre peut dire. */
.banc-mesure {
  flex: none; margin: 0; padding: var(--sp-4) var(--sp-8);
  background: var(--surface); border-bottom: 1px solid var(--border);
  color: var(--text-muted); font-size: var(--t1);
  font-variant-numeric: tabular-nums; text-align: center;
}

.banc-scene {
  flex: 1 1 auto; min-height: 0; display: flex; gap: var(--sp-8); padding: var(--sp-8);
  align-items: stretch; justify-content: center;
  /* ⚠️ IL PASSE À LA LIGNE PLUTÔT QUE DE ROGNER — mesuré : dans une fenêtre de
     526 px la scène en demandait 594, et `justify-content: center` débordait
     des DEUX côtés, coupant le pantin à gauche. ⛔ Un banc qui tronque ce qu'on
     vient y regarder ne sert à rien. */
  flex-wrap: wrap; align-content: flex-start;
}

/* 🔴 LE REPÈRE, ET IL N'Y EN A QU'UN. `preserveAspectRatio` par défaut
   (`xMidYMid meet`) : la scène entière se met à l'échelle SANS se recomposer.
   ⛔ C'est la différence avec une mise en page : une mise en page réarrange,
   un repère agrandit. Ce qui est à 500,240 y reste, quel que soit l'écran.
   ⚠️ `width: auto` ET `flex: 0 0 auto`, MESURÉ : laissé en `flex: 1 1 auto;
   min-width: 0`, le repère se faisait écraser à **64 px de large** par le
   panneau voisin — un pantin illisible dans une page qui avait pourtant la
   place. Un SVG à `viewBox` calcule sa largeur DEPUIS sa hauteur ; lui laisser
   négocier sa largeur en flex, c'est lui retirer précisément ce qu'on est venu
   chercher. */
.b3-repere { flex: 0 0 auto; height: 100%; width: auto; max-width: 100%; display: block; }

/* La grille du repère — un décor de banc, elle ne part pas dans le produit. */
.b3-grille { stroke: var(--border); stroke-width: 1; opacity: .5; }
.b3-cadre { fill: none; stroke: var(--border-strong); stroke-width: 2; }
/* ⭐ LE CORPS EST PEINT, PAS DESSINÉ : le masque donne la forme, ce jeton donne
   l'encre. Changer de thème change la couleur du pantin sans toucher au tracé. */
.b3-corps { fill: var(--text-soft); }
/* Le filigrane des deux corps sous la zone commune — il montre ce qui DÉBORDE. */
.b3-fantome { fill: var(--text-muted); opacity: .22; }
.b3-fantome[hidden] { display: none; }

/* ⭐ UN ANCRAGE SE PREND AU DOIGT. `touch-action: none` — sans lui le doigt
   fait défiler la page et le navigateur annule la séquence en cours de route,
   exactement comme pour les jetons de l'écran R (`glisser.mjs`, en tête). */
.b3-ancre { fill: var(--accent); stroke: var(--surface); stroke-width: 3; cursor: grab; touch-action: none; }
.b3-ancre[data-pris="oui"] { fill: var(--critical); cursor: grabbing; }
/* ⚠️ UN HALO, PARCE QUE L'ÉTIQUETTE PASSE SUR LE CORPS. Vu à l'écran : « Tête 8 »
   se lisait « te 8 » et « Mains 43 » se lisait « ains », le mot disparaissant
   dans la silhouette claire. ⛔ Et c'est justement le mot qu'Eric doit lire pour
   savoir quelle pastille il déplace — un banc dont l'étiquette s'efface ne sert
   pas à ce pour quoi on l'a fait.
   ⭐ `paint-order: stroke` peint le contour SOUS la lettre : le trait épaissit
   le fond, jamais le dessin de la lettre. Sans lui, le contour mange le glyphe
   de l'intérieur et le gras devient illisible. */
/* 🔴 LES BOÎTES — ancrées par leur COIN INFÉRO-MÉDIAL, décision d'Eric du
   2026-08-24. Médial : une seule règle pour les deux colonnes, qui se retourne
   correctement. Inférieur : le bord qui ne bouge pas quand le libellé passe à
   deux lignes — la boîte pousse alors vers le haut, et le point posé tient.
   ⏳ Leur COTE ici (109 × 60 unités) est celle du jeton standard 87 × 48 à
   l'échelle où ce banc se rend. Elle se recalculera quand la vraie mise en page
   existera : le jeton commande, le repère suit. ⛔ Ce n'est pas une cote figée.
   ⏳ ET LE CÔTÉ EST UN PLACEHOLDER : « à gauche si l'ancrage est à gauche du
   milieu ». C'est une règle que je pose faute d'en avoir une d'Eric — sur son
   croquis, la répartition gauche/droite est un choix, pas un calcul. */
.b3-boite { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .75; }
.b3-trait { stroke: var(--accent); stroke-width: 1.5; opacity: .45; }
/* ⭐ LE CONTOUR QUE FORMENT LES BOÎTES — Eric : *« on aurait dû dessiner la
   silhouette que génèrent les boîtes »*, puis *« voire les deux silhouettes »*.
   Le voici, superposable au corps : si les deux se ressemblent, son instinct
   était juste depuis le début. */
.b3-contour { fill: none; stroke: var(--critical); stroke-width: 3; stroke-dasharray: 12 8; opacity: .8; }
.b3-etiquette {
  fill: var(--text); font-size: 26px; font-family: inherit; pointer-events: none;
  paint-order: stroke; stroke: var(--bg); stroke-width: 6; stroke-linejoin: round;
}

/* ══ LA SCÈNE — importée de `b3-scene.mjs`, ses styles vivent dans
   `shell.css` : le banc REGARDE le produit, il ne le redessine pas. */
.b3-scene-panneau { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--sp-4); align-items: center; }
/* la borne du banc : 620 px de fenêtre pour un dressing qui doit prouver son
   défilement — la pièce fait 536, le flux DOIT déborder. */
.b3-scene-panneau .dressing { height: 620px; width: 413px; }
.b3-scene-panneau button { min-height: var(--touch); font: inherit; }

.banc-releve {
  flex: 1 1 220px; min-width: 0; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: var(--sp-8); font-size: var(--t1); font-variant-numeric: tabular-nums;
}
.banc-releve h2 { margin: 0 0 var(--sp-8); font-size: var(--t2); color: var(--text-muted); }
.banc-releve pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: var(--t1); color: var(--text-soft); }
.banc-releve button { margin-top: var(--sp-8); width: 100%; min-height: var(--touch); font: inherit; }
</style>

<body>
  <p class="banc-mesure" id="mesure">…</p>
  <div class="banc-scene">
    <!-- ══ LA SCÈNE : le dressing du croquis IMG_6099, boîtes au jeton 87 × 48.
         Sa géométrie vit dans `b3-disposition.mjs` — ce SVG ne fait que la
         rendre. Le corps est le filigrane du fond, jamais une contrainte. -->
    <div class="b3-scene-panneau">
      <!-- ⭐ Le +20 % est le DÉFAUT — ratifié par Eric (« +20 % parfait ! »).
           Le bouton ne sert plus qu'à COMPARER avec la taille croquis. -->
      <button type="button" id="corpsEchelle">Comparer : corps taille croquis</button>
    </div>
    <!-- 🔴 LE REPÈRE : 1000 de large, 1600 de haut. Deux raisons, et aucune
         n'est esthétique :
         · des NOMBRES RONDS — un ancrage à 500,240 se lit, se dicte et se
           retrouve ; à 487,233 il se recopie mal ;
         · le ratio 0,625, celui d'un corps debout, pour que la silhouette
           d'Eric entre sans être retaillée.
         ⏳ Ces deux nombres sont les SEULS de ce fichier qu'Eric peut vouloir
         changer, et les changer ne casse rien : les ancrages sont exprimés
         DEDANS, donc ils suivent. -->
    <svg class="b3-repere" viewBox="0 0 1000 1600" id="repere" aria-label="Le repère du dressing">
      <g class="b3-grille" id="grille"></g>
      <rect class="b3-cadre" x="1" y="1" width="998" height="1598"></rect>
      <!-- 🔴 LES DEUX CORPS, ET ILS SONT CALÉS SUR LEUR ENCRE — pas sur leur
           fichier. Mesuré : le monsieur fait 918 px d'encre, la dame 866, dans
           des fichiers de taille IDENTIQUE. Posés tels quels, la dame serait 6 %
           plus petite et les ancrages tomberaient à côté sur l'un des deux.
           ⭐ Les deux sont donc ramenés à **1400 unités de haut**, et leurs
           largeurs diffèrent (441 et 390) — c'est l'anatomie, pas un défaut.
           ⛔ EN MASQUE, PAS EN IMAGE : les PNG d'Eric ont un fond BLANC OPAQUE
           (0 % de pixels transparents, mesuré) ; posés tels quels sur la carte
           sombre, ils feraient un rectangle blanc. Transformés en masque, le
           corps est PEINT par un jeton — il suit le thème clair/sombre, et il
           reste une forme, pas une photo. -->
      <defs>
        <mask id="masque-h" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1600">
          <image href="./assets/pantin-h.png?v=483" x="280" y="100" width="441" height="1400"></image>
        </mask>
        <mask id="masque-f" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1600">
          <image href="./assets/pantin-f.png?v=483" x="305" y="100" width="390" height="1400"></image>
        </mask>
        <!-- 🔴 LA ZONE COMMUNE — Eric, 2026-08-24 : *« superpose les deux corps,
             je trouve le point moyen »*. ⛔ Ce n'est PAS une superposition à
             l'œil : c'est l'INTERSECTION, calculée pixel à pixel une fois les
             deux corps mis à la même hauteur d'encre. Mesuré : 78 % du monsieur
             et 90 % de la dame.
             ⭐ Un ancrage posé DEDANS tient sur les deux par construction — il
             n'y a plus rien à vérifier après coup. C'est la différence entre
             « ça a l'air de tomber juste » et « ça ne peut pas tomber faux ». -->
        <mask id="masque-x" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1600">
          <image href="./assets/pantin-x.png?v=483" x="280" y="100" width="441" height="1400"></image>
        </mask>
      </defs>
      <!-- Les deux en filigrane, la zone commune par-dessus : on voit d'un coup
           ce qui déborde de l'un ou de l'autre, et ce qui appartient aux deux. -->
      <rect class="b3-fantome" id="fantomeH" x="0" y="0" width="1000" height="1600" mask="url(#masque-h)" hidden></rect>
      <rect class="b3-fantome" id="fantomeF" x="0" y="0" width="1000" height="1600" mask="url(#masque-f)" hidden></rect>
      <rect class="b3-corps" id="corps" x="0" y="0" width="1000" height="1600" mask="url(#masque-h)"></rect>      <g id="boites"></g>
      <g id="ancres"></g>
    </svg>

    <aside class="banc-releve">
      <h2>Les dix ancrages</h2>
      <pre id="json">…</pre>
      <button type="button" id="copier">Copier le JSON</button>
      <button type="button" id="corpsSuivant">Voir l'autre corps</button>
      <button type="button" id="remettre">Remettre au départ</button>
    </aside>
  </div>

<script type="module">
/* ⛔ LES DIX ANCRAGES NE SONT PAS DÉCLARÉS ICI — ils vivent dans
   `b3-ancrages.mjs`, et ce banc les LIT. C'est la loi qu'on applique partout
   depuis cette nuit : une seule écriture, plusieurs lecteurs. Les recopier ici
   ferait de ce banc une seconde vérité, et il finirait par montrer autre chose
   que l'écran — exactement ce que le repère est censé rendre impossible. */
import { ANCRAGES as EMPLACEMENTS } from "./b3-ancrages.mjs?v=483";
import { CORPS_EN_SCENE } from "./b3-disposition.mjs?v=483";
/* ⭐ LA SCÈNE EST IMPORTÉE, PLUS DESSINÉE ICI — même couture que la carte R :
   le banc regarde le produit (`b3-scene.mjs`), il ne peut plus montrer autre
   chose que lui. Les APERÇUS (faux ×N) sont une option de banc. */
import { construireLeDressing } from "./b3-dressing.mjs?v=483";

const SVG = "http://www.w3.org/2000/svg";
const REPERE_MILIEU = 500;
let corpsCourant = "h";
const NOM_CORPS_AVANCE = null;
const repere = document.getElementById("repere");
const hote = document.getElementById("ancres");
const sortie = document.getElementById("json");
const mesure = document.getElementById("mesure");

/* La grille du repère, tous les 100 — elle donne à l'œil de quoi juger une
   position sans avoir à lire un chiffre. */
{
  const g = document.getElementById("grille");
  for (let x = 100; x < 1000; x += 100) {
    const l = document.createElementNS(SVG, "line");
    l.setAttribute("x1", x); l.setAttribute("y1", 0);
    l.setAttribute("x2", x); l.setAttribute("y2", 1600);
    g.append(l);
  }
  for (let y = 100; y < 1600; y += 100) {
    const l = document.createElementNS(SVG, "line");
    l.setAttribute("x1", 0); l.setAttribute("y1", y);
    l.setAttribute("x2", 1000); l.setAttribute("y2", y);
    g.append(l);
  }
}

const etat = EMPLACEMENTS.map((e) => ({ ...e }));

/* La colonne : son bord MÉDIAL, juste au-delà de l'emprise du corps (280..721). */
const BOITE = { l: 109, h: 60, medialG: 262, medialD: 739 };

function dessinerBoites() {
  const hote = document.getElementById("boites");
  hote.textContent = "";
  const coins = [];
  for (const e of etat) {
    const aGauche = e.x < REPERE_MILIEU;
    const xMedial = aGauche ? BOITE.medialG : BOITE.medialD;
    const x = aGauche ? xMedial - BOITE.l : xMedial;
    const y = e.y - BOITE.h;                    // ⭐ le coin INFÉRIEUR est à la hauteur de l'ancrage
    const r = document.createElementNS(SVG, "rect");
    r.setAttribute("class", "b3-boite");
    r.setAttribute("x", x); r.setAttribute("y", y);
    r.setAttribute("width", BOITE.l); r.setAttribute("height", BOITE.h);
    r.setAttribute("rx", 6);
    const t = document.createElementNS(SVG, "line");
    t.setAttribute("class", "b3-trait");
    t.setAttribute("x1", e.x); t.setAttribute("y1", e.y);
    t.setAttribute("x2", xMedial); t.setAttribute("y2", e.y);
    hote.append(t, r);
    coins.push([x, y], [x + BOITE.l, y + BOITE.h]);
  }
  /* Le contour : l'enveloppe des boîtes, à comparer avec la silhouette. */
  const xs = coins.map((c) => c[0]), ys = coins.map((c) => c[1]);
  const env = document.createElementNS(SVG, "rect");
  env.setAttribute("class", "b3-contour");
  env.setAttribute("x", Math.min(...xs)); env.setAttribute("y", Math.min(...ys));
  env.setAttribute("width", Math.max(...xs) - Math.min(...xs));
  env.setAttribute("height", Math.max(...ys) - Math.min(...ys));
  hote.append(env);
}

function dessiner() {
  hote.textContent = "";
  for (const e of etat) {
    const cercle = document.createElementNS(SVG, "circle");
    cercle.setAttribute("class", "b3-ancre");
    cercle.setAttribute("cx", e.x); cercle.setAttribute("cy", e.y);
    cercle.setAttribute("r", 22);
    cercle.dataset.clef = e.clef;
    /* ⭐ IL S'ANNONCE : un ancrage qu'on déplace au doigt est un contrôle, et
       un contrôle sans nom est invisible à qui ne voit pas l'écran. */
    cercle.setAttribute("role", "img");
    cercle.setAttribute("aria-label", `${e.nom} — ${e.n} objets`);
    const mot = document.createElementNS(SVG, "text");
    mot.setAttribute("class", "b3-etiquette");
    mot.setAttribute("x", e.x + 32); mot.setAttribute("y", e.y + 9);
    mot.textContent = `${e.nom} ${e.n}`;
    hote.append(cercle, mot);
    armer(cercle, mot, e);
  }
  dessinerBoites();
  relever();
}

/* ⭐ DU PIXEL D'ÉCRAN AU POINT DU REPÈRE, ET C'EST LA SEULE CONVERSION DU
   FICHIER. `getScreenCTM().inverse()` la fait exactement, quelle que soit la
   mise à l'échelle — ⛔ calculer un ratio à la main ici, c'est recréer un
   second repère, et c'est précisément ce qu'on refuse. */
function pointDuRepere(evt) {
  const p = repere.createSVGPoint();
  p.x = evt.clientX; p.y = evt.clientY;
  return p.matrixTransform(repere.getScreenCTM().inverse());
}

function armer(cercle, mot, e) {
  cercle.addEventListener("pointerdown", (evt) => {
    evt.preventDefault();
    cercle.setPointerCapture(evt.pointerId);
    cercle.dataset.pris = "oui";
  });
  cercle.addEventListener("pointermove", (evt) => {
    if (cercle.dataset.pris !== "oui") return;
    const p = pointDuRepere(evt);
    /* ⛔ ARRONDI À L'ENTIER : une coordonnée à 487,3164 ne se dicte pas, ne se
       recopie pas et ne se retrouve pas. Le repère est assez fin pour que
       l'entier suffise — 1 unité vaut un millième de la hauteur. */
    e.x = Math.max(0, Math.min(1000, Math.round(p.x)));
    e.y = Math.max(0, Math.min(1600, Math.round(p.y)));
    cercle.setAttribute("cx", e.x); cercle.setAttribute("cy", e.y);
    mot.setAttribute("x", e.x + 32); mot.setAttribute("y", e.y + 9);
    dessinerBoites();
    relever();
  });
  const lacher = () => { delete cercle.dataset.pris; relever(); };
  cercle.addEventListener("pointerup", lacher);
  cercle.addEventListener("pointercancel", lacher);
}

function relever() {
  const carte = {};
  for (const e of etat) carte[e.clef] = [e.x, e.y];
  sortie.textContent = JSON.stringify(carte, null, 1);
  const r = repere.getBoundingClientRect();
  const echelle = (r.width / 1000);
  mesure.textContent =
    `repère 1000 × 1600 · rendu ${Math.round(r.width)} × ${Math.round(r.height)} px ` +
    `· 1 unité = ${echelle.toFixed(3)} px · corps : ${NOM_CORPS[corpsCourant]} ` +
    `— ⭐ les ancrages ne bougent ni avec l'échelle ni avec le corps`;
}

document.getElementById("copier").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(sortie.textContent); }
  catch { /* ⛔ un refus du presse-papier n'est pas une panne : le JSON est à l'écran */ }
});
/* 🔴 LES DEUX CORPS SE REGARDENT AVEC LES MÊMES ANCRAGES — c'est tout l'objet
   de ce bouton. Un ancrage juste sur le monsieur et faux sur la dame n'est pas
   un ancrage, c'est un réglage. ⭐ Et rien ne bouge en changeant de corps : les
   pastilles vivent dans le repère, pas sur l'image. */
const TOUR = ["h", "f", "x"];
const NOM_CORPS = { h: "monsieur", f: "dame", x: "ZONE COMMUNE aux deux" };
document.getElementById("corpsSuivant").addEventListener("click", () => {
  corpsCourant = TOUR[(TOUR.indexOf(corpsCourant) + 1) % TOUR.length];
  document.getElementById("corps").setAttribute("mask", `url(#masque-${corpsCourant})`);
  /* ⭐ EN MODE « ZONE COMMUNE », LES DEUX CORPS PARAISSENT EN FILIGRANE : sans
     eux on verrait l'intersection sans savoir ce qu'elle a retiré, et on ne
     saurait pas de QUEL côté un point est trop loin. */
  const filigrane = corpsCourant === "x";
  document.getElementById("fantomeH").hidden = !filigrane;
  document.getElementById("fantomeF").hidden = !filigrane;
  laScene.peindre({ corps: corpsCourant === "f" ? "f" : "h" });   /* la scène suit l'atelier (h/f) */
  relever();
});

document.getElementById("remettre").addEventListener("click", () => {
  etat.forEach((e, i) => { e.x = EMPLACEMENTS[i].x; e.y = EMPLACEMENTS[i].y; });
  dessiner();
});

/* ══ LE DRESSING EN TROIS BANDES — monté depuis le module du produit ═══════
   ⭐ Avec de FAUSSES lignes de sac (aperçu de banc) : un flux qui ne déborde
   pas ne prouverait rien sur le défilement — on juge les bandes immobiles
   PENDANT que le flux bouge (GOOGLE HEADLESS, banc-parcours #dressing). */
const lignesDemo = Array.from({ length: 14 }, (_, i) => ({
  index: i, ref: { id: `demo-${i}` }, nomAffiche: `Demo item ${i + 1}`,
  quantity: 1 + (i % 3), location: i < 10 ? "backpack" : "storage",
}));
const leDressing = construireLeDressing({ apercus: true, lignes: lignesDemo,
  onAction: () => {}, surBouton: () => {} });
const laScene = { noeud: leDressing.noeud, peindre: leDressing.peindreScene };
document.querySelector(".b3-scene-panneau").prepend(leDressing.noeud);
let echelleCorps = 0;

document.getElementById("corpsEchelle").addEventListener("click", (evt) => {
  echelleCorps = (echelleCorps + 1) % CORPS_EN_SCENE.echelles.length;
  evt.target.textContent = echelleCorps
    ? "Revenir au corps +20 % (le défaut)"
    : "Comparer : corps taille croquis";
  laScene.peindre({ echelle: CORPS_EN_SCENE.echelles[echelleCorps] });
});

dessiner();
window.addEventListener("resize", relever);
</script>
</body>
</html>
