<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FHPC — banc du sac (SB3.1)</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     LE BANC DU SAC (lot 214) — l'écran seul, sur sa dalle, sans le builder.
     Il existe pour REGARDER le rendu : les gardes lisent des fichiers, ils ne
     voient pas ce que l'œil reçoit (NORMES §0).
     ⛔ IL NE PORTE AUCUNE COTE ET AUCUN HABIT. Tout vient de `tokens.css`, de
     `shell.css` et de la feuille que `sac-ecran.mjs` construit depuis la table
     générée. Si quelque chose est faux ici, c'est faux dans le produit.
     ══════════════════════════════════════════════════════════════════════ -->

<!-- ⚠️ LES TROIS FEUILLES DU PRODUIT, DANS SON ORDRE. `fiche.css` porte l'habit
     du livre et du `?` ; sans elle le banc les rendait nus et j'ai failli croire
     que l'écran était faux. ⛔ Un banc qui charge moins que le produit MENT. -->
<link rel="stylesheet" href="./tokens.css?v=656">
<link rel="stylesheet" href="./shell.css?v=656">
<link rel="stylesheet" href="./fiche.css?v=656">
<style>
  /* ⛔ L'ÉCHAFAUDAGE, ET RIEN D'AUTRE : la largeur du panneau et la hauteur
     d'une scène (560 − 60 de belt). */
  body { margin: 0; background: var(--bg, #1b1712); display: flex; justify-content: center; }
  .banc { width: 375px; height: 560px; display: flex; flex-direction: column; }
  .banc-belt {
    height: 60px; flex: none; display: flex; align-items: center; justify-content: center;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-soft); box-shadow: inset 0 -1px 0 var(--border-strong);
  }
  .banc-scene { flex: 1 1 auto; min-height: 0; position: relative; display: flex; }
</style>
</head>
<body>
<div class="banc">
  <div class="banc-belt">belt — Équipement › Sac</div>
  <div class="banc-scene" id="scene"></div>
</div>
<script type="module">
import { construireLeSac } from "./sac-ecran.mjs?v=656";

/* LES SECTIONS DE DÉMONSTRATION — celles qu'un joueur aurait créées. ⛔ Aucune
   de ces valeurs n'est une donnée du produit. */
const SECTIONS = [{ nom: "Potions" }, { nom: "Camp" }, { nom: "Section 3" },
                  { nom: "Trésor" }, { nom: "Composants" }];
let section = 0;

/* ⭐ DOUZE PLACES, dont des trous : une grille pleine cacherait le creux d'une
   case vide, et c'est lui qui dit « pose ici ». */
const OBJETS = [
  { index: 1, nom: "Belt of Dwarvenkind", qte: 1, equipped: true, attuned: true, locked: true },
  { index: 2, nom: "Potion of Healing", qte: 4 },
  { index: 3, nom: "Rope, hempen (50 feet)", qte: 1 },
  null,
  { index: 5, nom: "Arrow", qte: 20 },
  { index: 6, nom: "Winged Helmet", qte: 2, equipped: true },
  { index: 7, nom: "Dagger", qte: 2, locked: true },
  null, null,
  { index: 10, nom: "Spellbook", qte: 1, attuned: true },
  null, null
];

function peindre() {
  const { noeud } = construireLeSac({
    sections: SECTIONS, section, objets: OBJETS,
    poids: { gear: "Gear — 12 obj. · 34,5 lb",
             backpack: "Backpack — 8 obj. · 12 lb",
             encombrement: "Encumbrance — 20 obj. · 46,5 lb" },
    destinations: [{ valeur: "backpack", mot: "Backpack", actif: true },
                   { valeur: "self", mot: "Gear", actif: true },
                   { valeur: "tally", mot: "Tally", actif: false }],
    destination: "backpack",
    surTourner: (sens) => { section = (section + sens + SECTIONS.length) % SECTIONS.length; rendre(); },
    surSection: (i) => { section = i; rendre(); },
    surJeton: () => {}, surTrier: () => {}, surSections: () => {},
    surDestination: () => {}, surPorte: () => {}
  });
  return noeud;
}
function rendre() {
  const scene = document.getElementById("scene");
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  scene.append(peindre());
}
rendre();
</script>
</body>
</html>
