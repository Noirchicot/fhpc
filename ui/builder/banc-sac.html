<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FHPC — banc du sac (SB3.1)</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     LE BANC DU SAC (lot 214) — l'écran seul, sur sa dalle, sans le builder.
     Il existe pour REGARDER le rendu : les gardes lisent des fichiers, ils ne
     voient pas ce que l'œil reçoit (NORMES §0).
     ⛔ IL NE PORTE AUCUNE COTE ET AUCUN HABIT. Tout vient de `tokens.css`, de
     `shell.css` et de la feuille que `sac-ecran.mjs` construit depuis la table
     générée. Si quelque chose est faux ici, c'est faux dans le produit.
     ══════════════════════════════════════════════════════════════════════ -->

<!-- ⚠️ LES TROIS FEUILLES DU PRODUIT, DANS SON ORDRE. `fiche.css` porte l'habit
     du livre et du `?` ; sans elle le banc les rendait nus et j'ai failli croire
     que l'écran était faux. ⛔ Un banc qui charge moins que le produit MENT. -->
<link rel="stylesheet" href="./tokens.css?v=815">
<link rel="stylesheet" href="./shell.css?v=815">
<link rel="stylesheet" href="./fiche.css?v=815">
<style>
  /* ⛔ L'ÉCHAFAUDAGE, ET RIEN D'AUTRE : la largeur du panneau et la hauteur
     d'une scène (560 − 60 de belt). */
  body { margin: 0; background: var(--bg, #1b1712); display: flex; justify-content: center; }
  .banc { width: 375px; height: 560px; display: flex; flex-direction: column; }
  .banc-belt {
    height: 60px; flex: none; display: flex; align-items: center; justify-content: center;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-soft); box-shadow: inset 0 -1px 0 var(--border-strong);
  }
  .banc-scene { flex: 1 1 auto; min-height: 0; position: relative; display: flex; }
</style>
</head>
<body>
<div class="banc">
  <div class="banc-belt">belt — Équipement › Sac</div>
  <div class="banc-scene" id="scene"></div>
</div>
<script type="module">
import { construireLeSac, poserLesDalles } from "./sac-ecran.mjs?v=815";

/* LES SECTIONS DE DÉMONSTRATION — celles qu'un joueur aurait créées. ⛔ Aucune
   de ces valeurs n'est une donnée du produit. */
/* ⭐ ET LE PARTY INVENTORY EST LÀ D'ENTRÉE DE JEU, EN DERNIER — Eric, 19/09. Il
   porte `fige` : ni renommé, ni supprimé. Le banc doit le montrer, sinon on ne voit
   jamais le champ refuser de s'ouvrir ni le `−` s'éteindre. */
const SECTIONS = [
  { nom: "Party bag", party: true, fige: true, renommable: false },
  { nom: "Backpack dropdown", renommable: false },
  { nom: "Storage 1" }, { nom: "Storage 2" },
  /* ⭐ ET UNE PLACE HORS DU SAC — Eric, 2026-09-20 : *« je veux mon doré pour les
     other »*. ⛔ Sans elle le banc ne peut RIEN montrer de l'or : aucun des cinq crans
     ne portait `dehors`, et le genre restait une règle sans sujet. C'est le même
     défaut que le ruban à une seule plaque — un banc qui ne peut pas montrer l'organe
     ne prouve rien de lui. */
  { nom: "Red chest", dehors: true }];
let section = 0;
/* ⭐ LE MODE ÉDITION SE REGARDE, DONC LE BANC LE PORTE : le bouton `Sections`
   l'allume, et on voit le champ, le `+` et le `−` comme le joueur les verra. */
let edition = false;
/* le champ ne s'ouvre que par la poignée `/` — Eric, 19/09 */
let renommage = false;
/* l'objet que le collecteur retient — un seul (Eric, 16/09) */
let retenu = null;

/* ⭐ DOUZE PLACES, dont des trous : une grille pleine cacherait le creux d'une
   case vide, et c'est lui qui dit « pose ici ». */
let page = 0;
const TOUT = [
  { index: 1, nom: "Belt of Dwarvenkind", qte: 1, equipped: true, attuned: true, locked: true },
  { index: 2, nom: "Potion of Healing", qte: 4 },
  { index: 3, nom: "Rope, hempen (50 feet)", qte: 1 },
  null,
  { index: 5, nom: "Arrow", qte: 20 },
  { index: 6, nom: "Winged Helmet", qte: 2, equipped: true },
  { index: 7, nom: "Dagger", qte: 2, locked: true },
  null, null,
  { index: 10, nom: "Spellbook", qte: 1, attuned: true },
  null, null,
  /* ⭐ QUATRE DE PLUS QUE LA GRILLE : le banc doit montrer le DÉBORD, sinon on ne
     voit jamais la seconde page ni la molette qui la tourne. */
  { index: 11, nom: "Torch", qte: 10 },
  { index: 12, nom: "Rations (1 day)", qte: 5 },
  { index: 13, nom: "Hooded Lantern", qte: 1 },
  { index: 14, nom: "Oil (flask)", qte: 3 }
];
const PAGES = Math.ceil(TOUT.length / 12);
const OBJETS = () => TOUT.slice(page * 12, (page + 1) * 12);

/* ══ LE RUBAN DE PLAQUES — une plaque par (section, page) ════════════════
   🔴 CE BANC N'EN CONSTRUISAIT QU'UNE, ET C'EST LE TROU QUI A LAISSÉ PASSER LE
   DÉCALAGE DU 19/09. Sans `dalles`, l'écran retombe sur une plaque unique : le ruban
   ne peut alors RIEN décaler, aucun relevé fait ici ne pouvait voir le chemin
   inverse, et la faute a vécu jusqu'à ce qu'Eric la voie sur son iPad.
   ⛔ Un banc qui ne peut pas montrer l'organe ne prouve rien de lui — après
   *« une souris ne prouve rien d'un doigt »* et *« le volet occulté suspend les
   images »*, c'est le troisième de la série.
   ⭐ La première section porte le DÉBORD (seize objets, donc deux plaques) : on voit
   ainsi une section qui vaut DEUX plaques, le cas que le lien roue↔plaques doit
   traiter et qu'une simple multiplication raterait. */
const DALLES = [];
for (let i = 0; i < SECTIONS.length; i += 1) {
  const siens = i === 0 ? TOUT : TOUT.slice(i * 3, i * 3 + 5);
  const pagesI = Math.max(1, Math.ceil(siens.length / 12));
  for (let pg = 0; pg < pagesI; pg += 1)
    DALLES.push({ section: i, page: pg, objets: siens.slice(pg * 12, (pg + 1) * 12) });
}
const DALLE_DE = () => Math.max(0, DALLES.findIndex((d) => d.section === section && d.page === page));

function peindre() {
  const { noeud } = construireLeSac({
    sections: SECTIONS, section, edition, renommage, objets: OBJETS(),
    /* ⭐ ET LE RUBAN EST PASSÉ POUR DE VRAI — avec sa plaque courante. */
    dalles: DALLES, dalle: DALLE_DE(),
    surDalle: (k) => { const d = DALLES[k]; if (!d) return; section = d.section; page = d.page; },
    poids: { gear: { poids: "Gear : 5", compte: "5 items" },
             backpack: { poids: "Backpack 22", compte: "22 items" },
             autre: { poids: "Other 61", compte: "7 items" },
             encombrement: "Encumbrance : 27" },
    compte: `${TOUT.filter(Boolean).length} items`,
    page: `${page + 1}/${PAGES}`, pages: PAGES,
    surPage: (sens) => { page = ((page + sens) % PAGES + PAGES) % PAGES; rendre(); },
    dropArme: retenu !== null, retenu,
    /* le parchemin personnel porte trois lignes, celui du groupe est vide : on
       voit ainsi les DEUX états de l'image, allumé et effacé */
    compteurs: { tally: 3, "party-tally": 0 },
    destinations: [{ valeur: "backpack", mot: "Backpack", actif: true },
                   { valeur: "self", mot: "Gear", actif: true },
                   { valeur: "tally", mot: "Tally", actif: false }],
    destination: "backpack",
    /* ⛔ en édition le ruban ne boucle pas, et il porte une place de plus (le `+`) :
       le banc borne donc comme l'écran, il ne recopie pas une autre règle. */
    surTourner: (sens) => {
      const haut = edition ? SECTIONS.length : SECTIONS.length - 1;
      section = edition
        ? Math.min(Math.max(0, section + sens), haut)
        : (section + sens + SECTIONS.length) % SECTIONS.length;
      rendre();
    },
    surSection: (i) => { section = i; rendre(); },
    surSections: () => { edition = !edition; renommage = false; rendre(); },
    surEditer: () => { renommage = !renommage; rendre(); },
    surAjouter: (ou) => { SECTIONS.splice(section + 1, 0,
      { nom: `Section ${SECTIONS.length}`, dehors: ou === "dehors" }); rendre(); },
    surRenommer: (i, nom) => { if (nom.trim() && SECTIONS[i].renommable !== false) SECTIONS[i].nom = nom.trim().slice(0, 22); renommage = false; rendre(); },
    surSupprimer: () => {
      if (SECTIONS.length <= 1 || SECTIONS[section].fige) return;
      SECTIONS.splice(section, 1);
      section = Math.min(section, SECTIONS.length - 1);
      rendre();
    },
    surJeton: () => {}, surTrier: () => {},
    surCollecte: (i) => { retenu = i; rendre(); },
    surPlacer: () => { retenu = null; rendre(); },
    surDrop: () => { retenu = null; rendre(); },
    surDestination: () => {}, surPorte: () => {}
  });
  return noeud;
}
function rendre() {
  const scene = document.getElementById("scene");
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  scene.append(peindre());
  poserLesDalles();          /* ⭐ la roue se pose APRÈS son insertion — voir `sac-ecran.mjs` */
}
rendre();
</script>
</body>
</html>
