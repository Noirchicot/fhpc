<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FHPC — banc de X1, la fiche d'un objet possédé</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     LE BANC DE X1 (lot 213) — la fiche seule, sur sa dalle, sans le builder.
     Il existe pour une raison précise : REGARDER le rendu. NORMES §0 :
     *« une norme se vérifie sur la PAGE RENDUE, pas dans la source »*, et les
     gardes de `tests/x1-ecran.test.mjs` lisent des fichiers — ils ne voient
     pas ce que l'œil reçoit.

     ⛔ IL NE PORTE AUCUNE COTE ET AUCUN HABIT. Tout vient de `tokens.css`,
     `shell.css` et de la feuille que `x1-ecran.mjs` construit depuis la table
     générée. Ce fichier ne fait que MONTER l'écran avec un objet de démons-
     tration — si quelque chose est faux ici, c'est faux dans le produit.
     ══════════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="./tokens.css?v=817">
<link rel="stylesheet" href="./shell.css?v=817">
<style>
  /* ⛔ L'ÉCHAFAUDAGE, ET RIEN D'AUTRE : la dalle du builder n'est pas là pour
     porter la fiche, on la simule au strict minimum — la largeur du panneau et
     la hauteur d'une scène (560 − 60 de belt). */
  body { margin: 0; background: var(--bg, #1b1712); display: flex; justify-content: center; }
  .banc { width: 375px; height: 560px; display: flex; flex-direction: column; }
  .banc-belt {
    height: 60px; flex: none; display: flex; align-items: center; justify-content: center;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-soft); box-shadow: inset 0 -1px 0 var(--border-strong);
  }
  .banc-scene { flex: 1 1 auto; min-height: 0; position: relative; display: flex; }
  /* ⛔ LA BARRE DU BANC N'EST PAS DU PRODUIT — lot 219. Elle existe pour qu'on
     puisse REGARDER les six rendus (jour/nuit × normal/party-tally, à deux
     hauteurs) sans recompiler ni tripoter le système. Tout ce qu'elle porte est
     de l'échafaudage, et c'est pour ça qu'il est écrit ici et nulle part ailleurs. */
  .banc-barre {
    position: fixed; inset: 0 0 auto; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px;
    padding: 6px 8px; background: #000c; font: 600 11px/1 system-ui, sans-serif;
  }
  .banc-barre button {
    border: 1px solid #666; border-radius: 6px; padding: 5px 8px;
    background: #222; color: #ddd; font: inherit; cursor: pointer;
  }
  .banc-barre button[aria-pressed="true"] { background: #e8ddc6; color: #201a12; border-color: #e8ddc6; }
  .banc { margin-top: 34px; }
  /* ⭐ LES TROIS HAUTEURS SONT DES CLASSES, ⛔ PAS DES STYLES EN LIGNE : le banc
     n'est pas soumis au garde 7 (qui ne lit que les `.mjs`), mais un banc qui
     prend une liberté que le produit n'a pas cesse de prouver quoi que ce soit. */
  .banc[data-h="courte"] { height: 420px; }
  .banc[data-h="normale"] { height: 560px; }
  .banc[data-h="longue"] { height: 760px; }
  /* ⛔ JOUR / NUIT NE SONT PAS DES BOUTONS ICI, ET C'EST EXPRÈS : `tokens.css`
     les porte en `@media (prefers-color-scheme: dark)`, donc le seul témoin
     honnête est la préférence RÉELLE du navigateur. Un attribut de banc
     court-circuiterait la requête média et prouverait autre chose que le produit. */
</style>
</head>
<body>
<div class="banc-barre" id="barre">
  <button type="button" data-geste="palette" aria-pressed="false">❄ Party Tally (bleutée)</button>
  <button type="button" data-geste="h" data-val="courte" aria-pressed="false">420</button>
  <button type="button" data-geste="h" data-val="normale" aria-pressed="true">560</button>
  <button type="button" data-geste="h" data-val="longue" aria-pressed="false">760</button>
  <button type="button" data-geste="prose" aria-pressed="false">texte court</button>
</div>
<div class="banc" id="banc" data-h="normale">
  <div class="banc-belt">belt — X1 ne le recouvre jamais</div>
  <div class="banc-scene" id="scene"></div>
</div>
<script type="module">
import { construireLaFicheX1 } from "./x1-ecran.mjs?v=817";

/* L'OBJET DE DÉMONSTRATION — le même que le plan coté montre, pour qu'on
   compare le rendu au dessin sans traduire. ⛔ Aucune de ces valeurs n'est une
   donnée du produit : elles viennent du croquis d'Eric. */
const etat = { equipped: true, attuned: true, locked: true };
let nombre = 1;
let lecture = false;

function poser() {
  const { noeud } = construireLaFicheX1({
    objet: {
      index: 0, nom: "Winged Helmet", qte: 2,
      prixUnite: "15 gp", prixTotal: "30 gp",
      poidsUnite: "3 lb", poidsTotal: "6 lb",
      /* ⭐ UN TEXTE LOURD, ET C'EST LE POINT DU BANC — Eric, 17/09 au soir : *« mets un
         objet magique lourd en texte pour voir »*. La zone défile, et les chevrons de la
         marge droite doivent s'allumer : c'est ce qu'on vient regarder ici.
         ⛔ Prose écrite pour ce banc, pas recopiée d'un livre : le dépôt est public. */
      /* ⭐ LOT 219 — ET LE TEXTE COURT EST L'AUTRE MOITIÉ DU BANC : la spec
         demande *« une hauteur courte et une hauteur longue avec plus de
         texte »*. Un parchemin qui tient sur un texte long peut très bien
         s'effondrer sur trois mots — la zone élastique change de hauteur, donc
         la dalle aussi, donc le contour. */
      prose: courtTexte ? "A plain bronze cap. Nothing further is recorded." :
             "A winged helmet of hammered bronze, its plumes catching a light that is " +
             "not in the room.\n" +
             "While wearing it you gain a flying speed of 30 feet, and you can hover. " +
             "If you are not proficient with medium armor, your speed is halved and you " +
             "have disadvantage on Dexterity saves while aloft.\n" +
             "The helmet has 3 charges and regains 1d3 expended charges daily at dawn. " +
             "While wearing it, you can expend 1 charge to cast Feather Fall, or 2 to " +
             "cast Levitate. A creature that sees you cast either spell this way must " +
             "succeed on a DC 13 Wisdom save or believe, for one minute, that you are " +
             "owed a debt it cannot name.\n" +
             "If you expend the last charge, roll a d20. On a 1, the plumes fall still " +
             "and the helmet becomes a nonmagical, rather heavy hat until someone tells " +
             "it a true story about flight.\n" +
             "Curse: while attuned, you cannot bring yourself to descend a staircase " +
             "that you could instead jump down.\n" +
             "Properties: light, finesse\nAC: 13 + Dex modifier\n" +
             "Weight: 3 lb. · Rarity: rare · Attunement: required",
      genre: "armor",
      ...etat
    },
    nombre,
    destination: "backpack",
    surNombre: (n) => { nombre = n; },
    surDestination: () => {},
    surEtat: (clef, valeur) => { etat[clef] = valeur; peindre(); },
    lecture,
    surLecture: (v) => { lecture = v; peindre(); },
    surCopier: () => {},
    surPorte: () => {}
  });
  return noeud;
}
/* ══ LOT 219 — LA BARRE DU BANC, ET CE QU'ELLE SERT À VOIR ═══════════════
   Six rendus : {jour, nuit} × {normal, party-tally}, chacun à trois hauteurs.
   ⛔ Le jour et la nuit ne sont PAS ici — ils viennent de la préférence du
   navigateur, parce que c'est comme ça que `tokens.css` les écrit. */
let party = false;
let courtTexte = false;

function peindre() {
  const scene = document.getElementById("scene");
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  const noeud = poser();
  /* ⏳ CE GESTE N'EXISTE QUE SUR LE BANC, et c'est la moitié du sujet : le
     Party Tally est `inerte` au dépôt (`sac-ecran.mjs`), donc aucune fiche du
     produit ne peut porter cet attribut aujourd'hui. Le banc le pose à la main
     pour qu'on puisse REGARDER la palette qu'Eric a validée — ⛔ il ne prétend
     pas que le chemin existe. */
  if (party) noeud.dataset.parchemin = "party-tally";
  scene.append(noeud);
}

document.getElementById("barre").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.geste === "palette") {
    party = !party;
    b.setAttribute("aria-pressed", String(party));
  } else if (b.dataset.geste === "h") {
    document.getElementById("banc").dataset.h = b.dataset.val;
    for (const f of document.querySelectorAll('[data-geste="h"]'))
      f.setAttribute("aria-pressed", String(f === b));
    return;   /* ⭐ la hauteur ne repeint PAS : c'est le `ResizeObserver` du
                 parchemin qu'on vient éprouver — s'il dort, on le verra. */
  } else if (b.dataset.geste === "prose") {
    courtTexte = !courtTexte;
    b.setAttribute("aria-pressed", String(courtTexte));
  }
  peindre();
});
peindre();
</script>
</body>
</html>
