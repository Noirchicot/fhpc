<!doctype html><meta charset="utf-8">
<!-- ══ LE BANC DE PARCOURS — il joue le pipeline ENTIER dans un vrai Chrome ══
     Usage :  node bin/… (générer les graines, voir ci-dessous), puis
       chrome --headless=new --screenshot=…  "http://localhost:PORT/ui/builder/banc-parcours.html#SCENARIO"
     Scénarios : b3 · b3equipe · b1 · b2 · sb31 · sb32.
     Graines (non commitées, à générer depuis la racine du dépôt) :
       node -e "const{exempleFhEn}=await import('./src/tools/exemple-fh-en.mjs');
         (await import('node:fs')).writeFileSync('fixture-banc.json',
         JSON.stringify(exempleFhEn().document));" --input-type=module
     ⭐ C'est CE banc qui a attrapé le clic mort des crans (Event ≠ nœud) le
     24/08 — un parcours joué vaut mieux qu'un rendu regardé. -->
<style>html,body{margin:0;height:100%}iframe{border:0;width:100vw;height:100vh}</style>
<script type="module">
const scenario = location.hash.slice(1) || "b3";
/* #dressing : PAS l'app — le banc ecran-b3.html, qui monte les trois bandes.
   La mesure (GOOGLE HEADLESS) : le flux défile, le titre et la barre ne
   bougent pas d'un pixel. */
if (scenario === "dressing") {
  const f2 = document.createElement("iframe");
  f2.src = "./ecran-b3.html?v=600";
  f2.addEventListener("load", async () => {
    const d = f2.contentDocument;
    await new Promise((r) => setTimeout(r, 700));
    const flux = d.querySelector(".dressing-flux");
    const titre = d.querySelector(".dressing-titre").getBoundingClientRect();
    const barre = d.querySelector(".dressing-barre").getBoundingClientRect();
    flux.scrollTop = 300;
    await new Promise((r) => setTimeout(r, 200));
    const titre2 = d.querySelector(".dressing-titre").getBoundingClientRect();
    const barre2 = d.querySelector(".dressing-barre").getBoundingClientRect();
    document.title =
      "scroll=" + Math.round(flux.scrollTop) +
      " titreBouge=" + Math.abs(titre2.top - titre.top).toFixed(1) +
      " barreBouge=" + Math.abs(barre2.top - barre.top).toFixed(1) +
      " deborde=" + (flux.scrollHeight > flux.clientHeight);
  });
  document.body.append(f2);
  throw new Error("scenario dressing: fin"); // court-circuite le reste du module
}
const graine = scenario === "b3equipe" ? "/fixture-equipe.json"
  : (scenario === "b2" || scenario === "mesureB2") ? "/fixture-panier.json"
  : "/fixture-banc.json";
localStorage.setItem("fhpc.personnage", await (await fetch(graine)).text());
const f = document.createElement("iframe");
f.src = "./index.html?v=600";
const dors = (ms) => new Promise((r) => setTimeout(r, ms));
const tape = (n) => { // le tap d'armerJeton : pointerdown puis pointerup, sans mouvement
  for (const type of ["pointerdown", "pointerup"]) {
    n.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 1, isPrimary: true,
      clientX: 10, clientY: 10 }));
  }
};
f.addEventListener("load", async () => {
  try {
  const d = f.contentDocument;
  const q = (s) => d.querySelector(s);
  const tous = (s) => [...d.querySelectorAll(s)];
  await dors(800);
  tous("button").find((b) => b.textContent.includes("Equipment"))?.click();
  await dors(500);
  if (scenario === "b3" || scenario === "b3equipe") {
    /* les trois bandes AU PRODUIT : le flux défile, les bandes non. */
    const flux = d.querySelector(".dressing-flux");
    if (flux) {
      const t1 = d.querySelector(".dressing-titre").getBoundingClientRect().top;
      const b1 = d.querySelector(".dressing-barre").getBoundingClientRect().top;
      flux.scrollTop = 250;
      await dors(200);
      document.title = "produit scroll=" + Math.round(flux.scrollTop) +
        " titreBouge=" + Math.abs(d.querySelector(".dressing-titre").getBoundingClientRect().top - t1).toFixed(1) +
        " barreBouge=" + Math.abs(d.querySelector(".dressing-barre").getBoundingClientRect().top - b1).toFixed(1);
    } else document.title = "PAS DE FLUX";
    return;
  }
  if (scenario === "mesureSB") {
    tous('.b3-scene [aria-label="Open Backpack"]').at(0)
      ?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    await dors(400);
    const ecran = d.querySelector('[data-ecran="SB3.1"]');
    const liste = ecran.querySelector(".pipeline-lignes");
    const rang = ecran.querySelector(".pipeline-ligne");
    const lr = liste.getBoundingClientRect();
    const er = ecran.getBoundingClientRect();
    let bas = 0, apres = false;
    for (const c of ecran.children) {
      if (c === liste) { apres = true; continue; }
      if (apres) bas += c.getBoundingClientRect().height;
    }
    document.title = "rang=" + rang.getBoundingClientRect().height.toFixed(1) +
      " listeTop=" + (lr.top - er.top).toFixed(0) + " basStack=" + bas.toFixed(0);
    return;
  }
  if (scenario === "magie") {
    /* §0 GOOGLE HEADLESS : la couleur CALCULÉE de la pastille, pas son nom. */
    const pastille = d.querySelector(".b3-attune");
    const encre = pastille ? getComputedStyle(pastille).stroke : "absente";
    const surface = getComputedStyle(d.querySelector(".dressing")).backgroundColor;
    const lum = (c) => { const m = c.match(/\d+/g).map(Number);
      const [r, g, b] = m.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    const [h, l] = [lum(encre), lum(surface)].sort((a, b) => b - a);
    document.title = "encre=" + encre + " contraste=" + ((h + 0.05) / (l + 0.05)).toFixed(2);
    return;
  }
  if (scenario === "sb31") { // Gear weight › Backpack
    tous('.b3-scene [aria-label="Open Backpack"]').at(0)
      ?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    return;
  }
  if (scenario === "sb32") {
    q('.b3-scene [aria-label="Send"]')?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    return;
  }
  // tout le reste passe par le catalogue
  tous('[aria-label="Equipment"]').at(0)?.click();   /* la porte vit dans la BANDE BASSE depuis le lot 5 */
  await dors(600);
  if (scenario === "recherche") {
    tous(".carte-r-loupe").at(0)?.click();
    await dors(300);
    const champ = q(".pipeline-recherche-champ");
    if (champ) { champ.value = "sword"; champ.dispatchEvent(new Event("input", { bubbles: true })); }
    await dors(300);
    const ecran = d.querySelector('[data-ecran="Recherche"]');
    const liste = ecran.querySelector(".pipeline-lignes");
    const rang = ecran.querySelector(".pipeline-resultat");
    let bas = 0, apres = false;
    for (const c of ecran.children) {
      if (c === liste) { apres = true; continue; }
      if (apres) bas += c.getBoundingClientRect().height;
    }
    document.title = "resultats=" + tous(".pipeline-resultat").length +
      " rang=" + (rang ? rang.getBoundingClientRect().height.toFixed(1) : "?") +
      " listeTop=" + (liste.getBoundingClientRect().top - ecran.getBoundingClientRect().top).toFixed(0) +
      " basStack=" + bas.toFixed(0);
    return;
  }
  if (scenario === "mesureB2" || scenario === "b2") {
    /* le panier vit AU DOCUMENT depuis le 24/08 : la graine `#panier` le
       porte déjà — plus aucune injection de module (l'API d'hier a coûté une
       mesure muette le 26/08). */
    tous(".carte-r-bouton").find((b) => b.dataset.mot === "CART")?.click();
    await dors(400);
    if (scenario === "b2") return;
    const ecran = d.querySelector('[data-ecran="B2"]');
    const liste = ecran.querySelector(".pipeline-lignes");
    const rang = ecran.querySelector(".pipeline-ligne");
    const rr = rang.getBoundingClientRect();
    const er = ecran.getBoundingClientRect();
    const lr = liste.getBoundingClientRect();
    let bas = 0, apres = false;
    for (const c of ecran.children) {
      if (c === liste) { apres = true; continue; }
      if (apres) bas += c.getBoundingClientRect().height;
    }
    const gap = parseFloat(getComputedStyle(liste).rowGap) || 0;
    document.title = "rang=" + rr.height.toFixed(1) + " gap=" + gap +
      " listeTop=" + (lr.top - er.top).toFixed(0) + " basStack=" + bas.toFixed(0) +
      " ecranH=" + er.height.toFixed(0) + " fenetre=" + f.contentWindow.innerHeight;
    return;
  }
  if (scenario === "b1") {
    const note = (m) => { document.title = m; };
    const cranA = tous('.roue[data-niveau="rayons"] .roue-cran').find((c) => c.textContent.trim() === "Arcana");
    note("cranA=" + Boolean(cranA));
    cranA?.click();
    await dors(1500);
    const cransB = tous('.roue[data-niveau="etageres"] .roue-cran').map((c) => c.textContent.trim());
    note("B=" + [...new Set(cransB)].join("|"));
    const cranB = tous('.roue[data-niveau="etageres"] .roue-cran').find((c) => /[A-Za-z]/.test(c.textContent));
    cranB?.click();
    await dors(1500);
    const jeton = q(".grille-jeton[data-ref-id]");
    note((document.title) + " jeton=" + Boolean(jeton));
    if (jeton) tape(jeton);
    await dors(400);
    note(document.title + " b1=" + Boolean(q('[data-ecran=\"B1\"]')));
  }
  } catch (e) { document.title = "ERREUR: " + e.message; }
});
document.body.append(f);
</script>
