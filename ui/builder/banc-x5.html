<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FHPC — banc de X5, la fiche Recipe &amp; Craft</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     LE BANC DE X5 (lot 259) — la fiche du craft seule, sur sa dalle.

     ⭐ IL EXISTE POUR CE QUE LES GARDES NE PEUVENT PAS DIRE. `tests/x5-ecran.test.mjs`
     lit des fichiers et monte un DOM de stub : ⛔ il ne voit ni une largeur, ni une
     couleur, ni si le texte tient. Or ce lot repose sur une mesure prise AU
     NAVIGATEUR — 153,5 blg utiles pour un nom de pouvoir — et une mesure se
     re-regarde.

     ⭐ ET IL MONTRE LES TROIS CAS QUI COMPTENT, côte à côte :
       ① une LONGSWORD — dix pouvoirs, la rangée pleine, un assemblage légal ;
       ② une ARBALÈTE — aucun pouvoir : la rangée DISPARAÎT et tout remonte de 48 ;
       ③ un assemblage HORS LIMITE — le panneau dit pourquoi, `Send` est inerte.
     👉 Sur ② la fiche doit faire 48 blg de MOINS, et le pied ne doit laisser
     aucun trou là où la rangée était.

     ⛔ IL NE PORTE AUCUNE COTE ET AUCUN HABIT. Tout vient de `tokens.css`, de
     `shell.css` et de `feuilleDesCotesX5()`. Si quelque chose est faux ici, c'est
     faux dans le produit.
     ══════════════════════════════════════════════════════════════════════ -->

<link rel="stylesheet" href="./tokens.css?v=842">
<link rel="stylesheet" href="./shell.css?v=842">
<style>
  /* ⛔ L'ÉCHAFAUDAGE, ET RIEN D'AUTRE — aucune de ces règles ne décrit X5. */
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--text);
         font-family: var(--font); }
  h1 { font-size: var(--t3); font-weight: 600; letter-spacing: .14em;
       text-transform: uppercase; color: var(--muted); margin: 0 0 20px; }
  .planche { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .cas { display: flex; flex-direction: column; gap: 8px; }
  .cas > figcaption { font-size: var(--t1); color: var(--muted); max-width: 375px; }
  /* la dalle du rang X : 375 de large, posée comme sous le belt */
  .dalle { width: 375px; position: relative; }
  .mesure { font: 11px ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
<h1>Banc de X5 — Recipe &amp; Craft</h1>
<div class="planche" id="planche"></div>

<script type="module">
import { construireX5, feuilleDesCotesX5 } from "./x5-ecran.mjs?v=842";


/* ⭐ LA FEUILLE DES COTES EST CELLE DU PRODUIT — ⛔ pas une copie pour le banc. */
const style = document.createElement("style");
style.textContent = feuilleDesCotesX5();
document.head.append(style);

/* ⚠️ LE BANC PORTE SES PROPRES RECORDS, ET IL FAUT DIRE POURQUOI.
   La pile réelle se monte par `exemple-fh-en.mjs`, qui importe `node:fs` — ⛔ un
   module NODE, qui ne peut pas vivre dans un navigateur.
   ⭐ Ce n'est pas une perte : ce banc existe pour REGARDER un rendu, et c'est
   `tests/x5-ecran.test.mjs` et `tests/craft.test.mjs` qui éprouvent la dérivation
   sur la pile VRAIE. ⛔ Mais il faut le savoir : ces cinq records sont de
   l'échafaudage, recopiés du SRD à la main, et une faute de recopie ici ne serait
   PAS une faute du produit. Les `subtype` et les `rarity` sont ceux du SRD, au
   caractère près, parce que c'est d'eux que tout se dérive. */
const armes = new Map([
  ["Longsword", { data: { name: "Longsword", cost: "15 GP", weapon_range: "melee", weapon_category: "martial" } }],
  ["Plate Armor", { data: { name: "Plate Armor", cost: "1,500 GP", armor_category: "heavy" } }],
  /* 🔴 UNE BASE CONSTRUITE, ET ELLE LE DIT : aucune des 51 bases du SRD n'est sans
     pouvoir (lot 261). La règle de la rangée qui disparaît n'a que des cas construits. */
  ["Base de test", { data: { name: "Base de test", cost: "25 GP", weapon_range: "ranged",
    weapon_category: "exotic" } }],
  /* ⭐ LOT 283 — une munition : la marque du paquet (`pack`) et son prix, ceux de la couche
     `fh-munitions-en`. */
  ["Arrows", { data: { name: "Arrows", cost: "5 SP", pack: 10, weight: "1.5 lb." } }],
]);
const bases = [...armes.values()];
const magiques = [
  { data: { name: "Flame Tongue", subtype: "Any Melee Weapon", rarity: "Rare (Requires Attunement)" } },
  { data: { name: "Defender", subtype: "Any Melee Weapon", rarity: "Legendary (Requires Attunement)" } },
  { data: { name: "Vorpal Sword", subtype: "Glaive, Greatsword, Longsword, or Scimitar",
            rarity: "Legendary (Requires Attunement)" } },
  { data: { name: "Weapon of Warning", subtype: "Any Simple or Martial", rarity: "Uncommon (Requires Attunement)" } },
  { data: { name: "Armor of Resistance", subtype: "Any Light, Medium, or Heavy", rarity: "Rare (Requires Attunement)" } },
  { data: { name: "Ammunition of Slaying", subtype: "Any Ammunition", rarity: "Very Rare" } },
];
/* ⚠️ LES PLANS SONT RECOPIÉS DU SRD AU CARACTÈRE PRÈS — c'est d'eux que les bases et
   les bonus se lisent. `Armor` : un +1 y est RARE. */
const PLAN_ARME = { data: { name: "Weapon, +1, +2, or +3", category: "weapon",
  subtype: "Any Simple or Martial", rarity: "Uncommon (+1), Rare (+2), or Very Rare (+3)" } };
const PLAN_ARMURE = { data: { name: "Armor, +1, +2, or +3", category: "armor",
  subtype: "Any Light, Medium, or Heavy", rarity: "Rare (+1), Very Rare (+2), or Legendary (+3)" } };
const PLAN_MUNITION = { data: { name: "Ammunition, +1, +2, or +3", category: "weapon",
  subtype: "Any Ammunition", rarity: "Uncommon (+1), Rare (+2), or Very Rare (+3)" } };
const PLAN_VIDE = { data: { name: "Plan de test", category: "weapon", subtype: "Base de test",
  rarity: "Uncommon (+1), Rare (+2), or Very Rare (+3)" } };

const cas = [
  ["① Weapon +1 — Longsword + Flame Tongue, en craft",
   { plan: PLAN_ARME, choix: { base: "Longsword", bonus: "Uncommon", pouvoirs: ["Flame Tongue"] } }],
  ["② Armor +1 — un +1 d'armure est RARE : 5 500 GP à l'achat, comme le SRD l'écrit",
   { plan: PLAN_ARMURE, choix: { base: "Plate Armor", bonus: "Rare", status: "Buying" } }],
  ["③ hors limite — +2 et Defender : le panneau dit pourquoi",
   { plan: PLAN_ARME, choix: { base: "Longsword", bonus: "Rare", pouvoirs: ["Defender"] } }],
  ["④ base CONSTRUITE sans pouvoir — la rangée disparaît (aucune base du SRD n'est dans ce cas)",
   { plan: PLAN_VIDE, choix: { bonus: "Uncommon" } }],
  ["⑤ pile SRD — pas de colonne gauche",
   { plan: PLAN_ARME, fh: false, choix: { base: "Longsword", bonus: "Uncommon" } }],
  ["⑥ Found — la phrase du croquis, aucun champ",
   { plan: PLAN_ARME, choix: { base: "Longsword", bonus: "Uncommon", status: "Found" } }],
  ["⑦ Ammunition +1 — Arrows : un lot de DIX, payé une fois (lot 283)",
   { plan: PLAN_MUNITION, choix: { base: "Arrows", bonus: "Uncommon" } }],
];

/* ⭐ LOT 285 — LE PARCHEMIN DE SORT, SUR LA PILE VRAIE. La couche SRD est un JSON, pas un module
   Node : elle se LIT ici telle quelle — le plan `Spell Scroll` (sa table niveau → rareté) et ses
   339 sorts. ⛔ Aucun record recopié à la main pour ces deux cas. */
const couche = await (await fetch("../../layers/srd-5.2.1-en.layer.json?v=842")).json();
const PLAN_PARCHEMIN = couche.records.item["srd:item:en:spell-scroll"];
const SORTS = Object.values(couche.records.spell);
cas.push(
  ["⑦ Spell Scroll — Wizard · Level 3 · Fireball choisi · Qty 2 : 5 days · 150 GP · Uncommon",
   { plan: PLAN_PARCHEMIN, sorts: SORTS, choix: { classe: "Wizard", niveau: 3, sort: "Fireball", qte: 2 } }],
  ["⑧ Spell Scroll — Paladin · Level 5 : une seule page, pas de chevron, rien de choisi",
   { plan: PLAN_PARCHEMIN, sorts: SORTS, choix: { classe: "Paladin", niveau: 5 } }]);

const planche = document.getElementById("planche");
for (const [titre, options] of cas) {
  const fig = document.createElement("figure");
  fig.className = "cas"; fig.style.margin = "0";
  const cap = document.createElement("figcaption");
  cap.textContent = titre;
  const dalle = document.createElement("div");
  dalle.className = "dalle";
  const { noeud, cote } = construireX5({ bases, itemsMagiques: magiques, ...options });
  dalle.append(noeud);
  const m = document.createElement("div");
  m.className = "mesure";
  /* 📏 LE BANC MESURE CE QU'IL MONTRE, pour qu'on lise le chiffre à côté du dessin. */
  requestAnimationFrame(() => {
    const bas = [...noeud.querySelectorAll("[data-organe]")]
      .reduce((n, e) => Math.max(n, e.offsetTop + e.offsetHeight), 0);
    m.textContent = `${bas} blg occupés · ${cote.legal ? cote.categorie : "illégal"}`
      + (cote.legal ? ` · ${Math.round(cote.craftTotal).toLocaleString("en-US")} GP` : "");
  });
  fig.append(cap, dalle, m);
  planche.append(fig);
}
</script>
</body>
</html>
