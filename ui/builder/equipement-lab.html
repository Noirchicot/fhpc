/* ══ LA ROUE — TROIS TOURS DE PISTE, ET LE SAUT QUI LES RECOUD ═════════════
   Eric, 2026-08-22 : *« quand on arrive au bout on revient au début »*.

   ⭐ LE PRINCIPE, ET IL N'Y A PAS D'AUTRE FAÇON DE LE FAIRE AVEC UN
   DÉFILEMENT NATIF : on pose la liste TROIS FOIS bout à bout et on se tient
   dans le tour du milieu. Quand le défilement quitte ce tour, on le ramène
   d'une longueur de tour — le contenu est identique au pixel près, donc le
   saut ne se voit pas. La roue est une illusion, mais elle est exacte.

   🔴 ON FABRIQUE TROIS FOIS, ON NE CLONE PAS. `cloneNode(true)` ne copie PAS
   les écouteurs : les crans clonés n'auraient plus de `click`, et un tiers de
   la roue serait mort — un tiers seulement, donc le défaut aurait l'air d'un
   caprice tactile plutôt que d'un bug. C'est le genre de chose qu'on ne
   retrouve jamais.

   ⛔ EN DESSOUS DE TROIS ITEMS, PAS DE ROUE. Avec un ou deux items, tripler
   fabrique une roue qui tourne sans avancer, et l'utilisateur voit trois fois
   la même chose sans comprendre pourquoi. Ces cas gardent une piste droite. */
function troisTours(fabriquer, liste) {
  /* ⭐ UN BLOC DOIT ÊTRE LARGE, PAS SEULEMENT RÉPÉTÉ — défaut vu par Eric le
     2026-08-22 sur la roue publiée : *« la roue A bien fluide, la roue B pas
     bien, ça clignote un peu »*.
     🔴 LA MESURE : la roue pose trois blocs et saute d'un bloc dès qu'on sort
     de celui du milieu. Avec 3 items, un bloc fait 3 × 121 = 363 px pour une
     fenêtre de 359 — on en sort au moindre geste, la couture tire presque en
     permanence, et l'œil la voit. Avec 4 items elle tire quatre fois moins :
     d'où une roue fluide et sa voisine qui clignote, à code identique.
     ⭐ On répète donc la liste À L'INTÉRIEUR du bloc jusqu'à MIN_BLOC crans.
     Mesuré après : bloc de 1451 px au lieu de 363, soit 546 px de marge avant
     recouture au lieu d'une marge négative. */
  const MIN_BLOC = 12;
  const un = () => liste.map(fabriquer);
  if (liste.length < 3) return un();
  const tours = 3 * Math.ceil(MIN_BLOC / liste.length);
  const sortie = [];
  for (let t = 0; t < tours; t += 1) sortie.push(...un());
  return sortie;
}

/** Recoud la piste : quand le défilement quitte le tour du milieu, il y
 *  revient d'un bond invisible.
 *  ⚠️ LE BOND DOIT ÊTRE INSTANTANÉ ET SANS AIMANTATION. `scroll-behavior`
 *  est en `smooth` sur les ceintures : sans le neutraliser le temps du saut,
 *  le navigateur ANIMERAIT le retour — on verrait la roue rembobiner sur toute
 *  sa longueur. Et `scroll-snap` doit lâcher pendant le bond, sinon il reprend
 *  la main au milieu et repose le défilement là où il vient de partir. */
/* ⭐ L'AXE EST LU À CHAQUE APPEL, JAMAIS MÉMORISÉ — le banc bascule entre les
   deux sens à chaud, et une couture qui aurait retenu son axe au montage
   coudrait la mauvaise dimension après le premier basculement. */
function axe(piste) {
  return sensHorizontal()
    ? { pos: "scrollLeft", long: "scrollWidth" }
    : { pos: "scrollTop",  long: "scrollHeight" };
}

/** Bond instantané, sans aimantation ni animation. */
function sauter(piste, a, cible) {
  const snap = piste.style.scrollSnapType;
  const doux = piste.style.scrollBehavior;
  piste.style.scrollSnapType = "none";
  piste.style.scrollBehavior = "auto";
  piste[a.pos] = cible;
  /* 🔴 RENDRE LA MAIN À LA PROCHAINE IMAGE, PAS TOUT DE SUITE. Restaurer dans
     la même tâche, c'est n'avoir JAMAIS désactivé l'aimantation : le navigateur
     ne voit que l'état final, re-snappe, et la roue saute — le « ça fait sauter
     l'écran » d'Eric venait aussi de là. */
  requestAnimationFrame(() => {
    piste.style.scrollSnapType = snap;
    piste.style.scrollBehavior = doux;
  });
}

function enrouler(piste) {
  if (piste.children.length < 3) return () => {};
  return () => {
    const a = axe(piste);
    const tour = piste[a.long] / 3;
    if (tour <= 0) return;
    const x = piste[a.pos];
    if (x < tour * 0.5) sauter(piste, a, x + tour);
    else if (x > tour * 1.5) sauter(piste, a, x - tour);
  };
}

/** Pose le défilement au début du tour du milieu, sur l'item courant. */
function poserAuMilieu(piste) {
  if (piste.children.length < 3) return;
  const a = axe(piste);
  sauter(piste, a, piste[a.long] / 3);
}

/** L'enfant dont le centre est le plus proche du centre de la piste.
 *  ⚠️ On mesure le CENTRE et pas le bord : au bout de la course, la piste ne
 *  peut plus amener le premier ni le dernier au milieu, et un test de bord les
 *  rendrait invisables. Le plus-proche-du-centre les atteint toujours. */
function itemAuViseur(piste) {
  const horiz = sensHorizontal();
  const b = piste.getBoundingClientRect();
  const centre = horiz ? b.left + b.width / 2 : b.top + b.height / 2;
  /* Le pas d'un cran : trois items tiennent dans la fenêtre, donc un tiers. */
  const pas = (horiz ? b.width : b.height) / 3 || 1;
  let gagnant = null;
  let meilleur = Infinity;
  for (const el of piste.children) {
    const r = el.getBoundingClientRect();
    const c = horiz ? r.left + r.width / 2 : r.top + r.height / 2;
    const ecart = c - centre;
    const d = Math.abs(ecart);
    if (d < meilleur) { meilleur = d; gagnant = el; }

    /* ══ LA PERSPECTIVE — Eric : *« un effet de perspective pour donner
       l'impression d'une roue »* ═══════════════════════════════════════════
       ⭐ ELLE NE COÛTE RIEN, ET C'EST POURQUOI ELLE EST ICI : cette boucle
       mesurait déjà l'écart de chaque item au centre pour désigner le
       gagnant. La perspective est cet écart, peint. Une seconde boucle aurait
       doublé le seul calcul coûteux de l'image.

       Un item posé sur un cylindre s'incline d'autant qu'il est loin du
       sommet, et sa face se raccourcit — d'où `rotateY` ET `scale`. Le
       `perspective()` est dans la valeur plutôt que sur le parent : sur le
       parent, il ferait fuir tous les items vers UN point commun, alors que
       chacun doit tourner autour de son propre axe.
       ⚠️ `.style.transform` ET RIEN D'AUTRE — c'est la seule forme de style en
       ligne que ce dépôt tolère (garde 7), et l'estompage se fait donc en
       CSS, par un masque sur la piste, jamais par `.style.opacity`. */
    /* 📐 LES COTES VIENNENT D'UNE RÉFÉRENCE, PAS DE MON GOÛT — Eric a rapporté
       les valeurs du picker iOS : centre 0° et pleine taille, voisin proche
       ±20° / 0,92, plus loin ±40° / 0,80.
       🔴 MES PREMIÈRES VALEURS ÉTAIENT TROIS FOIS TROP FORTES : 34° par cran
       borné à ±2,2 crans, soit jusqu'à 74,8° et un facteur 0,72. À 75° un item
       est presque de profil — il ne se lit plus, il décore. La roue avait
       l'air d'un effet, pas d'un mécanisme.
       ⚠️ Et la perspective passe de 420 à 700 px : plus la valeur est PETITE,
       plus la fuite est brutale. 420 exagérait la déformation en plus de
       l'angle, les deux se cumulaient. */
    /* ══ LA ROUE EST UN CYLINDRE, PAS UNE INCLINAISON ════════════════════════
       Eric, 2026-08-22 : *« perspective pas encore parfait »*. Elle ne l'était
       pas, et voici ce qui manquait.

       🔴 CE QUE FAISAIT LA VERSION PRÉCÉDENTE : elle inclinait chaque item SUR
       PLACE. Les items restaient donc espacés régulièrement, comme des cartes
       posées à plat qu'on aurait juste tournées. Or sur une roue, ce qui
       trahit la rotation n'est pas l'angle — c'est que **les items se
       RESSERRENT vers les bords**, parce qu'on voit leur écart en raccourci.
       Sans ce resserrement, l'œil lit un ruban qui glisse, pas un tambour qui
       tourne.

       ⭐ LA FORMULE EST CELLE DES CARROUSELS CYLINDRIQUES, et elle fait tout
       d'un coup : `translateZ(-R) rotateY(θ) translateZ(R)` pose l'item sur un
       cylindre de rayon R vu de face. Il tourne, il RECULE en profondeur, et
       sa largeur apparente se comprime en `cos θ` — les trois effets sortent
       de la géométrie au lieu d'être dosés à la main.
       📌 `translateX(-ecart)` d'abord, pour ANNULER la position que le
       défilement lui a donnée : sinon le déplacement linéaire du scroll et le
       déplacement circulaire de la roue s'additionnent, et les items se
       chevauchent aux bords. C'est le piège de cette formule.

       📐 R = pas / α : le rayon pour lequel l'arc entre deux crans vaut
       exactement un cran. C'est lui qui garantit que la roue « déroule » à la
       vitesse du doigt — un rayon choisi au jugé fait patiner l'image sur le
       geste, et ça se sent sans qu'on sache le nommer. */
    /* 📐 LA GÉOMÉTRIE VIENT D'UNE RÉFÉRENCE QU'ERIC A RAPPORTÉE, et elle est
       plus juste que ce que j'avais composé. `d` est une longueur d'ARC sur le
       cylindre, donc l'angle s'en déduit directement :

           θ = d / R        x = R·sin θ        z = R·(cos θ − 1)

       ⭐ CE QUE ÇA CHANGE PAR RAPPORT À MA VERSION : je composais
       `translateZ(−R) rotateY(θ) translateZ(R)`, ce qui place bien l'item sur
       le cylindre mais laisse la trigonométrie au moteur de rendu. Calculer x
       et z À LA MAIN les rend lisibles, mesurables, et surtout indépendants de
       l'ordre d'application des transformations CSS — l'endroit exact où ma
       composition pouvait dériver sans prévenir.
       📌 `correction = x − d` parce que la mise en page a DÉJÀ placé l'item à
       `d` pixels : on ne le pose pas, on le corrige. Oublier cette
       soustraction fait s'additionner le défilement et la roue, et les items
       se chevauchent aux bords — le piège de cette formule.
       ⛔ L'OPACITÉ DE LA RÉFÉRENCE N'EST PAS REPRISE : elle exigerait un
       second style en ligne, et ce dépôt n'en tolère qu'un (`transform`).
       L'atténuation est déjà faite en CSS, par le voile à trois paliers et le
       masque des bords — deux mécanismes pour la même chose se contrediraient
       au premier réglage. */
    /* 📐 R = 190, ET PAS LES 300 DE LA RÉFÉRENCE — Eric, 2026-08-22 :
       *« perspective pas bonne »*. Elle était juste mais trop MOLLE : avec
       R = 300 et un cran de 117 px, un cran ne vaut que 22° et le second
       voisin 45° — mesuré, l'item du bord ne perdait que 16 px de largeur
       apparente sur 117. Un tambour qu'on devine n'est pas un tambour.
       ⭐ Le rayon EST la courbure : plus il est petit, plus la roue est
       serrée. À 190, un cran vaut 35° et le second voisin 71° — l'item du bord
       est franchement de biais, comme sur le picker d'alarme.
       ⚠️ Et la référence donnait 300 pour des items de 120 px sur un écran
       plus large : ce n'est pas une constante universelle, c'est un rapport
       entre le rayon et le pas. Recopier le nombre sans le rapport aurait été
       une erreur de mesure, pas de goût. */
    /* 📐 LES VALEURS D'ERIC, TROUVÉES AU BANC `roue-lab.html` le 2026-08-22 :
       *« 3,36 / 61° / 12,9 »* — CINQUIÈME PASSE, 2026-08-22, sur un
       banc dont la perspective marchait enfin (elle était posée un niveau trop
       haut et ne descendait pas jusqu'aux crans : `getComputedStyle` rendait
       `none`) ET dont le masque ne rongeait plus les crans réglés. Pas = 121,
       donc R = 407 px et fuite = 1561 px.
       📌 UNE FUITE AUSSI LOINTAINE APLATIT LA DÉFORMATION : Eric veut la
       rotation, pas l'effet d'optique. C'est un choix, pas un réglage au
       hasard — il a poussé ce curseur à son maximum deux fois de suite.
       📌 La première passe (3,02 / 65° / 8,3) reste valable POUR 3 CRANS —
       Eric : *« les mesures étaient bonnes pour 3 »*. Celle-ci la remplace
       parce qu'elle a été faite avec la profondeur visible.
       ⭐ ELLES SONT ÉCRITES EN RAPPORT AU PAS, PAS EN PIXELS : R = 1,92 × pas.
       Un rayon en pixels absolus ne survit pas au changement d'écran — c'est
       exactement ce qui a fait dire au relevé « ça glisse, ça ne tourne pas »
       sur l'iPad en paysage, avec seize items alignés au lieu de trois.
       📌 Un cran vaut alors 17,0°, et l'angle max en laisse 3,6 de chaque côté.
       ⭐ CES VALEURS SONT PLUS DOUCES QUE CELLES QUE JE PROPOSAIS (1,92 × pas,
       fuite 5,1) : la roue tourne moins sur elle-même et fuit de plus loin.
       C'est le doigt qui a mesuré, pas le raisonnement. */
    const R = 3.36 * pas;                 // le rayon du tambour
    const ANGLE_MAX = 61 * Math.PI / 180; // au-delà, l'item est passé derrière
    /* θ borné : passé 72°, l'item est de l'autre côté du tambour. La borne
       est ici SANS DANGER (contrairement à celle que j'avais posée sur les
       crans) parce qu'elle s'applique à θ AVANT le calcul de x et z : la
       position reste cohérente avec l'angle, l'item s'arrête sur le cylindre
       au lieu de repartir en ligne droite. */
    const theta = Math.max(-ANGLE_MAX, Math.min(ANGLE_MAX, ecart / R));
    const surLeCylindre = R * Math.sin(theta);
    const enProfondeur = R * (Math.cos(theta) - 1);
    const correction = surLeCylindre - ecart;   // la mise en page a déjà posé `ecart`
    const deg = -theta * 180 / Math.PI;
    el.style.transform = horiz
      ? `translateX(${correction}px) translateZ(${enProfondeur}px) rotateY(${deg}deg)`
      : `translateY(${correction}px) translateZ(${enProfondeur}px) rotateX(${-deg}deg)`;
  }
  return gagnant;
}

/** Branche une piste sur son viseur. `quandChange` ne part QUE si l'item visé
 *  a changé — c'est ce qui rend la cascade gratuite.
 *
 *  ⭐ LA FLUIDITÉ TIENT À DEUX LIGNES, ET ELLES SONT DÉLIBÉRÉES :
 *  · `requestAnimationFrame` — un `scroll` tire des dizaines d'événements par
 *    seconde et chaque `getBoundingClientRect()` force un calcul de mise en
 *    page. On n'en fait qu'UN par image, jamais un par événement.
 *  · `{ passive: true }` — sans lui, le navigateur doit attendre de savoir si
 *    l'écouteur va annuler le défilement avant de le peindre. C'est LA cause
 *    classique d'un défilement qui colle au doigt sur mobile.
 *  📌 Mesuré : remonter la bande coûte 0,61 ms pour la pire étagère (33
 *  objets). La cascade tient donc très largement dans une image de 16,7 ms. */
/* ══ LE TIC — un crochet, pas une promesse ════════════════════════════════
   Eric, 2026-08-22 : *« le tic haptique c'est la classe »*. Il l'est, et c'est
   le seul point de la liste que le web ne peut pas tenir sur iPhone.

   🔴 CE QUI EST VRAI, ET IL FAUT LE DIRE PLUTÔT QUE DE LIVRER UN ERSATZ :
   `UISelectionFeedbackGenerator` — l'haptique qu'Apple réserve précisément au
   passage entre valeurs discrètes, donc au tic d'une roulette — est une API
   NATIVE. `navigator.vibrate()` existe sur Android et **pas sur Safari iOS** :
   Apple ne l'expose pas au web. Une page servie dans Safari ne ticquera pas,
   quoi qu'on écrive ici.

   ⭐ CE QUE CETTE FONCTION FAIT QUAND MÊME, ET POURQUOI ELLE VAUT SES DIX
   LIGNES : elle pose le CROCHET au bon endroit. Le jour où FHPC est encapsulé
   dans une WKWebView, il n'y a rien à recâbler — le pont existe déjà et le
   Swift n'a qu'à répondre au message. Un crochet posé tôt coûte dix lignes ;
   le même crochet retrouvé plus tard coûte de rouvrir tous les appelants.

   ⛔ ET SURTOUT : IL NE TICQUE QU'AU CHANGEMENT DE CRAN, jamais à l'événement
   de défilement. C'est la faute que la référence signale nommément, et elle
   est déjà évitée par construction ici — `juger()` ne compare que l'item
   visé, donc un balayage rapide donne tic-tic-tic, un par cran franchi, et
   non une vibration continue. */
function tic() {
  /* Le pont natif d'abord : c'est le seul qui donne le vrai tic d'Apple. */
  const pont = globalThis.webkit?.messageHandlers?.haptic;
  if (pont) { try { pont.postMessage("selection"); return; } catch { /* pont muet */ } }
  /* Sinon Android, où l'API existe. Sur Safari iOS, les deux sont absents et
     cette fonction ne fait RIEN — c'est le comportement attendu, pas un échec
     à rattraper par une animation qui ferait semblant. */
  if (typeof navigator.vibrate === "function") navigator.vibrate(8);
}

function brancherViseur(piste, quandChange) {
  let dernier = null;
  let idImage = 0;
  const juger = () => {
    /* La couture d'abord : on recentre la roue AVANT de juger, pour que le
       verdict porte sur la position définitive et pas sur celle d'avant le
       bond. Juger puis sauter ferait clignoter le viseur d'un item. */
    enrouler(piste)();
    const el = itemAuViseur(piste);
    if (!el) return;
    for (const x of piste.children) x.dataset.vise = String(x === el);
    if (el === dernier) return;
    /* ⛔ PAS DE TIC AU TOUT PREMIER JUGEMENT : `dernier` est nul au montage et
       à chaque redessin. Ticquer là ferait vibrer l'appareil à l'ouverture de
       l'écran et à chaque cascade — un retour qui ne répond à aucun geste. */
    if (dernier !== null) tic();
    dernier = el;
    quandChange(el);
  };
  /* 🔴 ON ANNULE ET ON REPLANIFIE, ON NE LÈVE PAS DE DRAPEAU. Un garde booléen
     semble équivalent et ne l'est pas : si le `requestAnimationFrame` est
     demandé au moment où l'onglet passe en arrière-plan, il ne s'exécute
     JAMAIS — le drapeau reste levé et le mécanisme est mort pour de bon.
     L'utilisateur revient, la roue ne répond plus, et rien n'a rougi.
     ⭐ `cancelAnimationFrame` + replanification donne le même throttle à une
     image, sans état qui puisse rester coincé. */
  piste.addEventListener("scroll", () => {
    cancelAnimationFrame(idImage);
    idImage = requestAnimationFrame(juger);
  }, { passive: true });
  /* Rendu au réglage : après chaque redessin, la piste a de nouveaux enfants
     et l'ancien `dernier` pointe sur un nœud mort. On le repose — et on
     replace la roue sur son tour du milieu, sans quoi le premier geste
     déclencherait un bond de recouture au lieu d'un défilement. */
  return () => { dernier = null; poserAuMilieu(piste); juger(); };
}

/* ══ SPECIES ET R.LIST SE RESSEMBLENT, ET LEUR DÉFILEMENT DIT LE CONTRAIRE ══
   Eric, 2026-08-22 : *« donc différent du scrollspy de Species »* · *« mais en
   apparence ça ressemble à Species »*.

   🔴 CHEZ SPECIES, DÉFILER EST CHOISIR. `socle.mjs` l'écrit : *« le
   défilement se POSE sur une fiche : c'est elle qui est choisie, il n'existe
   aucun geste de sélection. Le scrollspy n'est donc pas un repère, c'est LE
   SÉLECTEUR. »*

   en glissant à l'horizontale. Le défilement ne sélectionne rien, ne valide
   rien, n'allume rien.

   ⛔ D'OÙ CE QUI N'EST PAS ICI, ET QUI Y SERAIT VENU TOUT SEUL : pas de
   `data-snap` (le seul contrat entre un écran et le scrollspy du socle, posé
   par `renderCatalogueCards` et nulle part ailleurs), pas de
   `renderCatalogueCards`, pas de `watchSnap`, et pas même de
   `scroll-snap-type: y`. Le piège n'aurait rougi nulle part : l'écran aurait

   arrêté. Un `overflow-y: auto` nu suffit, et c'est tout ce qu'il y a.
   ⭐ LA RÈGLE, ET ELLE DÉPASSE CE BANC : deux écrans peuvent se ressembler et
   faire dire à un même geste deux choses opposées. Ce qui se copie est
   l'apparence ; ce qui se décide est le sens.

   ⚠️ L'AIMANTATION HORIZONTALE, ELLE, RESTE — sur la ceinture, se poser sur un
   cran EST le choix du rayon. Le même mécanisme, deux sens : c'est la
   démonstration de la règle ci-dessus, dans la même page. */

/* ══ LA COTE F1 — LUE À LA SOURCE, JAMAIS RECOPIÉE ════════════════════════
   Eric : la zone de coulisse fait au plus la taille d'un F1 de Species.

   🔴 ET `--fiche-h` N'EST PAS ATTEIGNABLE EN CSS DEPUIS CE BANC. Elle n'est ni
   dans `tokens.css` ni sur `:root` : `fiche.css` la déclare sur
   `.catalogue-cards[data-kind="class"|"species"|"feat"]`, et le dit exprès —
   *« elle vit sur le CONTENEUR (…) ; une variable descend, elle ne remonte
   pas »*. Charger la feuille ne suffit donc pas : il faut être DEDANS.

   ⛔ ET ON NE SE MET PAS DEDANS. Envelopper les tuiles dans un
   `.catalogue-cards[data-kind="species"]` aurait donné la cote — avec la
   grille de Species, sa hauteur à 100 % et son nom. C'est-à-dire aller
   chercher la brique de Species pour un écran dont le défilement veut dire le
   contraire : exactement le piège de la note ci-dessus.

   ⭐ ALORS ON LA MESURE. Une SONDE porte le sélecteur déclarant le temps d'une
   lecture, hors de tout flux, et rend sa valeur. La cote n'est donc écrite
   nulle part dans ce fichier : le jour où Eric la change dans `fiche.css`, le
   banc suit. C'est la seule propriété qui comptait.
   ⚠️ LE PRIX EST UNE PROPRIÉTÉ POSÉE EN LIGNE, et il faut le nommer : le garde
   7 des jetons interdit `.style` dans tout `ui/` (« le décor va dans la
   feuille »). Ici on ne pose pas de DÉCOR — on republie un jeton lu dans une
   feuille, pour qu'un `var()` puisse le voir. L'exception est celle-là, et
   rien d'autre n'y passe.
   📌 À REMONTER : la cote vient de servir hors du catalogue. Si elle sert une
   troisième fois, sa place est `tokens.css` — et cette sonde disparaît. */
function republierCoteF1() {
  const sonde = document.createElement("div");
  sonde.className = "catalogue-cards";
  sonde.dataset.kind = "species";
  sonde.hidden = true;
  document.body.append(sonde);
  const cote = getComputedStyle(sonde).getPropertyValue("--fiche-h").trim();
  sonde.remove();
  if (cote) document.documentElement.style.setProperty("--fiche-h", cote);
  return cote || "(introuvable)";
}
const COTE_F1 = republierCoteF1();
/* ⛔ `list-titre` ET `list-cap` N'EXISTENT PLUS. C'étaient deux libellés de
   banc au-dessus et au-dessous des tuiles ; ils coûtaient de la hauteur que le

/** UN CRAN DE CARROUSEL — le même fabricant pour les deux rangées, et c'est
 *  délibéré : ce qui doit différer est le POIDS (une classe sur la barre),
 *  pas le balisage. Deux fabricants auraient laissé les deux rangées diverger
 *  par distraction, la faute que `.belt` existe pour éviter. */
function faireCran(nom, compte, courant, onClic) {
  const cran = document.createElement("button");
  cran.type = "button";
  cran.className = "belt-item";
  cran.setAttribute("role", "tab");
  cran.setAttribute("aria-selected", courant ? "true" : "false");
  /* ⚠️ LE NOM VIT DANS UN `data-`, PAS DANS LE TEXTE — le cran porte AUSSI son
     compte (règle 1 d'Eric), donc `textContent` rend « Adventuring32 ». Le
     viseur qui lit le nom lirait une chaîne qui ne correspond à aucun rayon,
     et la cascade ne partirait jamais : un défaut muet, pas une erreur. */
  cran.dataset.cran = nom;
  if (courant) cran.dataset.status = "current";
  if (compte === 0) cran.dataset.vide = "true";

  const mot = document.createElement("span");
  mot.textContent = nom;

  /* RÈGLE 1 D'ERIC — CHAQUE DALLE PORTE SON COMPTE, jamais le nom seul :
     « le joueur doit savoir ce qui l'attend avant de cliquer ». */
  const chiffre = document.createElement("span");
  chiffre.className = "cran-compte";
  chiffre.textContent = String(compte);

  cran.append(mot, chiffre);
  cran.addEventListener("click", onClic);
  return cran;
}

/* ══ CE QUI ÉTAIT ICI, ET POURQUOI IL N'Y EST PLUS ══════════════════════
   Eric, 2026-08-22 : *« tout se passe dans le même sens, plus de glisser »*.

   250 lignes ont disparu d'un coup : la garde d'axe, le seuil de 6 px et son
   réglage `k`, le drapeau d'annulation, le relevé du dernier geste, et le
   fantôme posé une heure plus tôt. ⛔ Rien n'a été mis derrière un
   interrupteur : ce dépôt refuse le code mort désactivé, et une décision qui

   ⭐ CE QU'IL FAUT RETENIR, PARCE QUE ÇA RESSERVIRA : tout cet appareillage
   n'existait que pour départager DEUX gestes sur un même appui — parcourir et
   prendre. Chaque pièce était juste, chaque pièce était mesurée, et l'ensemble
   était quand même la mauvaise réponse : la bonne était de ne pas surcharger
   l'appui. Trois défauts sont morts sans être corrigés (le clic de souris
   refusé pour 7 px de dérive verticale, le tap testé avant l'annulation dans
   l'organe, le fantôme qui se disputait l'ascenseur) — ils n'ont plus
   d'endroit où exister.

   📌 L'organe `glisser.mjs` n'a pas bougé : il sert cinq autres écrans, et
   c'est ce banc qui cesse de l'employer, pas lui qui devient faux. */


/** LA BOURSE — quatre nombres, redessinés à chaque ajustement. */
function dessinerBourse() {
  swapContent(document.getElementById("purse"), BOURSE.map((piece) => {
    const bloc = document.createElement("span");
    bloc.className = "purse-piece";
    const n = document.createElement("b");
    n.className = "purse-nombre";
    n.textContent = String(bourse[piece]);
    const mot = document.createElement("span");
    mot.className = "purse-mot";
    mot.textContent = piece;
    bloc.append(n, mot);
    return bloc;
  }));

  /* Les quatre pastilles de choix — `.skills-cat`, la brique « une parmi N »
     du dépôt : l'active se remplit d'un lavis d'accent, les autres sont nues.
     ⛔ Pas de `<select>` : quatre choix courts se montrent, ils ne se
     déroulent pas — et un menu déroulant au pouce coûte deux gestes. */
  swapContent(document.getElementById("argent-pieces"), BOURSE.map((piece) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "skills-cat";
    b.textContent = piece;
    b.setAttribute("aria-current", piece === pieceChoisie ? "true" : "false");
    b.addEventListener("click", () => { pieceChoisie = piece; dessinerBourse(); mesurer(); });
    return b;
  }));

}

/** AJUSTER — `signe` vaut +1 ou −1. ⛔ Jamais en dessous de zéro : une bourse
 *  négative n'est pas une correction, c'est une faute qu'on propage. */
function ajuster(signe) {
  const champ = document.getElementById("argent-montant");
  const montant = Math.max(0, Math.floor(Number(champ.value) || 0));
  bourse[pieceChoisie] = Math.max(0, bourse[pieceChoisie] + signe * montant);
  dessinerBourse();
  mesurer();
}

/* ══ POSER, REPRENDRE — les deux seules choses que le banc fait d'un objet ══ */

/** Le premier récepteur libre, dans l'ordre du croquis (le sac avant la
 *  forge). C'est ce que le TAP choisit : « le glisser désigne SA case, le tap
 *  laisse l'écran choisir » (en-tête de `glisser.mjs`). */
function premierLibre() {
  return RECEPTEURS.find((r) => recepteurs[r] === null) ?? null;
}

function poser(creneau, objet) {
  if (!Object.prototype.hasOwnProperty.call(recepteurs, creneau)) return;
  recepteurs[creneau] = objet;
  dessiner();
}

function reprendre(creneau) {
  recepteurs[creneau] = null;
  dessiner();
}

/** UNE LIGNE D'OBJET — `.equipment-gear-row` du vrai écran, sur UNE ligne,
 *  et c'est elle l'objet qu'on prend.
 *
 *  ⭐ L'ASCENSEUR ET LE GLISSER NE SE DISPUTENT PLUS RIEN — ET LA TROISIÈME
 *  RÉPONSE EST LA BONNE. Le 20 août, la seule issue connue était de supprimer
 *  l'ascenseur (« il ne faut plus d'ascenseurs couplés avec des actions drag
 *  and drop »). Le 22 au matin, la garde d'axe les réconciliait par la
 *  DIRECTION du geste. Le 22 au soir, Eric a retiré le glisser : *« tout se
 *  passe dans le même sens, plus de glisser »*.
 *  📌 Ce qui rend la troisième meilleure que la deuxième : la garde d'axe
 *  MARCHAIT, et il fallait quand même l'expliquer au joueur. Un écran qui a
 *  besoin qu'on lui apprenne son geste a déjà perdu. */
function faireLigne(etagere, n) {
  /* ⭐ DES NOMS DE LA LONGUEUR RÉELLE, pas « exemple 01 ». Le sujet du jour
     EST la longueur des noms : un banc qui n'éprouve que des libellés courts
     aurait déclaré la tuile bonne alors que « Baguette de détection de la
     magie » ne tient pas. Le nom de l'étagère fournit la vraie mesure, et le
     numéro garde chaque ligne distincte. */
  const objet = `${etagere} ${String(n).padStart(2, "0")}`;

  const ligne = document.createElement("button");
  ligne.type = "button";
  ligne.className = "equipment-gear-row r-ligne";

  const nom = document.createElement("span");
  nom.className = "equipment-gear-name";
  nom.textContent = objet;

  /* ⛔ PLUS DE LIGNE DE MESURES — Eric, 2026-08-22 : *« faut vraiment que juste
     le titre s'affiche »*. Troisième état de cette tuile en une heure, et
     c'est le bon usage d'un banc : il itère sur ce qu'il VOIT. Cette consigne
     REMPLACE les deux précédentes (le poids retiré, puis remis sous le nom) ;
     on ne cherche pas à les concilier.
     📌 Le poids et le prix vivent sur la fiche de l'objet, qu'on ouvre au tap.
     Rien n'est perdu — c'est une question de PRIORITÉ dans la vitrine. */
  ligne.append(nom);

  /* ══ UN CLIC. RIEN D'AUTRE. — Eric, 2026-08-22 : *« tout se passe dans le
     même sens, plus de glisser »* ══════════════════════════════════════════
     ⭐ CE QUE CETTE LIGNE REMPLACE : `armerSelonAxe`, la garde d'axe, le seuil
     de 6 px, le réglage `k`, le drapeau d'annulation, le fantôme, et les deux
     curseurs du panneau. Tout ça n'existait que pour départager DEUX gestes
     sur un même appui. Il n'y en a plus qu'un, donc il n'y a plus rien à
     départager.
     🔴 ET TROIS DÉFAUTS MEURENT AVEC, dont deux étaient mesurés ce matin :
     · à la souris, un clic qui dérivait de 7 px vers le bas était REFUSÉ comme
       « geste vertical » — ni tap, ni dépôt, rien, et en silence ;
     · l'organe testait le tap AVANT l'annulation, si bien que chaque
       défilement au doigt posait un objet sans la garde ;
     · le fantôme et l'ascenseur se disputaient l'axe.
     Aucun n'a été corrigé : ils n'ont plus d'endroit où exister.
     📌 `click` et pas `pointerup` : c'est l'événement qui porte déjà le clavier
     (Entrée et Espace sur un `<button>`), et la tuile EST un `<button>`. Le
     geste devient accessible sans une ligne de plus. */
  ligne.addEventListener("click", () => {
    /* Dans le premier récepteur libre. S'il n'y en a plus, on ne fait rien —
       un banc ne remplace pas en silence ce qu'on y a posé. */
    const libre = premierLibre();
    if (libre) poser(libre, objet);
  });

  return ligne;
}

/** LE CONTENU D'UN RÉCEPTEUR — armé par le MÊME organe que la ligne d'où il
 *  vient, pour que le retour emprunte exactement le chemin de l'aller. */
function dessinerRecepteurs() {
  for (const clef of RECEPTEURS) {
    const slot = document.querySelector(`[data-creneau="${clef}"]`);
    const objet = recepteurs[clef];
    slot.dataset.rempli = objet === null ? "false" : "true";

    /* ⛔ PLUS D'ÉTIQUETTE `R.BAG.SLOT` DANS LA CASE : le badge du bloc la nomme
       déjà, et dans une case de 74 px elle occupait la place de ce qu'on y
       dépose. Un creux se lit à sa FORME, pas à sa légende. */
    if (objet === null) {
      const vide = document.createElement("span");
      vide.className = "glisse-creneau-valeur";
      vide.textContent = "déposer";
      swapContent(slot, [vide]);
      continue;
    }

    const pose = document.createElement("button");
    pose.type = "button";
    /* ⭐ LA MÊME CLASSE QUE DANS UNE TUILE — donc la même coupure sur deux
       lignes, le même corps, la même ellipse. Un seul code pour les deux
       endroits : c'est ce que « le récepteur a la taille de l'item » veut dire
       jusqu'au bout. */
    pose.className = "equipment-gear-name r-depose";
    pose.textContent = objet;
    pose.title = objet;
    /* ⭐ LE RETOUR EMPRUNTE LE CHEMIN DE L'ALLER, ET C'EST ENCORE VRAI — c'est
       même plus vrai qu'avant : un clic met dans le sac, un clic ressort. Le
       même geste dans les deux sens, au lieu d'un tap d'un côté et de trois
       issues de l'autre (dépôt, hors-cible, annulation).
       ⛔ CE QUI DISPARAÎT AVEC LE GLISSER : déplacer un objet d'un récepteur à
       l'autre en une fois. Il faut maintenant le ressortir puis le reposer —
       deux gestes au lieu d'un. C'est le prix de la décision, il est réel, et
       il se paie sur un sac qui compte peu de cases. */
    pose.addEventListener("click", () => reprendre(clef));
    swapContent(slot, [pose]);
  }
}

/** ⚠️ `sauf` DIT QUELLE PISTE NE DOIT PAS ÊTRE REMPLACÉE, ET C'EST LA PIÈCE
 *  QUI REND LA CASCADE POSSIBLE. Quand le viseur de A décide que B change, on
 *  redessine B et C — mais surtout PAS A, qui est en train de défiler sous le
 *  doigt. `swapContent` remplace les enfants : appliqué à la piste en cours de
 *  geste, il arracherait le contenu que le doigt pousse, et le défilement
 *  s'arrêterait net au milieu du mouvement.
 *  🔴 C'est le défaut qu'une cascade naïve produit toujours, et il ne se voit
 *  pas au clic — seulement au doigt, en continu. */
function dessiner(sauf) {
  const rayon = trouveRayon(rayonCourant);
  if (!rayon.etageres.some((e) => e.nom === etagereChoisie)) {
    etagereChoisie = etagereCourante();
  }

  /* ── la rangée du HAUT : sept rayons, fixes ── */
  if (sauf !== "rayons") swapContent(belts.rayons, troisTours((r) =>
    faireCran(r.rayon, r.compte, r.rayon === rayonCourant, () => {
      if (r.rayon === rayonCourant) return;
      rayonCourant = r.rayon;
      /* LE POINT QUE LE BANC TRANCHE : en A, on retombe sur la première
         étagère ; en B, sur celle qu'on avait laissée. Une seule ligne les
         sépare, et c'est `etagereCourante()` qui la porte. */
      etagereChoisie = etagereCourante();
      dessiner();
    }), CATALOGUE));

  /* ── la rangée du BAS : les étagères du rayon choisi ── */
  if (sauf !== "etageres") swapContent(belts.etageres, troisTours((e) =>
    faireCran(e.nom, e.compte, e.nom === etagereChoisie, () => {
      etagereChoisie = e.nom;
      /* La mémoire est tenue dans LES DEUX modes — voir la note de l'état. */
      souvenir.set(rayonCourant, e.nom);
      dessiner();
    }), rayon.etageres));

  /* ⛔ ON NE RECENTRE PAS LA PISTE QU'ON MANIPULE. `keepInView` déplace le
     défilement ; l'appliquer à la piste sous le doigt, c'est se battre avec le
     geste — le contenu part dans un sens pendant que le doigt le pousse dans
     l'autre. Les autres pistes, elles, doivent bien montrer ce qu'elles
     désignent après une cascade. */
  for (const piste of [belts.rayons, belts.etageres]) {
    if (piste === belts[sauf]) continue;
    keepInView(piste, piste.querySelector('[data-status="current"]'), sensHorizontal() ? "x" : "y");
  }

  /* ── R.list : le contenu de l'étagère ── */
  const etagere = rayon.etageres.find((e) => e.nom === etagereChoisie);

  if (etagere.compte === 0) {
    const vide = document.createElement("p");
    vide.className = "r-list-vide";
    /* ⚠️ UNE ÉTAGÈRE À ZÉRO N'EST PAS UNE ERREUR — les quatre de Companions
       et deux de Crafting sont annoncées à 0 par la commande. Le banc le DIT
       plutôt que de rendre une boîte muette. */
    vide.textContent = "Rien sur cette étagère — annoncée à 0.";
    swapContent(listeBoite, [vide]);
  } else {
    const nums = [];
    for (let n = 1; n <= etagere.compte; n += 1) nums.push(n);
    swapContent(listeBoite, troisTours((n) => faireLigne(etagere.nom, n), nums));
  }
  dessinerRecepteurs();
  mesurer();
}

/** Combien de lignes ENTIÈRES la fenêtre de `R.list` montre. La hauteur vient
 *  de la première ligne posée, jamais d'un littéral. */
function lignesVisibles() {
  const une = listeBoite.querySelector(".r-ligne");
  if (!une) return 0;
  const haut = une.getBoundingClientRect().height;
  return haut > 0 ? Math.floor(listeBoite.clientHeight / haut) : 0;
}

/* ══ LE BUDGET DE HAUTEUR — mesuré, jamais estimé ════════════════════════
   Eric, 2026-08-22 : *« calcule bien la quantité d'espace qu'on a en hauteur,
   qu'on n'ait pas de mauvaises surprises en arrivant dans le builder »*.

   ⭐ AUCUN CHIFFRE N'EST ÉCRIT ICI. La ceinture est une VRAIE ceinture, posée
   dans le banc : sa hauteur se lit sur elle. Les quatre blocs de `R` se
   mesurent aussi. Le jour où une cote change, ce relevé change tout seul —
   c'est la différence entre un budget et une croyance. */
function budgetHauteur() {
  const h = (sel) => {
    const n = document.querySelector(sel);
    return n ? Math.round(n.getBoundingClientRect().height) : 0;
  };
  const fenetre = window.innerHeight;
  const belt = h("#belt-chassis");
  const topbar = 0;                       // tranché : `R` ne s'en sert pas
  /* 🔴 L'UTILE SE MESURE, IL NE SE SOUSTRAIT PLUS. `fenêtre − belt` supposait
     que `innerHeight` soit la place réelle — l'hypothèse exacte qui a produit
     « la carte n'est pas fixe » sur l'iPhone d'Eric. On lit maintenant la
     hauteur de la zone que `.app` attribue vraiment à la scène : c'est le
     navigateur qui répond, barres de Safari comprises. */
  const utile = h(".banc-scroll");

  const blocs = [...document.querySelectorAll(".colonne-r > .bloc")];
  const detail = blocs.map((b) => {
    const id = b.querySelector(".bloc-id");
    return `${id ? id.textContent : "?"} ${Math.round(b.getBoundingClientRect().height)}`;
  }).join(" · ");
  const carte = Math.round(document.querySelector(".colonne-r").getBoundingClientRect().height);
  const coulisse = Math.round(listeBoite.getBoundingClientRect().height);
  /* La carte tient-elle sous la ceinture ? Si elle déborde, la règle d'Eric
     s'applique — on demande ce qu'elle porte EN TROP, on n'ajoute pas
     d'ascenseur. Le banc pose la question avec le nombre. */
  const reste = utile - carte;
  const scene = Math.round(document.querySelector(".scene").getBoundingClientRect().height);
  /* La tuile se remesure ici : `budgetHauteur` est appelée depuis `mesurer`,
     mais elle ne partage pas ses locales — et une valeur passée en argument de
     plus se serait périmée le jour où l'ordre des appels change. */
  const tuile = listeBoite.querySelector(".r-ligne");
  const tuileBox = tuile ? tuile.getBoundingClientRect() : { width: 0, height: 0 };


  /* ══ LA LIGNE QUI NE PEUT PAS MENTIR ═════════════════════════════════
     Trois hauteurs côte à côte : ce que le script croit (`innerHeight`), ce
     que Safari laisse vraiment (`visualViewport`), et ce que le CSS applique
     (`100dvh`, lu sur la sonde). Sur un bureau les trois sont égales — c'est
     pour ça que l'émulateur nous a menti à tous les deux. Sur un iPhone elles
     divergent, et l'écart est le nombre de pixels que le banc s'inventait. */
  const dvh = Math.round(document.querySelector(".sonde-dvh").getBoundingClientRect().height);
  const vv = window.visualViewport ? Math.round(window.visualViewport.height) : fenetre;
  const accord = fenetre === vv && vv === dvh;

  /* ══ L'ARBITRAGE ENTIER, SUR QUATRE LIGNES ══════════════════════════
     Les quatre chiffres qui bougent ENSEMBLE quand on déplace le curseur de
     partage. Sans eux, élargir les tuiles se choisit à l'aveugle : on voit ce
     qu'on gagne (des noms lisibles) et jamais ce qu'on paie (une carte plus
     étroite, donc plus haute, donc qui déborde davantage). */
  const t = nomsTronques();
  /* ⛔ CE N'EST PLUS UN ARBITRAGE — en FF il n'y a qu'une colonne, et le
     partage qui se réglait ici n'existe plus. Ce qui reste utile est la
     largeur que la BANDE occupe, et surtout ce qu'elle tronque encore. */
  const railL = Math.round(document.querySelector(".r-tuiles").getBoundingClientRect().width);
  const carteL = Math.round(document.querySelector(".colonne-r").getBoundingClientRect().width);
  const debord = carte - utile;
  /* ⭐ LES TROIS CHIFFRES QUI DISENT D'UN COUP SI LE CADRAGE TIENT : la
     largeur EFFECTIVE de la colonne (entre ses deux bornes), ce qu'elle
     tronque encore, et le vide qui reste de chaque côté. Les deux vides
     doivent être ÉGAUX — c'est la preuve du centrage, et elle se lit sans
     calculer. */
  const sceneBox = document.querySelector(".scene").getBoundingClientRect();
  const groupe = Math.round(railL + carteL);
  const videG = Math.round(document.querySelector(".r-tuiles").getBoundingClientRect().left - sceneBox.left);
  const videD = Math.round(sceneBox.right - document.querySelector(".colonne-r").getBoundingClientRect().right);
  const arbitrage = `\n`
    + `── cadrage ───────────────────────────────────────────────\n`
    + `bande R.list     ${railL} px   (plus de plancher ni de plafond : c'est la scène)\n`
    + `noms tronqués    ${t.tronques} sur ${t.total}\n`
    + `carte            ${carteL} px   (--card-w, plafond ${getComputedStyle(document.documentElement).getPropertyValue("--card-w").trim()})\n`
    + `groupe           ${groupe} px\n`
    + `vide g. / d.     ${videG} / ${videD} px   ${videG === videD ? "✓ centré" : `✗ décalé de ${Math.abs(videG - videD)} px`}\n`
    + `hauteur carte    ${carte} px → ${debord > 0 ? `DÉBORDE de ${debord} px` : `il reste ${-debord} px`}\n`
    + `crans R.cat      ${cransEntiers(belts.rayons)} entiers sur ${belts.rayons.children.length}\n`
    + `tuiles visibles  ${lignesVisibles()}\n`;

  return arbitrage + `\n`
    + `── viewport ──────────────────────────────────────────────\n`
    + `innerHeight      ${fenetre} px\n`
    + `visualViewport   ${vv} px\n`
    + `100dvh (sonde)   ${dvh} px\n`
    + `                 ${accord
        ? "les trois s'accordent — écran sans chrome mobile (bureau ou émulateur)"
        : `✗ ILS DIVERGENT de ${Math.max(fenetre, vv, dvh) - Math.min(fenetre, vv, dvh)} px — `
          + "les barres de Safari. C'est ce que `vh` ignorait."}\n`
    + `\n`
    + `── budget de hauteur ─────────────────────────────────────\n`
    + `fenêtre          ${fenetre} px\n`
    + `belt (mesuré)    ${belt} px   ceinture réelle, posée dans le banc\n`
    + `stage-topbar     ${topbar} px   TRANCHÉ : R ne s'en sert pas (bourse dans R.find, catégories dans R.cat)\n`
    + `utile            ${utile} px   MESURÉ sur la zone que .app attribue, jamais soustrait\n`
    + `carte R          ${carte} px   ${detail}\n`
    + `reste sous R     ${reste} px   ${reste >= 0 ? "✓ la carte tient" : "✗ la carte DÉBORDE — que porte-t-elle en trop ?"}\n`
    + `coulisse gauche  ${coulisse} px sur ${utile} utiles   ${coulisse <= utile ? "✓" : "✗ dépasse"}\n`
    /* 🔴 LA VRAIE QUESTION EST LA SCÈNE ENTIÈRE, PAS LA CARTE SEULE. À deux
       colonnes, `R` et les tuiles se partagent la largeur et la plus haute
       décide ; EMPILÉES (≤ 640 px), elles s'ADDITIONNENT. C'est là que ça
       casse en premier, et le relevé le dit avec le nombre plutôt que de
       laisser la surprise pour le builder. */
    + `scène (2 colonnes) ${scene} px sur ${utile} utiles   `
    /* ⛔ « LA PAGE DÉFILERA » ÉTAIT FAUX DEPUIS LE PASSAGE EN `dvh` : la scène
       est en `overflow: hidden`, donc rien ne défile — ce qui dépasse est
       COUPÉ, et la carte ne bouge pas. C'est exactement ce qu'Eric demandait,
       et le verdict doit dire ce qui arrive vraiment. */
    + `${scene <= utile ? "✓ tout tient" : `✗ dépasse de ${scene - utile} px — coupé en bas (la carte, elle, ne bouge pas)`}\n`
    /* ══ LES DEUX ÉCRANS CÔTE À CÔTE, CE QU'ERIC A FAIT SUR SON IPHONE ═════
       Les chiffres de Species sont RELEVÉS dans le vrai builder à 375 × 812
       (`index.html`, même serveur, 2026-08-22), pas estimés. Les mettre ici
       est ce qui rend l'écart lisible sans changer d'écran. */
    + `\n── Species (relevé) vs R (mesuré ici), à 375 ──────────────\n`
    + `                 Species              R\n`
    + `belt             60                   ${belt}\n`
    + `stage-topbar     0                    ${topbar}\n`
    + `utile            752                  ${utile}${utile < 700 ? "  ← chrome mobile réel" : ""}\n`
    + `bande R.list     toute la scène       ${Math.round(document.querySelector(".r-tuiles").getBoundingClientRect().width)}\n`
    + `colonne large    285                  ${Math.round(document.querySelector(".colonne-r").getBoundingClientRect().width)}\n`
    + `air de la carte  8 px (.fiche-dalle)  ${getComputedStyle(document.querySelector(".colonne-r")).padding}\n`
    + `écart interne    8 px                 ${getComputedStyle(document.querySelector(".colonne-r")).gap}\n`
    + `carte            440 (F1 dans 752)    ${carte}\n`
    + `item étroit      74 × 30 · --t2       ${Math.round(tuileBox.width)} × ${Math.round(tuileBox.height)} · --t2\n`
    + `la page défile   non                  ${scene <= utile ? "non ✓" : "OUI ✗"}\n`;
}

/** Combien de crans ENTIERS une piste montre — le critère d'Eric, mesuré à
 *  chaque redessin plutôt que jugé à l'œil. Un cran seulement amorcé ne
 *  compte pas : c'est justement ce que la première pose confondait. */
function cransEntiers(piste) {
  const boite = piste.getBoundingClientRect();
  const cs = getComputedStyle(piste);
  const gauche = boite.left + parseFloat(cs.paddingLeft || 0);
  const droite = boite.right - parseFloat(cs.paddingRight || 0);
  let n = 0;
  for (const cran of piste.children) {
    const k = cran.getBoundingClientRect();
    if (k.left >= gauche - 0.5 && k.right <= droite + 0.5) n += 1;
  }
  return n;
}

function mesurer() {
  const l = (n) => (n ? Math.round(n.getBoundingClientRect().width) : 0);
  const h = (n) => (n ? Math.round(n.getBoundingClientRect().height) : 0);
  const cranHaut = belts.rayons.querySelector(".belt-item");
  const cranBas = belts.etageres.querySelector(".belt-item");
  const air = Math.round(parseFloat(getComputedStyle(belts.rayons).paddingLeft) || 0);
  const debordeHaut = belts.rayons.scrollWidth > belts.rayons.clientWidth;
  const debordeBas = belts.etageres.scrollWidth > belts.etageres.clientWidth;
  const entiersHaut = cransEntiers(belts.rayons);
  const entiersBas = cransEntiers(belts.etageres);
  const fond = getComputedStyle(document.querySelector(".app")).backgroundImage;
  const fondPose = fond && fond !== "none";
  const uneLigne = listeBoite.querySelector(".r-ligne");
  const hauteurLigne = uneLigne ? Math.round(uneLigne.getBoundingClientRect().height) : 0;

  document.getElementById("mesures").textContent =
      `écran            ${window.innerWidth} × ${window.innerHeight}\n`
    + `colonne R.cat    ${l(belts.rayons.parentElement)} px de large\n`
    + `air aux bouts    ${air} px  (8 attendus — shell.css en impose 37 aux onglets)\n`
    + `cran du haut     ${l(cranHaut)} × ${h(cranHaut)}   dalle, --t3\n`
    + `cran du bas      ${l(cranBas)} × ${h(cranBas)}   mot, --t2\n`
    /* 🔴 LE CRITÈRE D'ERIC, CHIFFRÉ : au moins 4 crans ENTIERS et le 5ᵉ
       amorcé. Le relevé le dit, verdict compris — un banc qui affiche la
       mesure sans la juger laisse le lecteur faire l'arithmétique. */
    + `crans entiers    haut ${entiersHaut} ${entiersHaut >= 4 ? "✓" : "✗ (4 exigés)"} · bas ${entiersBas}   sur ${belts.rayons.children.length} et ${belts.etageres.children.length}\n`
    + `débordement      haut ${debordeHaut ? "oui" : "non"} · bas ${debordeBas ? "oui" : "non"}  (la piste défile)\n`
    + `tuiles R.list    ${lignesVisibles()} visibles · ${listeBoite.children.length} en tout · tuile = ${hauteurLigne} px\n`
    + `récepteurs       bag ${recepteurs.bag ?? "—"} · craft ${recepteurs.craft ?? "—"}\n`
    /* ⛔ PLUS DE LIGNE « sensibilité » NI « dernier geste » : elles mesuraient
       un arbitrage entre deux gestes, et il n'y a plus qu'un clic. Un relevé
       qui garde une mesure sans objet apprend au lecteur à ne plus le lire. */
    + `cote F1          ${COTE_F1}  (lue dans fiche.css, jamais recopiée)\n`
    + `zone de coulisse ${Math.round(listeBoite.getBoundingClientRect().height)} px — sans cadre, tuiles posées sur le fond\n`
    + `bourse           ${BOURSE.map((c) => `${bourse[c]} ${c}`).join(" · ")}   ajustable à la main (3ᵉ geste, pas de « sell »)\n`
    + `R.bag.image      place réservée 48 × 48 — destination B3 ou SB3.1, non tranchée\n`
    + `fond             ${fondPose ? "posé (.app, --bg-image)" : "ABSENT — rien ne se juge"}\n`
    + `R.purse.ajust    le MJ donne, ou le joueur se corrige. ⛔ pas de « vendre » :\n`
    + `                 retirer un objet du sac ne rend pas l'argent (acheter · gratuit · ajuster)\n`
    + budgetHauteur()
    + `mode             ${mode} — ${mode === "A" ? "le bas oublie" : "le bas se souvient"}\n`
    + `ouvert sur       ${rayonCourant} › ${etagereChoisie}`;
}

/* ── L'INTERRUPTEUR A/B ─────────────────────────────────────────────── */
const dit = document.getElementById("variante-dit");
const boutons = [...document.querySelectorAll(".variante .record-option")];

function poserMode(nouveau) {
  mode = nouveau;
  for (const b of boutons) b.dataset.active = b.dataset.mode === mode ? "true" : "false";
  dit.textContent = mode === "A"
    ? "A — changer de rayon retombe toujours sur la première étagère alphabétique."
    : "B — chaque rayon garde l'étagère où on l'avait laissé. Va poser une étagère dans deux rayons, puis reviens.";
  etagereChoisie = etagereCourante();
  dessiner();
}

for (const b of boutons) b.addEventListener("click", () => poserMode(b.dataset.mode));

/* R.menu : les ⋮ n'ouvrent rien — `R.html` dit qu'on ne sait pas encore ce
   qu'ils font. Un banc ne comble pas un trou de conception en douce. */
document.getElementById("argent-plus").addEventListener("click", () => ajuster(+1));
document.getElementById("argent-moins").addEventListener("click", () => ajuster(-1));

/* GET BACK — il reprend ce que `R.craft.slot` tient, et rien d'autre. C'est
   le bouton du croquis, à sa place ; il ne double aucun geste, il donne un
   nom au retour depuis la forge. */
document.getElementById("r-getback").addEventListener("click", () => reprendre("craft"));

document.getElementById("r-menu").addEventListener("click", (e) => {
  e.currentTarget.setAttribute("aria-label", "R.menu — sans destination, à nommer");
});

/* ══ LA CEINTURE INERTE — les dix étapes du vrai builder ═════════════════
   Recopiées de `shell.mjs` parce que ce sont des LIBELLÉS, pas une cote : ce
   qu'on mesure ici est la HAUTEUR de la ceinture, et elle vient du CSS. Si un
   libellé changeait, la hauteur ne bougerait pas d'un pixel.
   ⛔ Aucun `data-status`, aucun écouteur : elle occupe la place, rien de plus. */
const ETAPES = ["Menu", "Identity", "Species", "Inheritance", "Destiny",
                "Class", "Abilities", "Skills", "Equipment", "Sheet"];
swapContent(document.getElementById("belt-etapes"), ETAPES.map((mot, i) => {
  const cran = document.createElement("div");
  cran.className = "belt-item";
  const num = document.createElement("span");
  num.className = "belt-index";
  num.textContent = String(i);
  const lab = document.createElement("span");
  lab.className = "belt-label";
  lab.textContent = mot;
  cran.append(num, lab);
  return cran;
}));

/* ══ LE PANNEAU DU BANC — il se superpose, il n'habite pas la scène ══════
   ⭐ Le relevé n'est recalculé qu'à L'OUVERTURE : mesurer en continu un
   panneau fermé ne sert personne, et `mesurer()` lit une trentaine de
   rectangles. Un banc n'a pas à peser sur le geste qu'il éprouve. */
const panneau = document.getElementById("banc-panneau");
function panneauOuvert() { return !panneau.hidden; }
function ouvrirPanneau(ouvert) {
  panneau.hidden = !ouvert;
  if (ouvert) mesurer();
}
/* ⚠️ CHANGER DE SENS N'EST PAS QU'UNE AFFAIRE DE FEUILLE : les trois roues
   doivent se REPOSER sur leur tour du milieu dans le nouvel axe, sinon la
   première couture les fait bondir. Et le redessin complet est nécessaire —
   `keepInView` recentre selon un axe qu'il lit au moment de l'appel. */
document.getElementById("banc-sens").addEventListener("click", () => {
  if (app.dataset.sens === "v") delete app.dataset.sens;
  else app.dataset.sens = "v";
  dessiner();
  rejugerRayons();
  rejugerEtageres();
  rejugerListe();
  if (panneauOuvert()) mesurer();
});
document.getElementById("banc-bouton").addEventListener("click", () => ouvrirPanneau(true));
document.getElementById("banc-fermer").addEventListener("click", () => ouvrirPanneau(false));
/* Le voile ferme, le corps non — sinon régler un curseur refermerait tout. */
panneau.addEventListener("click", (e) => { if (e.target === panneau) ouvrirPanneau(false); });

/** COMBIEN DE NOMS SONT ENCORE TRONQUÉS — mesuré sur TOUTES les tuiles de
 *  l'étagère, jamais sur un échantillon ni à l'œil.
 *
 *  🔴 ET LE TEST EST VERTICAL, PAS HORIZONTAL. La consigne disait de comparer
 *  `scrollWidth` à `clientWidth` — c'est le bon test pour une ellipse sur UNE
 *  ligne, et il ne voit plus rien depuis que le nom se déplie : `line-clamp`
 *  coupe en HAUTEUR. Un nom tronqué a donc `scrollHeight > clientHeight`, et
 *  sa largeur, elle, tient parfaitement. Le test d'hier aurait rendu « 0
 *  tronqué » sur trente-deux baguettes coupées. */
function nomsTronques() {
  const noms = listeBoite.querySelectorAll(".equipment-gear-name");
  let n = 0;
  for (const nom of noms) if (nom.scrollHeight > nom.clientHeight + 1) n += 1;
  return { tronques: n, total: noms.length };
}

/* ⛔ LES DEUX CURSEURS DU PANNEAU SONT PARTIS AVEC LE GESTE QU'ILS RÉGLAIENT.
   `distance` et `angle` servaient à sentir où basculait l'arbitrage entre
   parcourir et prendre. Sans arbitrage, un curseur ne règle plus rien — et un
   réglage sans effet est pire qu'absent : on croit avoir essayé. */

/* ══ L'ORIENTATION — Eric, 2026-08-22 : *« on peut le faire en vertical comme
   en horizontal »* · *« un défilement vertical serait vraiment sexy »* ══════
   ⭐ ELLE SE BASCULE AU BANC PLUTÔT QUE DE SE DÉCIDER AU CLAVIER. Les deux
   sens ont un argument mesuré contre eux : en colonnes, trois pistes de 125 px
   tronquent les noms PIRE que la colonne latérale qu'on vient de retirer ; en
   bandes, la troncature disparaît mais on empile trois hauteurs. Aucun des
   deux ne se trancherait honnêtement sur un trackpad — c'est un geste de
   pouce. Le banc existe pour ça. */

/* Le viseur est posé PAR-DESSUS chaque piste, une fois — il ne se redessine
   jamais, contrairement à ce qu'il vise. */
for (const belt of document.querySelectorAll(".belt")) {
  const v = document.createElement("div");
  v.className = "belt-viseur";
  v.setAttribute("aria-hidden", "true");
  belt.append(v);
}

/* ══ LA CASCADE, ET ELLE NE VA QUE VERS LE BAS ═════════════════════════════
   A commande B, B commande C. ⛔ Jamais l'inverse : si C rappelait B, se poser
   sur un objet redessinerait l'étagère, qui redessinerait les objets — la
   boucle est immédiate et elle se manifeste par un écran qui tremble.
   📌 C n'a PAS de rappel du tout : son viseur ne fait que marquer `data-vise`,
   parce qu'en C le viseur désigne et n'achète pas. */
/** ⏱️ « ON CHOISIT ENCORE A » — et ça ne se déduit pas, ça se CHRONOMÈTRE.
 *  Un défilement natif n'annonce ni son début ni sa fin : il n'existe que des
 *  événements `scroll`. On considère donc qu'un geste est en cours tant qu'un
 *  `scroll` est arrivé dans les 260 dernières ms, et fini au-delà.
 *  ⚠️ 260 ms parce qu'un défilement inertiel sur iOS espace ses événements en
 *  fin de course : trop court, C réapparaîtrait au milieu du geste, juste
 *  avant de disparaître à nouveau — le clignotement qu'on cherche à éviter. */
let finDuGeste = null;
function choisitA(oui) {
  clearTimeout(finDuGeste);
  if (oui) {
    app.dataset.choisit = "A";
    finDuGeste = setTimeout(() => { delete app.dataset.choisit; }, 260);
  } else {
    delete app.dataset.choisit;
  }
}

/** L'impression de vitesse : on retire l'attribut puis on le repose après un
 *  reflow forcé. ⚠️ Sans cette lecture de `offsetWidth`, le navigateur groupe
 *  les deux écritures et l'animation ne rejoue PAS — le défaut classique, et
 *  il est silencieux : on croit que l'animation ne marche pas. */
function lancerC() {
  delete listeBoite.dataset.fraiche;
  void listeBoite.offsetWidth;
  listeBoite.dataset.fraiche = "true";
  rejugerListe();
}

const rejugerRayons = brancherViseur(belts.rayons, (cran) => {
  const nom = cran.dataset.cran ?? cran.textContent.trim();
  if (nom === rayonCourant || !CATALOGUE.some((r) => r.rayon === nom)) return;
  rayonCourant = nom;
  etagereChoisie = etagereCourante();
  dessiner("rayons");          // B et C se refont, A garde son geste
  rejugerEtageres();
  lancerC();
});
belts.rayons.addEventListener("scroll", () => choisitA(true), { passive: true });
const rejugerEtageres = brancherViseur(belts.etageres, (cran) => {
  const nom = cran.dataset.cran ?? cran.textContent.trim();
  const rayon = trouveRayon(rayonCourant);
  if (nom === etagereChoisie || !rayon.etageres.some((e) => e.nom === nom)) return;
  etagereChoisie = nom;
  souvenir.set(rayonCourant, nom);
  dessiner("etageres");        // C se refait, B garde son geste
  lancerC();
});
/* ⛔ C N'A PAS DE RAPPEL — son viseur DÉSIGNE, il ne déclenche rien. Mais il
   faut garder sa fonction de rejugement : C est remplacé à chaque cascade, et
   des enfants neufs n'ont ni `data-vise` ni perspective tant que personne ne
   les a jugés. Mesuré : 0 transform sur 99 nœuds, pendant que A et B en
   avaient 21/21 et 9/9 — le seul niveau qu'on ne rejugeait pas. */
const rejugerListe = brancherViseur(listeBoite, () => {});

dessinerBourse();
poserMode("A");
rejugerRayons();
rejugerEtageres();
rejugerListe();
window.addEventListener("resize", () => mesurer());
/* 🔴 ET `visualViewport`, QUI EST LE SEUL À PARLER SUR IPHONE. Quand la barre
   d'adresse de Safari se replie, la place disponible change de ~100 px SANS
   qu'un `resize` de fenêtre soit garanti — le relevé afficherait alors des
   chiffres périmés au moment précis où Eric regarde s'ils divergent. C'est le
   même défaut que `vh`, une couche plus haut : croire que `window` sait. */
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => mesurer());
  window.visualViewport.addEventListener("scroll", () => mesurer());
}

/* ══ LA RÈGLE — pour qu'Eric puisse me contredire ═══════════════════════
   Eric, 2026-08-22 : *« je ne te crois pas et j'ai aucun moyen de te
   contredire »*. Il avait raison : tous les chiffres de ce banc passaient
   par un rapport écrit, donc par quelqu'un. Un relevé qui se lit en bas de
   page demande la même confiance qu'une phrase.

   ⭐ Ce bloc ne mesure rien de plus — il DESSINE ce qui est déjà mesuré, à
   l'endroit exact où ça se passe. La ligne « fin de l'espace attribué » est
   posée par `getBoundingClientRect`, pas par une constante : si elle ment,
   elle ment visiblement. */
(function regle() {
  const nid = document.createElement("div");
  nid.id = "regle-couche";
  nid.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999;display:none";
  document.body.append(nid);

  const bouton = document.createElement("button");
  bouton.type = "button";
  bouton.id = "regle-bouton";
  bouton.textContent = "Afficher la règle";
  /* 🔴 IL ÉTAIT EN BAS À DROITE, ET IL RECOUVRAIT `GET BACK` sur les captures
     d'Eric. Il rejoint la barre d'outils du banc, en bas à GAUCHE, dans le
     coin mort sous la colonne de tuiles — le seul endroit de l'écran où aucun
     élément de `R` ne vit. Il garde sa teinte : Eric le reconnaît, et il a
     demandé à garder la règle. */
  bouton.style.cssText = "padding:3px 5px;font:600 10px/1.2 system-ui,sans-serif;"
    + "border-radius:8px;border:1px solid #0006;background:#e8c07d;color:#1a1a1a;"
    + "cursor:pointer;opacity:.85";
  bouton.textContent = "règle";
  (document.getElementById("banc-outils") || document.body).append(bouton);

  const trait = (haut, texte, couleur) => {
    const l = document.createElement("div");
    l.style.cssText = `position:absolute;left:0;right:0;top:${haut}px;height:0;`
      + `border-top:2px dashed ${couleur}`;
    const t = document.createElement("span");
    t.textContent = texte;
    t.style.cssText = `position:absolute;right:4px;top:-18px;font:600 12px/1 system-ui,sans-serif;`
      + `color:${couleur};background:#000a;padding:2px 6px;border-radius:4px`;
    l.append(t);
    nid.append(l);
  };

  const cadre = (r, texte, couleur) => {
    const d = document.createElement("div");
    d.style.cssText = `position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;`
      + `height:${r.height}px;outline:2px solid ${couleur};outline-offset:-1px`;
    const t = document.createElement("span");
    t.textContent = `${texte} — ${Math.round(r.width)} × ${Math.round(r.height)}`;
    t.style.cssText = `position:absolute;left:0;top:0;font:600 12px/1 system-ui,sans-serif;`
      + `color:#000;background:${couleur};padding:2px 6px`;
    d.append(t);
    nid.append(d);
  };

  const dessiner = () => {
    /* ⛔ `removeChild` ÉTAIT ÉCRIT ICI, et `tests/socle.test.mjs` l'interdit
       dans tout `ui/builder/` au même titre qu'`innerHTML` — le garde ne
       balaye aujourd'hui que les `.mjs`, donc il n'a rien dit. Le geste est
       le même : on passe par le seul remplaçant du dépôt. */
    swapContent(nid, []);
    const belt = document.querySelector(".belt");
    const scene = document.querySelector(".banc-scroll");
    /* 🔴 CES DEUX SÉLECTEURS ÉTAIENT FAUX, et l'overlay ne le disait pas :
       `.r-carte` et `.r-list-coulisse` n'existent nulle part dans ce banc. Le
       premier retombait sur le PARENT de `.r-cat` (juste par chance la carte),
       le second sur `[class*=r-list]` — qui attrapait le conteneur de la
       colonne latérale (retirée depuis), et pas la zone qui coulisse. Les cadres encadraient donc
       autre chose que ce qu'ils annonçaient, en silence.
       ⭐ Nommés en dur maintenant, sans repli : un cadre qui ne trouve pas sa
       cible ne se dessine pas, plutôt que d'en encadrer une autre. */
    const carte = document.querySelector(".colonne-r");
    const liste = document.querySelector(".r-tuiles");
    if (belt) cadre(belt.getBoundingClientRect(), "belt (châssis)", "#7fd1ff");
    if (carte) cadre(carte.getBoundingClientRect(), "R — la carte", "#e8c07d");
    if (liste) cadre(liste.getBoundingClientRect(), "les tuiles", "#9fe38a");
    if (scene) {
      const r = scene.getBoundingClientRect();
      trait(r.top, "début de l'espace attribué", "#ff7a7a");
      trait(r.bottom, "FIN de l'espace attribué — rien ne devrait dépasser", "#ff7a7a");
    }
  };

  bouton.addEventListener("click", () => {
    const on = nid.style.display === "none";
    nid.style.display = on ? "block" : "none";
    bouton.textContent = on ? "règle ✓" : "règle";
    if (on) dessiner();
  });
  window.addEventListener("resize", () => { if (nid.style.display === "block") dessiner(); });
  window.addEventListener("scroll", () => { if (nid.style.display === "block") dessiner(); }, true);
})();

</script>
</body>
</html>
