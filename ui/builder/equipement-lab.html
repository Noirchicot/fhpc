<link rel="stylesheet" href="./fiche.css?v=278">
<style>
  /* ══ BANC D'ESSAI — pas une page du builder ═══════════════════════════
     Commande d'Eric, 2026-08-21 : l'écran `R` du croquis
     `fh-phb/croquis/2026-08-21-equipement-R-B-SB.jpg`, nommé pièce par pièce
     dans `fh-phb/docs/lab/R.html`. La colonne d'objets (`R.list`) à GAUCHE,
     qui défile ; la colonne de commande à DROITE, qui empile `R.cat`
     (les onglets), `R.find` (recherche + bourse), `R.bag`, `R.craft`.

     ⚠️ CE FICHIER N'EST PAS TENU PAR LES GARDES DE `shell.css` (littéraux de
     couleur, d'espacement, de corps) — c'est un banc, pas de la production.
     Il emprunte en revanche les VRAIS organes : `.belt`/`.belt-track`/
     `.belt-item` pour les deux carrousels, `.glisse-creneau` pour les
     récepteurs, `.equipment-*` pour la bourse, la recherche et les lignes
     d'objet, `swapContent` de `socle.mjs` pour tout remplacement de contenu.
     Ce qu'on éprouve ici est ce qui tournera.

     ⛔ AUCUN `innerHTML`, AUCUN `replaceChildren`, AUCUN `removeChild` :
     `tests/socle.test.mjs` balaye `ui/builder/` et interdit les trois hors de
     `socle.mjs`. Ce banc passe donc par `swapContent`, comme le builder.
     ⛔ ET `?v=278` SUR CHAQUE LIEN : `tests/versions-graphe.test.mjs` exige
     une seule version dans tout le graphe `ui/`. */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: var(--t4); line-height: 1.5;
  }

  /* ══ LE VRAI FOND DU BUILDER, ET C'EST UN INSTRUMENT DE MESURE ════════
     Eric, 2026-08-22 : *« mets un fond derrière, je veux m'assurer que les
     marges sont respectées, que la dalle flotte »*.

     🔴 SANS LUI, UNE DALLE OPAQUE ET UNE DALLE VOILÉE SONT INDISCERNABLES —
     et ce n'est pas une intuition, c'est l'incident du 2026-08-15, raconté
     dans `shell.css` : Eric voyait *« rien de transparent ici »* alors que
     les voiles étaient bien posés, 35 % et 50 %, mesurés. *« La cause n'était
     pas les voiles, c'était ce qu'il y a derrière (…) un voile sur du plein
     ne se voit pas. »* Un banc sans fond ne permet donc de valider NI
     d'infirmer quoi que ce soit sur la matière.

     ⭐ LA CLASSE EST EMPRUNTÉE, PAS RECOPIÉE. `.app` porte déjà
     `background-image: var(--bg-image)`, `cover`, `center` — et le jeton
     bascule seul sur `bg-night.jpg` en thème sombre. Recopier la déclaration
     l'aurait fait diverger, exactement comme pour la cote F1.
     ⭐ ET ON PREND LE CADRE ENTIER, PAS SEULEMENT SON FOND : `.app` fait
     100 dvh et ne défile pas, ce qui rend son fond IMMOBILE par construction
     (« une propriété de moins, et celle-là est justement connue pour ramer
     sur mobile »). Le banc défile donc DANS un `.banc-scroll`, comme la fiche
     défile dans la scène. Aucune propriété de `.app` n'est réécrite : c'est
     la seule façon d'éprouver le fond tel qu'Eric le verra.
     📌 Chemin vérifié : `--bg-image` vaut `url("./assets/bg-day.jpg?v=278")`,
     relatif à `tokens.css`, qui vit dans le même dossier que ce banc — il
     résout. Un fond manquant est silencieux, il fallait le confirmer. */
  /* ══ 🔴 `dvh`, JAMAIS `vh` — ET C'EST UN DÉFAUT, PAS UN CHOIX ════════
     Eric, deux fois sur son vrai iPhone : *« la carte n'est pas fixe »*. Nos
     deux mesures disaient le contraire, et les deux étaient fausses de la même
     façon.

     🔴 `vh` IGNORE LES BARRES DE SAFARI. Sur un iPhone, la barre d'adresse et
     la barre d'outils prennent près de 200 px : `78vh` se calculait sur 812
     alors que l'écran n'en offrait que ~550. La scène était donc trop haute,
     la page défilait, et la carte partait vers le haut — il ne lui restait que
     `R.craft` à l'écran. Le dépôt a déjà tranché : `shell.css` écrit
     `height: 100dvh` sur `.app`, et le note comme une exigence.

     ⭐ ET LE VRAI CORRECTIF N'EST PAS DE REMPLACER `vh` PAR `dvh`. Le banc doit
     se comporter comme le builder : une racine en `100dvh` qui NE DÉFILE PAS
     (`.app`, empruntée telle quelle), une scène qui tient dedans, et les tuiles
     qui coulissent DANS LEUR BOÎTE. Cette zone-ci est donc la scène, et elle
     est en `overflow: hidden` comme `.app` : ce qui ne tient pas se voit
     coupé, au lieu de repousser la carte hors de l'écran.
     ⛔ LE NOM `.banc-scroll` RESTE : l'overlay « Afficher la règle » le vise
     pour tracer l'espace attribué, et c'est bien ce qu'il mesure. Renommer
     casserait la règle pour un mot.

     ⚠️ ET LA LEÇON DU LOT, QUI DÉPASSE CE FICHIER : **l'émulateur ment.** Le
     mode « mobile » d'un navigateur de bureau donne 375 × 812 PLEINS, sans
     chrome iOS. « La page ne défile pas » y était vrai, et faux sur
     l'appareil. Une mesure juste sur le mauvais terrain — un banc d'essai plus
     GÉNÉREUX que le réel. D'où la ligne `viewport` du relevé, qui met les
     trois hauteurs côte à côte : sur un bureau elles sont égales, sur
     l'iPhone d'Eric elles divergent, et il voit de combien. */
  /* ══ LA COTE D'UNE TUILE — ÉCRITE UNE FOIS, LUE DEUX FOIS ════════════
     La colonne de tuiles ET les récepteurs doivent avoir la MÊME largeur :
     *« les zones de drop ont pas besoin d'être aussi larges = taille de
     l'item »* (Eric, 2026-08-22). Deux expressions séparées auraient divergé
     au premier réglage — c'est la faute que ce dépôt paie ailleurs.

     ⭐ `100vw` ET NON `100%`, ET C'EST CE QUI REND LE PARTAGE POSSIBLE : une
     propriété personnalisée est substituée TELLE QUELLE chez qui la lit, donc
     un `100%` s'y résoudrait contre le bloc conteneur de CHAQUE lecteur —
     la scène pour la colonne, la carte pour le récepteur. Deux largeurs
     différentes sous un seul nom. `100vw` ne dépend de personne.
     ⚠️ Légitime ici parce que RIEN NE DÉFILE : `.app` est en `overflow:
     hidden`, il n'y a pas de barre de défilement de page à retrancher
     (vérifié : `scrollWidth === clientWidth`). Dans une page qui défile,
     `100vw` mentirait de la largeur de la barre. */
  .app { --tuile-col: clamp(var(--r-rail-min, 90px), calc(100vw - var(--card-w)), var(--r-rail-max, 140px)); }

  .banc-scroll {
    flex: 1 1 auto; min-height: 0;
    overflow: hidden;
    /* ⛔ AUCUNE GOUTTIÈRE EXTÉRIEURE, ET C'EST UNE MESURE : chez Species, le
       rail part de `left: 0` et la scène de `left: var(--rail-w)` — les deux
       colonnes se partagent les 375 px SANS rien perdre aux bords. Le banc en
       reprenait 16 en padding plus 8 d'écart, soit 24 volés à la carte (285
       attendus, 261 mesurés). L'air se pose DANS les colonnes (le rail a le
       sien, la carte le sien), jamais autour d'elles. */
    padding: 0;
    position: relative;      /* l'overlay « Afficher la règle » s'y accroche */
  }

  /* ══ LA SONDE — ELLE SEULE SAIT CE QUE `100dvh` VAUT VRAIMENT ════════
     Un élément haut de `100dvh`, invisible et hors du pointeur, qu'on mesure.
     C'est la seule façon d'AFFICHER la valeur que le navigateur applique, au
     lieu de la supposer égale à `innerHeight` — l'hypothèse qui nous a tous
     les deux trompés. */
  .sonde-dvh {
    position: fixed; top: 0; left: 0; width: 0; height: 100dvh;
    visibility: hidden; pointer-events: none;
  }

  /* ══ LE MOBILIER DU BANC SORT DE LA SCÈNE, EN HAUT COMME EN BAS ═════
     Eric, 2026-08-22, sur son iPhone : *« enlever notes de merde en bas, on
     voit pas s'il y a une marge ou pas »*.

     🔴 LE `<details>` REPLIÉ NE PRENAIT PRESQUE PAS DE HAUTEUR — ET C'ÉTAIT
     QUAND MÊME LE DÉFAUT. Il occupait le BORD BAS, et le bord est exactement
     ce qu'on regarde pour juger d'une marge. Une bande de 24 px collée sous la
     carte rend la question insoluble : on ne sait plus si le blanc qu'on voit
     appartient à la carte ou au meuble.
     ⭐ LE CRITÈRE EST CELUI QU'ON S'EST DÉJÀ DONNÉ POUR LE TITRE, retourné :
     ce qui est au-dessus de `R` doit être exactement ce qui sera au-dessus
     dans le builder — et **ce qui est en dessous aussi**. Sous la carte, dans
     le builder, il n'y aura RIEN. Le banc n'y met donc rien.
     ⛔ LE PANNEAU VIT HORS DE `.app` : il se superpose quand on l'ouvre, et la
     scène reste vierge tant qu'on n'appuie pas. C'est le traitement de la
     règle, qu'Eric garde — donc un geste qu'il connaît déjà. */
  .banc-outils {
    position: fixed; left: var(--sp-4); bottom: var(--sp-4);
    z-index: 10000; display: flex; gap: var(--sp-4);
  }
  /* 📏 ILS TIENNENT DANS LE COIN MORT, ET C'EST MESURÉ : la colonne de tuiles
     fait `--rail-w` (90 px) et sa coulisse s'arrête à 440 ; sous une fenêtre
     d'iPhone il reste ~26 px de fond nu en bas à gauche. Deux boutons de 20 px
     de haut et ~40 de large y tiennent côte à côte sans rien recouvrir.
     ⛔ ET SURTOUT PAS EN BAS À DROITE : c'est là que vit `GET BACK`, et le
     bouton de la règle le masquait sur les captures d'Eric. Un outil de banc
     ne se pose jamais sur une commande de l'écran. */
  .banc-outils button {
    padding: 3px 5px;
    font: 600 10px/1.2 var(--font); letter-spacing: .04em;
    border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    background: var(--surface); color: var(--text);
    cursor: pointer; opacity: .8;
  }
  .banc-outils button:hover { opacity: 1; }

  /* LE PANNEAU — par-dessus tout, fermé au clic sur le voile. */
  .banc-panneau {
    position: fixed; inset: 0; z-index: 10002;
    background: var(--scrim);
    overflow-y: auto;
    padding: var(--sp-8);
  }
  .banc-panneau[hidden] { display: none; }
  .banc-panneau-corps { max-width: 900px; margin-inline: auto; }
  /* Les deux réglages de sensibilité — dans la bande escamotable, jamais dans
     la scène : Eric vient de la faire nettoyer. */
  .reglage { display: flex; align-items: center; gap: var(--sp-8); margin-bottom: var(--sp-8); }
  .reglage label { flex: 0 0 9ch; font-size: var(--t2); color: var(--text); }
  .reglage input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .reglage output {
    flex: 0 0 12ch; font-size: var(--t2); color: var(--text);
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .reglage-dit { margin: 0 0 var(--sp-8); font-size: var(--t1); color: var(--text-muted); }

  .banc-fermer {
    display: block; margin: 0 0 var(--sp-8) auto;
    min-height: var(--touch); padding: 0 var(--sp-12);
    border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
  }

  /* ══ LA SCÈNE — DEUX COLONNES, ET ELLES NE S'EMPILENT JAMAIS ════════
     🔴 L'EMPILEMENT ÉTAIT LA CAUSE DES 346 PX DE TROP. Eric a posé les deux
     écrans côte à côte sur son iPhone : **Species garde ses deux colonnes à
     375 px**, et tout y tient. Empilées, `R` et les tuiles s'ADDITIONNENT ;
     côte à côte, la plus haute des deux décide. Le remède n'était donc pas de
     rétrécir, c'était de ne pas empiler.

     ⭐ LA GÉOMÉTRIE EST CELLE DE SPECIES, RELEVÉE DANS LE VRAI BUILDER À
     375 × 812 (2026-08-22, `index.html` sur le même serveur) :
       belt 60 · stage-topbar 0 · rail 90 · scène 285 · rien ne défile
     `.stage-aside` fait `width: var(--rail-w)` et `.stage` part de
     `left: var(--rail-w)` (`shell.css`) — soit exactement les deux colonnes
     ci-dessous. ⛔ AUCUNE LARGEUR INVENTÉE : `--rail-w` vaut 90 à l'étroit et
     120 en Large, et le banc suit les deux sans le savoir.
     ⭐ `--panel-w` PLAFONNE LA CARTE — c'est le jeton des « écrans à CONTRÔLES
     (Abilities, Equipment) », donc celui de `R` par définition. Sans lui, la
     carte s'étalerait sur 880 px en Large pendant que le rail en garde 120. */
  /* ══ LA COLONNE DE TUILES RESPIRE — ET LES DEUX BORNES SONT MESURÉES ══
     Eric, iPad paysage : *« cadrage étrange sur grand écran »*. Deux défauts,
     et le second était le vrai : la colonne restait à 90 px devant 300 px de
     vide, en tronquant « Baguette de détection de la magie ».

     🔴 90 PX N'EST PAS UNE CONSTANTE, C'EST UN PLANCHER. C'est la cote du rail
     de Species — vraie parce que le TÉLÉPHONE est étroit, pas parce que 90
     serait la bonne largeur. L'appliquer à toutes les tailles, c'est le piège
     du matin recommencé : une mesure relevée sur un écran, servie partout.

     📏 LE PLAFOND SE DÉDUIT DU CONTENU, ET IL A ÉTÉ MESURÉ SUR LES 23
     ÉTAGÈRES (2026-08-22, balayage de 90 à 320 px par pas de 5, critère
     `scrollHeight > clientHeight` sur CHAQUE tuile) :

       Baguettes & bâtons & sceptres     135 px   ← la plus bavarde, 32 objets
       Parchemins & focus & composantes  130
       Consommables & potions            110
       Conteneurs & véhicules            105
       Focus & curiosités                105
       Cordes & escalade                 100
       Casques & lunettes                 95
       les 16 autres                      90     (rien à tronquer dès le plancher)

     ⭐ 140 PX, ET PAS 135 : au chiffre exact il ne reste aucune marge — un nom
     d'un caractère de plus retomberait dans la troncature. Cinq pixels
     achètent cette marge, et au-delà de 140 élargir ne gagne plus RIEN : la
     place doit revenir à la carte ou rester en marge.

     ⛔ ET LE CURSEUR MANUEL DE PARTAGE A ÉTÉ RETIRÉ. Il servait à chercher ce
     seuil à la main ; le seuil est trouvé, et il se calcule tout seul entre
     les deux bornes. Un réglage qui se déduit vaut mieux qu'un curseur — et un
     curseur qui survit à sa question devient une case à se tromper. */
  .scene {
    display: flex;
    min-height: 0;
    /* ⭐ LE GROUPE ENTIER SE CENTRE, pas la carte dans son coin. Centrer la
       seule carte aurait laissé les tuiles orphelines contre le bord gauche —
       c'est bien le BLOC (tuiles + carte) qui est l'objet de la page. */
    justify-content: center;
    align-items: stretch;
    height: 100%;
  }
  /* 🔴 `flex: 1 1 auto` NE DONNAIT PAS 90 AU TÉLÉPHONE, ET C'EST MESURÉ :
     à 375 la colonne prenait **108 px**. Deux items élastiques qui débordent
     rétrécissent PROPORTIONNELLEMENT à leur base — la colonne s'arrêtait donc
     où l'arithmétique la laissait, pas sur son plancher. `min-width: 90px` ne
     l'attrapait jamais : on ne descendait pas jusque-là.
     ⭐ LA LARGEUR SE CALCULE, ELLE NE SE NÉGOCIE PLUS. `clamp()` prend le
     RESTE une fois la carte servie, borné par les deux cotes mesurées. À 375
     le reste est négatif → le plancher gagne, 90 px exactement. À 1024 il vaut
     399 → le plafond gagne, 140. Entre les deux, la colonne respire. */
  /* `height: 100%` ET `min-height: 0` — les deux : le premier donne à
     `.r-tuiles` un pourcentage à résoudre, le second empêche la colonne de
     grandir à la taille de son contenu (défaut par défaut d'un item flex). */
  .r-list-col { flex: 0 0 auto; width: var(--tuile-col); height: 100%; min-height: 0; }
  /* ⚠️ ESSAI DU 22/08 — ERIC : « fais 76 pour voir ». On passe de `--panel-w`
     (88ch en grandeur Large, une cote taillée pour la RANGÉE D'ABILITIES : six
     options annotées sur une ligne) à `--card-w` (76ch), la cote de la carte
     générique — celle qu'Eric a sous les yeux partout ailleurs, et dont les
     121 px d'écart se voyaient.
     📌 Les deux valent `--measure` (62ch) en dessous de 1140 : rien ne bouge
     sur téléphone, l'essai ne porte QUE sur la grandeur Large.
     ⛔ Ancien commentaire, gardé parce qu'il reste vrai par NATURE :
     *« --panel-w : écrans à CONTRÔLES (Abilities, Equipment) »*. `R` est
     exactement ça. `--grid-w` (60ch) était la largeur de la LISTE + chercheur
     de l'ancienne étape, une grille que `R` ne contient plus : sa colonne de
     droite est une carte de contrôles, pas une grille de résultats.
     ⛔ Et surtout pas `--measure` en direct : une mesure de PROSE se compte en
     caractères par ligne ; `--panel-w` s'y adosse, mais nommer le rôle plutôt
     que la valeur est ce qui permet à la Grandeur Large de la rehausser
     (88ch) sans toucher un écran. */
  .colonne-r {
    flex: 1 1 auto;
    max-width: var(--card-w);
  }
  /* 🔴 `min-width: 0` PARTOUT SUR LA CHAÎNE, ET C'EST MESURÉ, PAS PRUDENT.
     Un enfant de grille (comme de flex) part en `min-width: auto`, c'est-à-dire
     sa largeur de contenu SANS RETOUR À LA LIGNE. À 375 px, la colonne d'objets
     réclamait 937 px — les noms d'objets sur une seule ligne — et emportait la
     page entière en défilement horizontal. `minmax(0, 1fr)` borne la PISTE,
     jamais l'objet posé dedans : les deux se règlent, pas l'un ou l'autre. */
  .colonne-r, .bloc, .equipment-item-text { min-width: 0; }
  .colonne-r { align-self: start; }
  .r-find-ligne .equipment-search-input { min-width: 0; }

  /* Chaque bloc nommé du croquis est une DALLE (`.dalle-intermediaire` du
     dépôt) plus son étiquette de nom, pour qu'Eric reconnaisse les pièces
     de `R.html` en les regardant. */
  /* ══ LA CARTE R — UNE SEULE DALLE, ET LA DENSITÉ EST CELLE DE SPECIES ═
     Eric : *« tes blocs sont énormes — c'est du remplissage, pas du
     contenu »*. Mesuré sur sa capture : `R.cat` seul prenait ~270 px pour
     deux rangées de 44.

     📏 RELEVÉ DANS LE VRAI SPECIES, À 375 (pas deviné) :
       · la carte entière est UNE dalle — `.fiche-dalle`, `padding: 8px`,
         `gap: 8px`. Pas quatre dalles à marges, UNE, et ses sections sont
         séparées par un écart de 8. C'est tout le secret de la densité.
       · le rail : items de 74 × **30 px**, `--t2`, `padding: 8px 0`, écart 8.
     ⭐ LE BANC S'ALIGNE SUR CES DEUX LIGNES-LÀ. `R` cesse d'être quatre
     dalles empilées avec chacune son air : c'est UNE carte de 8 px de
     rembourrage dont les quatre sections sont séparées par 8 px. L'air
     intérieur passe de 16+8 par bloc à 8 pour l'ensemble.
     ⛔ LA MATRICE TIENT TOUJOURS : la carte reste OPAQUE (`.dalle-majeure`),
     parce qu'elle porte de la mention et des bordures de contrôle. */
  .colonne-r {
    display: flex; flex-direction: column;
    gap: var(--sp-8);
    padding: var(--sp-8);
  }
  .bloc { position: relative; padding: 0; margin: 0; }

  /* ⚠️ LES PASTILLES DE NOM SORTENT DU FLUX, POUR DE BON. Elles étaient en
     absolu dans un rembourrage de 16 px que le bloc réservait pour elles —
     donc elles coûtaient bien 16 px de hauteur chacune, quatre fois. Elles
     sont maintenant POSÉES SUR LE COIN, sans rien réserver, et elles ne
     prennent pas le pointeur : un repère de banc ne doit ni pousser le
     contenu ni intercepter un geste. */
  .bloc-id {
    position: absolute; top: 0; right: 0; z-index: 2;
    pointer-events: none;
    font: 600 9px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .04em;
    color: var(--on-accent); background: var(--accent);
    padding: 1px 4px; border-radius: 0 var(--radius-md) 0 var(--radius-md);
    opacity: .7;
  }
  .bloc-titre {
    margin: 0 0 var(--sp-4);
    font-size: var(--t1); letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ══ R.cat — LES DEUX CARROUSELS, ET TOUT LE SUJET DU BANC ═══════════

     🔴 LES DEUX BARRES NE DOIVENT PAS SE RESSEMBLER (Eric) : le haut choisit
     un MONDE (7, fixes), le bas choisit DEDANS (variable). Deux rangées
     identiques empilées, et l'œil ne sait plus laquelle commande la liste.

     ⭐ LA DIFFÉRENCE EST UN POIDS, PAS UNE COULEUR — et les deux poids
     existent DÉJÀ dans ce dépôt, chacun avec son précédent :
       · le haut garde `.belt-item` NU, tel que la ceinture d'étapes le
         rend : une DALLE (verre + liseré), corps `--t4`, 44 px de haut.
         Sept objets qu'on peut compter d'un coup d'œil.
       · le bas porte `.belt--fin`, qui reprend le traitement de
         `.skills-cat` (la barre de catégories des Compétences) : pas de
         surface, pas de liseré, corps `--t2`. Des MOTS, pas des objets.
     Le cran courant se marque de la même façon des deux côtés
     (`data-status="current"`, la règle de `shell.css`) — ce qui change entre
     les deux rangées est la densité, jamais le code couleur.

     🔴 ET IL A FALLU REPRENDRE LES 8 PX D'AIR AUX BOUTS. `shell.css` (§ des
     deux onglets, 2026-08-19) réécrit `.belt-track` en
     `padding-inline: calc(var(--onglet-taille)/2 + var(--sp-8))` = 37 px,
     pour que les onglets `Menu`/`Sheet` à moitié hors champ ne mangent pas
     le premier et le dernier cran. Cette règle est SANS SÉLECTEUR DE
     CONTEXTE : elle s'applique à toute réutilisation de `.belt-track`. Dans
     une colonne de ~370 px, elle coûtait 74 px des deux côtés — un cinquième
     de la piste. Ici il n'y a pas d'onglets, donc on rend les 8 px qu'Eric a
     fait poser sur simulateur (« dégage le truc moche à droite et à gauche
     du belt »), et on ne touche pas à `shell.css`. */
  .r-cat .belt-track { padding-inline: var(--sp-8); }

  /* ══ LE CRAN DOIT ÊTRE PETIT, ET LE CRITÈRE N'EST PAS UNE LARGEUR ════
     Eric, 2026-08-22, en voyant la première pose : *« il ne reconnaît pas son
     modèle »*. Mesuré alors : le cran du haut faisait **145 × 44** dans une
     colonne de 459 px — trois et demi. Le croquis, lui, montre QUATRE onglets
     courts et un « … » : on voit d'un coup qu'il y a une rangée, et qu'elle
     continue.

     ⭐ LE CRITÈRE EST DONC CE QUE L'ŒIL COMPREND : **au moins 4 crans entiers
     et le 5ᵉ amorcé**. En dessous, ce n'est plus un carrousel, ce sont trois
     boutons mal coupés. Le relevé au bas de page compte les crans entiers à
     chaque redessin — c'est la seule façon de ne pas se raconter d'histoire.

     TROIS LEVIERS, ET AUCUN NE TOUCHE `shell.css` :
       1. le compte pèse MOINS que le nom (`--t1` contre `--t3`, opacité .55,
          collé au nom par `--sp-4`) — c'est une indication, pas un titre ;
       2. le rembourrage horizontal du cran tombe de 12 à 8, DANS `.r-cat`
          seulement ;
       3. l'écart de piste tombe de 8 à 4 — le « a » d'Eric valait pour des
          dalles de 145 px, pas pour des crans de 90.
     ⛔ LE PLANCHER DE 44 PX NE BOUGE PAS : c'est un plancher tactile. Ce qui
     rétrécit est la LARGEUR, jamais la hauteur. */
  .r-cat .belt-track { gap: var(--sp-4); }
  .r-cat .belt-item { padding: 0 var(--sp-8); gap: var(--sp-4); font-size: var(--t3); }

  /* Le compte, sur CHAQUE dalle — règle d'Eric : « le joueur doit savoir ce
     qui l'attend avant de cliquer ». Il vit en `--text` (seule encre qui
     survit au verre, matrice du lot 59) et se distingue par le CORPS et
     l'opacité, jamais par la pâleur : c'est la parade que le dépôt s'est
     déjà donnée pour `.tray-case-num`. */
  .cran-compte {
    font-size: var(--t1); font-variant-numeric: tabular-nums;
    color: var(--text); opacity: .55;
  }
  .belt-item[data-vide="true"] { opacity: .5; }

  /* LA RANGÉE FINE — le traitement `.skills-cat`, appliqué au vrai
     `.belt-item`. ⛔ `min-height: var(--touch)` reste : la densité se joue au
     corps et à la surface, jamais sur le plancher tactile de 44 px.
     📌 LA DIFFÉRENCE DE POIDS TIENT TOUJOURS APRÈS LE RÉTRÉCISSEMENT, et elle
     ne tient plus au corps (14 contre 12, deux pixels, personne ne les voit) :
     elle tient à la SURFACE. En haut, sept dalles de verre alignées ; en bas,
     des mots nus dont un seul s'allume. C'est ce contraste-là que l'œil lit,
     et il survit à n'importe quelle réduction de largeur. */
  .belt--fin .belt-track { gap: var(--sp-2); padding-block: var(--sp-4); }
  .belt--fin .belt-item {
    background: none; box-shadow: none;
    font-size: var(--t2); gap: var(--sp-4);
    padding: 0 var(--sp-8);
  }
  /* Le courant est le SEUL de la rangée fine à porter une surface — ce qui
     le rend lisible sans ajouter de couleur, et redit la hiérarchie : en
     haut sept dalles, en bas un mot qui s'allume. */
  .belt--fin .belt-item[data-status="current"] {
    background: var(--dalle-inter);
    box-shadow: inset 0 0 0 1px var(--verre-lisere), inset 0 0 0 1px var(--accent-wash);
  }

  /* ══ R.find — la recherche, et la bourse SOUS elle ═══════════════════ */
  .r-find-ligne { display: flex; gap: var(--sp-8); align-items: center; }
  .r-find-ligne .equipment-search-input { margin-bottom: 0; }
  /* Les ⋮ de `R.menu` : encore sans destination (`R.html` : « nom provisoire
     — je ne sais pas encore ce qu'ils ouvrent »). Le banc les POSE, il ne
     leur invente pas de contenu. */
  .r-menu { flex: none; }
  .equipment-purse-bar { padding-inline: 0; flex-wrap: wrap; }
  .purse-piece { display: inline-flex; align-items: baseline; gap: 3px; }
  .purse-piece + .purse-piece::before { content: "·"; opacity: .5; margin-right: var(--sp-8); }
  .purse-mot { font-size: var(--t1); letter-spacing: .08em; opacity: .7; }
  .purse-nombre { font-size: var(--t4); font-variant-numeric: tabular-nums; }

  /* ══ LA ZONE ARGENT — LE TROISIÈME GESTE, PAS UN CONFORT ═════════════
     Eric, 2026-08-22 : *« le MJ donne 50 po en cours de partie »* et *« un
     joueur qui se trompe doit pouvoir se corriger sans acheter puis jeter un
     objet »*.

     ⭐ C'EST LA MOITIÉ D'UNE DÉCISION PLUS LARGE : *« on va pas rajouter un
     bouton sell »*. Trois gestes couvrent tout le système — ACHETER (BUY
     déduit), PRENDRE GRATUITEMENT (la case FREE du croquis B1), AJUSTER À LA
     MAIN. Retirer un objet du sac ne rend PAS l'argent ; qui s'est trompé le
     reprend en gratuit, ou corrige la bourse ici. Sans cette ligne, une
     erreur est irrattrapable — ce n'est donc pas une commodité, c'est le
     troisième pied du tabouret.

     ⛔ SOBRE : une correction, pas une caisse enregistreuse. Un montant,
     quatre pièces, deux signes. Rien d'autre, et sur une seule ligne tant
     qu'elle tient. */
  .r-argent {
    display: flex; align-items: center; gap: var(--sp-4); flex-wrap: nowrap;
    padding-top: var(--sp-4);
  }
  /* 📏 TOUT SUR UNE LIGNE, ET LE BUDGET EST COMPTÉ : la carte fait 285 px à
     375, dont 269 utiles. Champ 5ch (~48) + quatre pastilles à `--t1` (~26
     chacune) + deux signes de 44 + six écarts de 4 ≈ 264. Ça tient, et c'est
     pour ça que les pastilles sont à `--t1` et le champ à 5ch : la première
     pose débordait et renvoyait le `−` à la ligne suivante.
     ⛔ LES DEUX SIGNES GARDENT 44 PX : ce sont les seules commandes qu'on
     actionne à répétition ici, et le plancher tactile ne se négocie pas. Les
     pastilles, elles, sont un choix « une parmi quatre » — elles ont le droit
     à la densité du rail. */
  .r-argent-montant { width: 5ch; text-align: right; padding: var(--sp-4); }
  /* Les quatre pièces empruntent `.skills-cat` : la pastille « une parmi N »
     du dépôt, compacte, dont l'active se remplit d'un lavis d'accent. */
  .r-argent .skills-cat { padding: 0 var(--sp-4); min-height: var(--touch); font-size: var(--t1); }
  #argent-pieces { display: flex; gap: var(--sp-2); }
  .r-argent-signe { flex: none; min-width: var(--touch); min-height: var(--touch); align-self: auto; }
  /* ⛔ PLUS DE NOTE EN PROSE SOUS L'AJUSTEUR — trois lignes de texte dans un
     écran où chaque pixel de hauteur est compté. Ce qu'elle disait vit dans le
     relevé : un banc s'explique en bas de page, pas dans la maquette. */

  /* ══ LA VIGNETTE DU SAC — UNE PLACE TENUE, PAS UN DESSIN ═════════════
     Eric : *« il manque une image de sac à dos pour ouvrir B3 »*. L'image
     n'existe pas encore, et le banc n'en fabrique pas une qu'il faudrait
     remplacer.

     ⭐ CE QUI COMPTE EST QUE LA VRAIE IMAGE ENTRE SANS RIEN DÉPLACER : la
     boîte a donc une taille FIXE et un rapport carré, et la marque qu'elle
     porte est le « cadre barré » universel du visuel manquant — surtout pas
     une esquisse de sac, qu'on prendrait pour le dessin définitif.
     ⚠️ ET ELLE NE DÉCIDE PAS OÙ ELLE MÈNE. Le croquis fait partir `R.bag`
     vers `SB3.1` (le sac) ; Eric parle de `B3` (la silhouette), qui porte en
     bas une rangée BACKPACK / SB3.0 « easy access ». Les deux se touchent :
     la vignette n'est donc PAS un bouton tant que la question n'est pas
     tranchée. Une place réservée qui agit déjà a tranché sans le dire. */
  .r-bag-tete { display: flex; align-items: center; gap: var(--sp-8); margin-bottom: var(--sp-8); }
  .r-bag-vignette {
    flex: none; width: 48px; height: 48px;
    display: grid; place-items: center;
    border: 1px dashed var(--border-strong); border-radius: var(--radius-md);
    color: var(--text-muted);
  }
  .r-bag-vignette svg { width: 60%; height: 60%; }
  .r-bag-dit { min-width: 0; }
  .r-bag-dit span { font-size: var(--t1); color: var(--text-muted); }

  /* ══ R.bag / R.craft — les récepteurs, ET ILS REÇOIVENT VRAIMENT ═════
     `.glisse-creneau` est le récepteur du dépôt : bord pointillé au repos,
     `data-vise` quand le geste le désigne, `data-rempli` quand il tient
     quelque chose. Les trois états viennent de `shell.css` — le banc n'en
     peint aucun, il pose les attributs et laisse la feuille répondre.
     ⭐ ET C'EST `glisser.mjs` QUI LES POSE, pas le banc : `data-vise` est
     écrit par l'organe lui-même (`viser()`), qui cherche `[data-creneau]`
     sous le point visé. Le banc ne fournit que l'attribut. */
  .r-recepteur { align-items: stretch; }
  /* 🔴 `min-width: 0` SUR LE CRÉNEAU, ET SANS LUI LE NOM SORT DE LA CARTE.
     Vu sur la capture d'Eric : « Baguettes & bâtons & sceptres — exemple… »
     coupé net au bord droit de l'écran. `.glisse-creneau` est `flex: 1 1 0`,
     donc son `min-width: auto` lui laissait réclamer la largeur du texte
     ENTIER ; l'ellipse de `.r-depose` ne pouvait pas s'appliquer, puisque le
     conteneur grandissait au lieu de la contraindre. Le même piège que la
     colonne de tuiles à 937 px, un cran plus bas dans l'arbre.
     ⛔ Un récepteur est un ACCUSÉ DE DÉPÔT, pas un titre : il dit « j'ai
     quelque chose », le nom entier se lit ailleurs. */
  /* ══ UN RÉCEPTEUR A LA FORME DE CE QU'IL REÇOIT ══════════════════════
     Eric : *« les zones de drop ont pas besoin d'être aussi larges = taille de
     l'item »*. C'étaient deux bandeaux pleine largeur ; ils mangeaient
     l'essentiel de `R.bag` (131 px) et de `R.craft` (75).

     ⭐ ET LE CREUX QUI A LA FORME DE L'OBJET SE PASSE DE LÉGENDE : on voit que
     ce qu'on tient va LÀ, sans avoir à lire « R.BAG.SLOT ». C'est pour ça que
     l'étiquette interne est partie : le badge du bloc nomme déjà la zone, et
     dans une case de 74 px elle prenait la place de ce qu'on y dépose.
     ⛔ `flex: 0 0 auto` ANNULE le `flex: 1 1 0` de `shell.css` : sans ça la
     case reprend toute la rangée, et c'est exactement le bandeau qu'on retire.
     ⚠️ 44 PX DE PLANCHER DANS LES DEUX SENS : une cible de dépôt ratée coûte
     plus cher qu'un bouton raté — on ne descend pas sous `--touch`. */
  .r-recepteur .glisse-creneau {
    flex: 0 0 auto;
    width: calc(var(--tuile-col) - var(--sp-16));
    min-width: var(--touch);
    min-height: var(--touch);
    padding: var(--sp-4) var(--sp-8);
  }
  /* L'objet POSÉ dans un récepteur est lui-même reprenable — c'est le geste
     d'annulation d'Eric (« on annule en ressortant l'objet »). Il est donc un
     bouton, armé par le même organe que la ligne d'où il vient. */
  .r-depose {
    /* ⛔ ICI `none`, ET SANS ÉTAT D'ÂME : un récepteur ne défile pas. C'est la
       déclaration que `glisser.mjs` demande, et rien ne la dispute. */
    touch-action: none;
    border: none; background: none; padding: 0; color: inherit;
    font-family: inherit; cursor: pointer; text-align: center;
    max-width: 100%; min-width: 0;
  }
  .glisse-creneau-valeur { font-size: var(--t1); opacity: .7; }
  .r-getback {
    flex: none; align-self: stretch;
    min-width: var(--touch); padding: 0 var(--sp-12);
    border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    background: var(--surface); color: var(--text);
    font: 600 var(--t1)/1.2 var(--font); letter-spacing: .06em;
    cursor: pointer;
  }

  /* ══ R.list — DES TUILES QUI COULISSENT, PAS UNE BOÎTE ══════════════
     Eric, 2026-08-22 : *« la carte ne défile pas, les tuiles oui »* ·
     *« les tuiles bougent à côté de la carte »*.

     🔴 IL N'Y A PLUS DE CADRE AUTOUR DE LA LISTE, et c'est la correction
     principale. Le banc enfermait les tuiles dans une dalle bordée : ça
     faisait DEUX objets côte à côte, alors qu'il y a UNE carte (la colonne
     R, fixe) et DES TUILES qui passent devant, libres.
     ⭐ C'est mot pour mot la loi qu'Eric a fait appliquer à la ceinture le
     2026-08-15, et que `shell.css` porte encore : *« les colonnes contenant
     les carrousels, fais-les disparaître »* · *« il ne doit rester que les
     dalles, posées sur le fond. Le conteneur n'est pas un objet. »* Ici c'est
     le même geste, tourné à la verticale.
     📌 L'étiquette `R.list` reste — c'est un banc, il doit se lire — mais
     elle FLOTTE : elle ne redessine pas la boîte qu'on vient d'enlever.

     ══ LA COTE F1, ET CE QU'ELLE A RÉVÉLÉ ═════════════════════════════════
     Eric : la zone où les tuiles coulissent fait AU PLUS la hauteur d'un F1.

     🔴 `--fiche-h` N'EST PAS ATTEIGNABLE DEPUIS N'IMPORTE OÙ, et le savoir a
     coûté une recherche : elle n'est pas dans `tokens.css` ni sur `:root`.
     Elle est déclarée sur `.catalogue-cards[data-kind="class"|"species"|
     "feat"]` (`fiche.css`), et `fiche.css` le dit exprès — *« elle vit sur le
     CONTENEUR, parce que l'écart entre fiches s'en sert aussi ; une variable
     descend, elle ne remonte pas »*. Charger la feuille ne suffit donc PAS :
     il faut être DEDANS.
     ⭐ C'EST EXACTEMENT COMME ÇA QUE LE GUIDE DES ESPÈCES L'OBTIENT — il écrit
     `height: var(--fiche-h)` sans rien recopier, parce qu'il est un enfant du
     catalogue (`shell.css`, `.guide-general`). Le banc emprunte le même
     chemin : un hôte qui porte le sélecteur déclarant, et la cote descend.
     ⛔ RECOPIER `440px` ÉTAIT L'AUTRE OPTION, ET ELLE EST INTERDITE : deux
     copies d'une cote se démentent au premier changement — c'est la faute que
     `shell.css` nomme à cet endroit précis.
     📌 À REMONTER : la cote vient de servir hors du catalogue. Si elle doit
     servir une troisième fois, sa place est `tokens.css`, pas un conteneur
     d'écran. */
  .r-tuiles {
    --r-tuile: var(--touch);
    /* La zone de coulisse : au plus un F1, et jamais plus haut que la fenêtre.
       ⛔ AUCUNE AIMANTATION VERTICALE, ET C'EST UNE DÉCISION, PAS UN OUBLI —
       voir la note « Species et R.list se ressemblent » dans le script. */
    /* ⛔ PLUS DE `vh` ICI. La coulisse vaut au plus un F1, et au plus la
       hauteur RÉELLEMENT offerte par la scène — `100%` d'une colonne étirée,
       donc une valeur que le navigateur connaît vraiment, barres de Safari
       comprises. `78vh` promettait 633 px là où l'iPhone en donnait ~430. */
    height: min(var(--fiche-h), 100%);
    overflow-y: auto;
    overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: var(--sp-8);   /* l'écart du rail de Species, relevé */
    /* ⭐ L'AIR AUX DEUX BOUTS, TOURNÉ À LA VERTICALE — la parade d'Eric du
       2026-08-15, transposée. Sans cadre, plus rien ne dit qu'une tuile
       coupée continue hors champ : elle a l'air sectionnée par rien. Les 8 px
       d'air font qu'elle se lit comme une AMORCE, exactement comme au bout de
       la ceinture (« une dalle qui continue hors champ se lit alors comme
       telle, au lieu d'avoir l'air sectionnée par la fenêtre »).
       ⛔ PAS DE MASQUE EN FONDU : Eric l'a fait retirer de la ceinture le
       2026-08-15 (« flouté bizarre à droite et à gauche du belt »). Une
       SURFACE qui s'efface ne se lit pas comme une amorce, elle se lit comme
       un défaut de rendu — et ces tuiles sont des surfaces.
       ⭐ `scroll-padding-block` va avec, pour la même raison que sur la
       piste : sans lui l'aimantation collerait la tuile au bord et mangerait
       l'air qu'on vient de poser. */
    padding: var(--sp-8);
    scroll-padding-block: var(--sp-8);
  }
  .r-tuiles::-webkit-scrollbar { width: 6px; }
  .r-tuiles::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-pill); }

  /* ══ LA TUILE — UNE DALLE, POSÉE SUR LE FOND ═════════════════════════
     Comme un cran de ceinture : `--dalle-simple` plus le liseré de verre.
     C'est ce que « il ne doit rester que les dalles » veut dire, et c'est
     aussi ce que le croquis dessine — une colonne de petits rectangles.

     🔴 ET SUR DU VERRE, SEULE `--text` SURVIT (matrice du lot 59 :
     `--text-muted` rend 3,0 pour 4,5 exigé). `.equipment-gear-meta` vit en
     `--text-muted` parce qu'elle est posée sur une dalle MAJEURE dans le vrai
     écran ; ici elle est sur du verre. Le poids passe donc par l'OPACITÉ,
     jamais par la pâleur de l'encre — la parade que `shell.css` s'est déjà
     donnée pour `.tray-case-num`. */
  /* 📏 LA TUILE PREND LA DENSITÉ DU RAIL DE SPECIES, RELEVÉE À 375 :
     `padding: 8px 0`, `--t2`, écart de 8 entre items, 30 px de haut pour un
     nom seul. La tuile en porte deux (nom + poids/prix), donc elle empile et
     monte à ~44 — mais son AIR est celui du rail, pas celui d'une carte.
     ⛔ La colonne fait `var(--rail-w)` : à 375 c'est 90 px, dont ~74 pour le
     texte. Un nom d'objet y sera TRONQUÉ, exactement comme « Dragonborn » l'est
     dans le rail — et c'est le même arbitrage qu'Eric a déjà tranché là-bas. */
  .r-ligne {
    width: 100%; min-height: 30px;
    flex: none; flex-wrap: wrap;
    border: none;
    border-radius: var(--radius-md);
    background: var(--dalle-simple);
    box-shadow: inset 0 0 0 1px var(--verre-lisere);
    color: inherit; font-family: inherit;
    text-align: left; cursor: pointer;
    padding: var(--sp-4) var(--sp-8); gap: 0;
    -webkit-user-select: none; user-select: none;
  }
  /* 🔴 `pan-y`, ET C'EST ERIC QUI A TRANCHÉ LE GESTE (2026-08-22) :
     *« défilement vertical des tuiles »* · *« mon geste pour déplacer la tuile
     sera horizontal »* · *« donc ça devait passer »*.

     ⭐ L'AXE SÉPARE LES DEUX GESTES, ET C'EST MIEUX QUE TOUT CE QU'ON AVAIT.
     Vertical = je parcours la liste. Horizontal = je prends l'objet. Pas de
     maintien, pas de seuil de temps, aucune ambiguïté : une direction.
     `pan-y` fait faire la séparation AU NAVIGATEUR, iOS compris — le mouvement
     vertical part au défilement et n'arrive jamais au code ; l'horizontal
     arrive. C'est exactement ce que le maintien de 350 ms achetait au prix
     fort (`glisser.mjs`, en-tête : ce péage *« n'a JAMAIS eu d'autre cause que
     l'ascenseur de la grille »*), et qu'Eric a fait retirer le 2026-08-20.
     ⛔ `pan-y` NE COUVRE QUE LE TACTILE : `touch-action` est une propriété du
     doigt. À la souris, la garde d'axe du script prend le relais. */
  .r-ligne { touch-action: pan-y; }
  /* Le jeton ne pâlit que si le geste est HORIZONTAL : l'organe écrit
     `data-glisse`, le banc écrit `data-axe`, et il faut les deux. Sans ça, un
     doigt qui descend ferait clignoter toute la colonne. */
  .r-ligne[data-glisse="true"][data-axe="x"] { opacity: .35; }
  /* ══ LE NOM SE DÉPLIE SUR DEUX LIGNES — Eric tranche, 2026-08-22 ══════
     *« le titre de l'item sur 2 lignes et écrit plus petit »*. Donc la colonne
     RESTE à `--rail-w` : pas d'élargissement au détriment de la carte, pas
     d'icône à la place du nom.

     🔴 CE QUE LA TRONCATURE SUR UNE LIGNE COÛTAIT : trente-deux tuiles
     affichant toutes « Baguett… », seul le prix les distinguant. Sur deux
     lignes à `--t1`, « Baguette de / détection… » et « Baguette de / terreur »
     ne se confondent plus — c'est la deuxième ligne qui porte l'information.

     ⭐ `-webkit-line-clamp: 2` FAIT LES TROIS CHOSES À LA FOIS, et c'est
     pourquoi il est préféré à une hauteur fixe :
       · la coupure tombe sur les MOTS (c'est du retour à la ligne normal) ;
       · les points de suspension tombent à la fin de la DEUXIÈME ligne, pas de
         la première — ce qui est exactement la demande ;
       · ⭐ ET LA TUILE S'ADAPTE : « Corde », « Torche », « Fiole » tiennent sur
         une ligne et n'en réservent pas deux. Réserver deux lignes pour tout
         le monde ferait perdre des tuiles visibles pour du vide — le contraire
         du but.
     ⛔ `overflow-wrap: break-word` en DERNIER RECOURS seulement : il ne coupe
     un mot que si le mot seul ne tient pas dans les 74 px. Sans lui, un nom
     d'un seul mot très long déborderait au lieu de se couper.
     📏 Le plancher de 44 px reste un MINIMUM tactile, pas un plafond : une
     tuile plus haute ne pose aucun problème de doigt. */
  .r-ligne .equipment-gear-name,
  .r-depose.equipment-gear-name {
    flex: 1 1 100%; min-width: 0;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    font-size: var(--t1); line-height: 1.3;
    overflow-wrap: break-word; word-break: normal;
    color: var(--text);
  }


  /* ⭐ CE QUI EST AU-DESSUS DE `R` DANS CE BANC DOIT ÊTRE EXACTEMENT CE QUI
     SERA AU-DESSUS DE `R` DANS LE BUILDER : la ceinture, et rien d'autre.
     Eric, 2026-08-22 : *« dégage le titre qu'on ait un vrai rendu »*. Le
     chapeau du banc est parti, l'interrupteur A/B est descendu avec le relevé,
     et l'étiquette `R.list` ne coûte plus une seule ligne de hauteur.
     La colonne gauche réserve la MÊME gouttière de 16 px que les blocs de `R`
     (leur `padding-top`, qui loge leur badge) : les deux colonnes démarrent
     donc à la même ordonnée, ce qui est la seule façon de comparer leurs
     hauteurs sans se mentir. */
  .r-list-col { position: relative; min-height: 0; }
  .r-list-badge { top: 0; left: 0; right: auto; border-radius: var(--radius-md) 0 var(--radius-md) 0; }

  .r-list-vide { margin: 0; padding: var(--sp-16) 0; font-size: var(--t3); color: var(--text-muted); }
  /* ⚠️ CETTE LÉGENDE ET CE TITRE FLOTTENT SUR L'IMAGE DE FOND, sans dalle
     sous eux — c'est le sens même de « retire le cadre ». Ils ne peuvent donc
     pas être en `--text-muted` (2,7:1 mesuré sur le fond servi) : l'encre
     reste `--text`, seule à survivre, et le poids passe par l'OPACITÉ. */
  .r-list-tete .bloc-titre { color: var(--text); opacity: .75; margin: 0; }
  .r-list-vide { color: var(--text); opacity: .7; }

  /* ── Le relevé : ce que le banc mesure, en clair ── */
  .mesures {
    font: var(--t2)/1.6 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text-muted);
    white-space: pre; overflow-x: auto;
    margin-top: var(--sp-16);
  }
</style>

<body>

     `.equipment-purse-bar, .equipment-catbar`), et la barre porte en plus un

<!-- LA SCÈNE — tout ce qui sera à l'écran dans le builder, et rien d'autre.

<div class="banc-scroll">
  <!-- ⛔ PLUS DE `.banc` ENTRE LA ZONE ET LA SCÈNE, ET CE N'ÉTAIT PAS QU'UN
       nœud de trop : il cassait la chaîne des hauteurs. `.scene` demande
       `height: 100%` ; un parent sans hauteur définie rend ce pourcentage

       tuiles — scène mesurée à 1 352 px pour 490 utiles. Et il portait un

  <div class="scene">

    <!-- ── R.list : LES TUILES, à GAUCHE, ET SANS CADRE ──────────────────
         Eric, 2026-08-22 : « la carte ne défile pas, les tuiles oui » ·

    <div class="colonne-r dalle-majeure">

      <!-- R.find — la recherche, et la bourse dessous -->

        <span class="bloc-id">R.find</span>
        <div class="r-find-ligne">
          <input type="search" class="equipment-search-input" id="find-bar"
                 placeholder="Search…" aria-label="Rechercher un objet">
          <button type="button" class="equipment-magnifier r-menu" id="r-menu"
                  aria-label="R.menu — à nommer">⋮</button>
        </div>
        <!-- R.purse — QUATRE monnaies. Le croquis n'en dessine que trois
             (OR SP CP) ; Eric a tranché le 2026-08-21 : le moteur exige les
             quatre ou il n'affiche aucune bourse. Décorative pour l'instant. -->
        <div class="equipment-purse-bar">
          <div class="equipment-purse-value" id="purse"></div>
        </div>
        <!-- R.purse.ajust — LE TROISIÈME GESTE (voir la feuille). Il n'y aura
             jamais de bouton « vendre » : acheter, prendre gratuitement,
             ajuster à la main. C'est ici que la troisième vit. -->
        <div class="r-argent">
          <input type="number" class="equipment-currency-input r-argent-montant" id="argent-montant"
                 value="50" min="0" step="1" aria-label="Montant à ajouter ou retirer">

      <!-- R.bag -->

        <!-- R.bag.image — PLACE RÉSERVÉE, taille fixe : la vraie image entrera
             sans rien déplacer. Le cadre barré dit « visuel manquant » ; ce

        <div class="r-bag-tete">

                 stroke="currentColor" stroke-width="1.2">

            </svg>

          <div class="r-bag-dit">
            <!-- ⛔ La description longue est descendue dans le relevé, comme la
                 note de l'ajusteur : c'était de la prose de banc dans l'écran. -->

<!-- ⛔ HORS DE `.app`, ET C'EST LE POINT : la scène est vierge de tout mobilier
     de banc, en haut comme en bas. Rien ne touche le bord bas, donc la marge
     sous la carte se juge sans rien pour la brouiller. -->
<div class="banc-outils" id="banc-outils">

<div class="banc-panneau" id="banc-panneau" hidden>

    <button type="button" class="record-option" data-mode="B" data-active="false">B — le bas se souvient</button>

    <div class="reglage">
      <label for="reg-seuil">distance</label>
      <!-- ⛔ Le minimum est 6, pas 0 : sous 6 px l'organe ne signale rien, il
           n'y a donc rien à intercepter. Une borne honnête vaut mieux qu'un
           curseur qui ne fait rien sur son premier tiers. -->
      <input type="range" id="reg-seuil" min="6" max="24" step="2" value="6">

  <div class="mesures banc-bloc dalle-majeure" id="mesures">…</div>

  </div>
