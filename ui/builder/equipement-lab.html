<script type="module">
/* ⛔ `swapContent` EST LE SEUL REMPLAÇANT, ICI COMME AILLEURS.
   `tests/socle.test.mjs` interdit `innerHTML`, `replaceChildren` ET
   `removeChild` dans tout `ui/builder/` hors de `socle.mjs` — la boucle
   `removeChild` n'est donc pas une porte de sortie. Et le geste est le bon :
   la colonne d'objets DÉFILE, et changer d'étagère ne doit pas jeter sa
   position au hasard. */
/* ⭐ ET `keepInView` VIENT AVEC — c'est l'organe qui amène le cran courant
   dans le champ de SA piste, et de la sienne seulement. Sans lui, choisir
   « Vêtements » dans Marvels laisse la rangée fine affichée sur « Anneaux » :
   mesuré ici, à 1000 px, avant de l'ajouter. `scrollIntoView` ferait la même
   chose en déplaçant AUSSI la page — c'est le défaut §0 du dépôt. */
import { swapContent, keepInView } from "./socle.mjs?v=278";

/* ══ LE GESTE VIENT DE `glisser.mjs`, LOT 79 — PAS D'UNE COPIE ═══════════
   Eric, 2026-08-22 : *« le tap me va pour le moment »*. Ce n'est pas une
   raison d'écrire un `click` à la main : l'organe porte LES DEUX gestes dans
   le même code (« deux gestes, une seule sélection »), départagés par 6 px de
   déplacement. Brancher le tap, c'est déjà brancher le glisser — et le jour
   où Eric le veut, il n'y a rien à recâbler.

   ⛔ ET SURTOUT PAS L'API HTML5 (`draggable`, `dragstart`) : elle ne marche
   pas sur Safari iOS, c'est-à-dire sur l'appareil où Eric teste. C'est la
   raison d'être de ce fichier, dite dans son en-tête. */
import { armerJeton } from "./glisser.mjs?v=278";

/* ══ LES SEPT RAYONS ET LEURS ÉTAGÈRES — la commande d'Eric, recopiée ═══
   ⭐ L'ORDRE ALPHABÉTIQUE N'EST PAS RECOPIÉ, IL EST CALCULÉ (`localeCompare`
   en français, ci-dessous). Une liste triée à la main se dé-trie au premier
   ajout, et le tri est une RÈGLE d'Eric (« ordre alphabétique aux deux
   niveaux, et le premier est celui qui s'ouvre ») — donc du code.
   📌 Ce que le tri a corrigé au passage, dans Marvels : la commande écrivait
   « Conteneurs & véhicules » AVANT « Consommables », alors que `Cons` précède
   `Cont`. Le banc ouvre donc Marvels sur Anneaux (inchangé) mais range les
   deux dans le bon sens. */
const RAYONS = [
  ["Adventuring", [
    ["Campement", 3], ["Cordes & escalade", 8], ["Forcer & piéger", 10],
    ["Lumière & feu", 6], ["Observer & signaler", 5], ["Packs", 7]
  ]],
  ["Arcana", [
    ["Baguettes & bâtons & sceptres", 32], ["Consommables & potions", 33],
    ["Parchemins & focus & composantes", 7]
  ]],
  ["Battlefield", [
    ["Armes de jet", 10], ["Armes de mêlée", 28], ["Armures", 13], ["Projectiles", 5]
  ]],
  ["Companions", [
    ["Familiers", 0], ["Hommes de main", 0], ["Recherche dans les monstres", 0], ["Sur mesure", 0]
  ]],
  ["Crafting", [
    ["Gemmes", 0], ["Ingrédients", 0], ["Outils", 25]
  ]],
  ["Marvels", [
    ["Anneaux", 22], ["Bijoux", 15], ["Casques & lunettes", 8],
    ["Conteneurs & véhicules", 24], ["Consommables", 15],
    ["Focus & curiosités", 33], ["Vêtements", 32]
  ]],
  ["Mundane", [
    ["Contenants", 16], ["Écrire & lire", 6], ["Vêtements", 5]
  ]]
];

const alpha = (a, b) => a[0].localeCompare(b[0], "fr");

/** Le catalogue, TRIÉ aux deux niveaux, et son compte de rayon DÉDUIT de ses
 *  étagères — jamais recopié à côté d'elles. Un compte écrit deux fois est un
 *  compte qui finit par se contredire ; celui-ci ne peut pas. */
const CATALOGUE = [...RAYONS].sort(alpha).map(([rayon, etageres]) => {
  const rangees = [...etageres].sort(alpha).map(([nom, compte]) => ({ nom, compte }));
  return { rayon, etageres: rangees, compte: rangees.reduce((t, e) => t + e.compte, 0) };
});

/* ══ L'ÉTAT ══════════════════════════════════════════════════════════════
   `mode` — A : le bas OUBLIE (retour à la première étagère alphabétique) ;
            B : le bas SE SOUVIENT (chaque rayon garde la sienne).
   ⭐ LES DEUX VARIANTES PARTAGENT LA MÊME MÉMOIRE : `souvenir` est tenu à
   jour dans les deux modes, seul le LECTEUR change. Sans ça, basculer de A
   vers B repartirait d'une mémoire vide et la comparaison mentirait — Eric
   veut trancher au doigt, pas éprouver un artefact du banc. */
let mode = "A";
let rayonCourant = CATALOGUE[0].rayon;                 // règle 2 : le premier
const souvenir = new Map();                            // rayon → nom d'étagère
for (const r of CATALOGUE) souvenir.set(r.rayon, r.etageres[0].nom);

const trouveRayon = (nom) => CATALOGUE.find((r) => r.rayon === nom);

/** L'étagère ouverte, et c'est ICI que les deux variantes divergent — en un
 *  seul endroit, ce qui est tout l'intérêt de les comparer dans la page. */
function etagereCourante() {
  const rayon = trouveRayon(rayonCourant);
  if (mode === "B") {
    const garde = souvenir.get(rayonCourant);
    if (rayon.etageres.some((e) => e.nom === garde)) return garde;
  }
  return rayon.etageres[0].nom;
}

/* En mode A, l'étagère AFFICHÉE est la première tant qu'on n'a rien touché,
   mais un clic dans la rangée fine doit tenir jusqu'au prochain changement de
   rayon. On garde donc un choix courant à part du souvenir. */
let etagereChoisie = etagereCourante();

/* ══ CE QUE LES DEUX RÉCEPTEURS TIENNENT ═════════════════════════════════
   Un nom d'objet, ou `null`. Les clefs sont EXACTEMENT les `data-creneau` du
   balisage : c'est la chaîne que `glisser.mjs` rend à `onDepot`, et la faire
   diverger d'un caractère serait un dépôt qui ne tombe nulle part. */
const recepteurs = { bag: null, craft: null };

/* ══ LA BOURSE — QUATRE MONNAIES, ET ON PEUT Y TOUCHER ═══════════════════
   Eric, 2026-08-22 : *« le MJ donne 50 po en cours de partie »* · *« un joueur
   qui se trompe doit pouvoir se corriger sans acheter puis jeter un objet »*.
   ⭐ ET LA MOITIÉ MANQUANTE DE LA DÉCISION : *« on va pas rajouter un bouton
   sell »*. Trois gestes couvrent tout — acheter, prendre gratuitement,
   ajuster à la main. Retirer un objet du sac ne rend PAS l'argent. */
const BOURSE = ["PP", "OR", "SP", "CP"];
const bourse = { PP: 0, OR: 15, SP: 8, CP: 42 };
let pieceChoisie = "OR";                       // la monnaie que le MJ donne
const RECEPTEURS = ["bag", "craft"];
const NOM_SLOT = { bag: "R.bag.slot", craft: "R.craft.slot" };

const belts = {
  rayons: document.getElementById("belt-rayons"),
  etageres: document.getElementById("belt-etageres")
};
const listeBoite = document.getElementById("list-boite");

/* ══ SPECIES ET R.LIST SE RESSEMBLENT, ET LEUR DÉFILEMENT DIT LE CONTRAIRE ══
   Eric, 2026-08-22 : *« donc différent du scrollspy de Species »* · *« mais en
   apparence ça ressemble à Species »*.

   🔴 CHEZ SPECIES, DÉFILER EST CHOISIR. `socle.mjs` l'écrit : *« le
   défilement se POSE sur une fiche : c'est elle qui est choisie, il n'existe
   aucun geste de sélection. Le scrollspy n'est donc pas un repère, c'est LE
   SÉLECTEUR. »*
   🔴 DANS `R.list`, DÉFILER EST SEULEMENT PARCOURIR. On choisit en tapant ou
   en glissant à l'horizontale. Le défilement ne sélectionne rien, ne valide
   rien, n'allume rien.

   ⛔ D'OÙ CE QUI N'EST PAS ICI, ET QUI Y SERAIT VENU TOUT SEUL : pas de
   `data-snap` (le seul contrat entre un écran et le scrollspy du socle, posé
   par `renderCatalogueCards` et nulle part ailleurs), pas de
   `renderCatalogueCards`, pas de `watchSnap`, et pas même de
   `scroll-snap-type: y`. Le piège n'aurait rougi nulle part : l'écran aurait
   eu l'air juste, et le joueur aurait acheté l'objet devant lequel il s'est
   arrêté. Un `overflow-y: auto` nu suffit, et c'est tout ce qu'il y a.
   ⭐ LA RÈGLE, ET ELLE DÉPASSE CE BANC : deux écrans peuvent se ressembler et
   faire dire à un même geste deux choses opposées. Ce qui se copie est
   l'apparence ; ce qui se décide est le sens.

   ⚠️ L'AIMANTATION HORIZONTALE, ELLE, RESTE — sur la ceinture, se poser sur un
   cran EST le choix du rayon. Le même mécanisme, deux sens : c'est la
   démonstration de la règle ci-dessus, dans la même page. */

/* ══ LA COTE F1 — LUE À LA SOURCE, JAMAIS RECOPIÉE ════════════════════════
   Eric : la zone de coulisse fait au plus la taille d'un F1 de Species.

   🔴 ET `--fiche-h` N'EST PAS ATTEIGNABLE EN CSS DEPUIS CE BANC. Elle n'est ni
   dans `tokens.css` ni sur `:root` : `fiche.css` la déclare sur
   `.catalogue-cards[data-kind="class"|"species"|"feat"]`, et le dit exprès —
   *« elle vit sur le CONTENEUR (…) ; une variable descend, elle ne remonte
   pas »*. Charger la feuille ne suffit donc pas : il faut être DEDANS.

   ⛔ ET ON NE SE MET PAS DEDANS. Envelopper les tuiles dans un
   `.catalogue-cards[data-kind="species"]` aurait donné la cote — avec la
   grille de Species, sa hauteur à 100 % et son nom. C'est-à-dire aller
   chercher la brique de Species pour un écran dont le défilement veut dire le
   contraire : exactement le piège de la note ci-dessus.

   ⭐ ALORS ON LA MESURE. Une SONDE porte le sélecteur déclarant le temps d'une
   lecture, hors de tout flux, et rend sa valeur. La cote n'est donc écrite
   nulle part dans ce fichier : le jour où Eric la change dans `fiche.css`, le
   banc suit. C'est la seule propriété qui comptait.
   ⚠️ LE PRIX EST UNE PROPRIÉTÉ POSÉE EN LIGNE, et il faut le nommer : le garde
   7 des jetons interdit `.style` dans tout `ui/` (« le décor va dans la
   feuille »). Ici on ne pose pas de DÉCOR — on republie un jeton lu dans une
   feuille, pour qu'un `var()` puisse le voir. L'exception est celle-là, et
   rien d'autre n'y passe.
   📌 À REMONTER : la cote vient de servir hors du catalogue. Si elle sert une
   troisième fois, sa place est `tokens.css` — et cette sonde disparaît. */
function republierCoteF1() {
  const sonde = document.createElement("div");
  sonde.className = "catalogue-cards";
  sonde.dataset.kind = "species";
  sonde.hidden = true;
  document.body.append(sonde);
  const cote = getComputedStyle(sonde).getPropertyValue("--fiche-h").trim();
  sonde.remove();
  if (cote) document.documentElement.style.setProperty("--fiche-h", cote);
  return cote || "(introuvable)";
}
const COTE_F1 = republierCoteF1();
/* ⛔ `list-titre` ET `list-cap` N'EXISTENT PLUS. C'étaient deux libellés de
   banc au-dessus et au-dessous des tuiles ; ils coûtaient de la hauteur que le
   builder n'aura pas. Ce qu'ils disaient (l'étagère ouverte, le nombre de
   lignes visibles) vit maintenant dans le relevé, en bas — au même endroit que
   tout ce qui se mesure. */

/** UN CRAN DE CARROUSEL — le même fabricant pour les deux rangées, et c'est
 *  délibéré : ce qui doit différer est le POIDS (une classe sur la barre),
 *  pas le balisage. Deux fabricants auraient laissé les deux rangées diverger
 *  par distraction, la faute que `.belt` existe pour éviter. */
function faireCran(nom, compte, courant, onClic) {
  const cran = document.createElement("button");
  cran.type = "button";
  cran.className = "belt-item";
  cran.setAttribute("role", "tab");
  cran.setAttribute("aria-selected", courant ? "true" : "false");
  if (courant) cran.dataset.status = "current";
  if (compte === 0) cran.dataset.vide = "true";

  const mot = document.createElement("span");
  mot.textContent = nom;

  /* RÈGLE 1 D'ERIC — CHAQUE DALLE PORTE SON COMPTE, jamais le nom seul :
     « le joueur doit savoir ce qui l'attend avant de cliquer ». */
  const chiffre = document.createElement("span");
  chiffre.className = "cran-compte";
  chiffre.textContent = String(compte);

  cran.append(mot, chiffre);
  cran.addEventListener("click", onClic);
  return cran;
}

/* ══ LA GARDE D'AXE — la règle d'Eric, éprouvée ICI avant d'y toucher ═════
   Eric, 2026-08-22 : vertical = je parcours, horizontal = je prends.

   🔴 `glisser.mjs` NE CONNAÎT PAS L'AXE. Sa décision est
   `Math.hypot(dx, dy) < SEUIL_GLISSER` — une distance dans N'IMPORTE QUELLE
   direction. Tel quel, un doigt qui descend pour faire défiler la liste
   soulèverait l'objet.
   ⛔ ET ON NE MODIFIE PAS L'ORGANE DEPUIS UN BANC. La garde vit donc ici, en
   enveloppe : elle laisse l'organe faire son travail et REFUSE l'action quand
   l'axe n'est pas le bon. Si Eric juge que l'axe suffit, c'est une
   amélioration à porter DANS `glisser.mjs` par un lot — elle profiterait aux
   cinq écrans qui l'emploient.

   ⚠️ POURQUOI UNE GARDE EN PLUS DE `pan-y` : `touch-action` est une propriété
   TACTILE. À la souris elle ne s'applique pas, et un glisser vertical à la
   souris reprendrait l'objet sans elle. Ceinture et bretelles, chacune pour
   un appareil.

   📌 ET UN DÉFAUT DE L'ORGANE QUE CETTE GARDE RÉVÈLE, à remonter tel quel :
   dans `fini()`, le test du tap (`if (!glisse) { onTap(...); return; }`) est
   AVANT le test d'annulation (`if (e.type === "pointercancel") return;`). Or
   `pan-y` fait justement arriver un `pointercancel` dès que le navigateur
   prend le défilement — souvent avant les 6 px. Sans la garde, CHAQUE
   défilement au doigt poserait un objet dans le sac. C'est le drapeau
   `annule` ci-dessous qui l'arrête, et c'est un pansement de banc : la
   correction est de tester l'annulation en premier, dans l'organe. */

/* Le même 6 px que `SEUIL_GLISSER`, et il est RECOPIÉ faute d'être exporté.
   ⚠️ Deux copies d'un seuil finissent par diverger : si l'axe est adopté,
   l'organe doit exporter le sien plutôt que laisser ses appelants le deviner. */
/* ══ LA SENSIBILITÉ DU GESTE — DEUX RÉGLAGES, ET ILS SE SENTENT AU DOIGT ═
   Eric, 2026-08-22 : *« possible de rajouter de la sensibilité au drag and
   drop ou pas »*. Oui, et deux plutôt qu'un — parce que ce qui rate un geste
   n'est pas toujours la même chose.

   ① LA DISTANCE (`seuil`, 6 px par défaut) — sous elle c'est un tap, au-delà
     un glisser. Le 6 vient de `glisser.mjs` et il est ARGUMENTÉ : *« un doigt
     n'est jamais parfaitement immobile — 6 px laisse passer un tap tremblé
     sans déclencher de fantôme »*. Il reste donc le défaut ; on ne le
     remplace pas, on l'explore autour.

   ② 🔴 L'ANGLE (`k`), ET C'EST LUI QUI COMPTE. La règle d'hier était
     `|dx| > |dy|` — donc **45° est une lame de rasoir** : à 44° on prend
     l'objet, à 46° on fait défiler. Or un pouce ne trace jamais droit, et
     surtout pas en tirant vers la droite depuis une colonne de gauche : le
     geste part en diagonale par nature. La règle devient `|dx| > k · |dy|` :

       k = 1,0   la règle d'hier — 45°, la lame de rasoir
       k = 1,5   il faut un horizontal net (~34°) ; défiler en biais reste défiler
       k = 2,0   il faut vraiment tirer de côté (~27°) ; défiler devient très sûr
       k = 3,0   presque à l'horizontale (~18°)

   ⭐ CE RÉGLAGE N'EST PAS SYMÉTRIQUE, ET C'EST TOUT SON INTÉRÊT : plus `k`
   monte, plus DÉFILER est sûr, et plus PRENDRE demande d'intention. Le bon
   compromis se sent sur un pouce, pas sur un trackpad — d'où le banc.

   ⚠️ CE QUE LE BANC PEUT ET NE PEUT PAS. `SEUIL_GLISSER` n'est pas exporté par
   l'organe : notre copie peut MONTER le seuil (un geste entre 6 et `seuil`
   redevient un tap, voir `armerSelonAxe`), jamais le DESCENDRE — sous 6,
   l'organe ne signale rien et il n'y a rien à intercepter. La borne basse est
   donc 6, et c'est une limite honnête, pas un choix.
   📌 Si le réglage se révèle utile, il se porte DANS `glisser.mjs`, où cinq
   écrans en profiteraient — comme pour l'axe. Le banc l'éprouve d'abord. */
const REGLAGE = { seuil: 6, k: 1 };

/* Le dernier geste jugé, pour que le relevé dise POURQUOI ça a raté. Sans
   ça, Eric sent que « ça marche pas » sans savoir de combien il rate — et
   c'est précisément l'information qui lui permet de choisir `k`. */
const dernierGeste = { angle: null, axe: null, verdict: "—" };

/** Arme un jeton pour le tap ET le glisser, mais n'accepte le glisser que
 *  s'il est HORIZONTAL. Rend l'état du geste, que les rappels consultent.
 *
 *  ⭐ L'ORDRE DES ÉCOUTEURS FAIT LE TRAVAIL, et il n'est pas fragile : nos
 *  écouteurs sont posés AVANT ceux de l'organe (`armerJeton` ajoute les
 *  siens depuis son propre `pointerdown`, qui court après le nôtre). Le
 *  drapeau est donc toujours à jour quand `onTap`/`onDepot` le lisent.
 *  ⛔ On ne nettoie PAS l'état à la fin du geste : l'organe décide après nous,
 *  et effacer trop tôt lui ferait lire un état vide. Le prochain appui le
 *  remet à neuf — c'est le seul moment sûr. */
function armerSelonAxe(jeton, { onTap, onDepot, onHorsCible }) {
  const geste = { axe: null, angle: null, annule: false };

  jeton.addEventListener("pointerdown", (ev) => {
    geste.axe = null;
    geste.angle = null;
    geste.annule = false;
    delete jeton.dataset.axe;
    const x0 = ev.clientX;
    const y0 = ev.clientY;

    const bouge = (e) => {
      if (geste.axe) return;
      const dx = e.clientX - x0;
      const dy = e.clientY - y0;
      if (Math.hypot(dx, dy) < REGLAGE.seuil) return;
      /* L'AXE SE DÉCIDE UNE FOIS, au franchissement du seuil, et ne se
         renégocie plus. Un geste qui change d'avis en cours de route est un
         geste qu'on ne peut pas apprendre. */
      geste.axe = Math.abs(dx) > REGLAGE.k * Math.abs(dy) ? "x" : "y";
      /* L'angle est gardé pour le RELEVÉ, pas pour la décision : la décision
         est le rapport ci-dessus, l'angle en est la lecture humaine. */
      geste.angle = Math.round(Math.atan2(Math.abs(dy), Math.abs(dx)) * 180 / Math.PI);
      jeton.dataset.axe = geste.axe;
    };
    const annuler = () => { geste.annule = true; };
    const fin = () => {
      jeton.removeEventListener("pointermove", bouge);
      jeton.removeEventListener("pointerup", fin);
      jeton.removeEventListener("pointercancel", annuler);
      jeton.removeEventListener("pointercancel", fin);
    };

    jeton.addEventListener("pointermove", bouge);
    jeton.addEventListener("pointerup", fin);
    jeton.addEventListener("pointercancel", annuler);
    jeton.addEventListener("pointercancel", fin);
  });

  /** Ce que le banc a décidé, et pourquoi — lu par le relevé. */
  const juger = (verdict) => {
    dernierGeste.angle = geste.angle;
    dernierGeste.axe = geste.axe;
    dernierGeste.verdict = verdict;
    if (!panneauOuvert()) return;   // rien à rafraîchir si personne ne regarde
    mesurer();
  };

  /* ⚠️ UN SEUIL RELEVÉ NE DOIT PAS CRÉER DE ZONE MORTE. L'organe décide à 6 px
     et ne sait rien du nôtre : entre 6 et `REGLAGE.seuil`, il annonce un
     GLISSER alors que le banc n'a pas encore tranché d'axe. Sans la ligne
     ci-dessous, ces gestes-là ne feraient RIEN — ni tap, ni dépôt — et
     monter le seuil aurait l'air de casser le tap. Un geste qui n'a pas
     franchi NOTRE seuil est un tap, quoi qu'en dise l'organe. */
  const sousLeSeuil = () => geste.axe === null;

  armerJeton(jeton, {
    /* UN TAP N'A PAS D'AXE : c'est un appui qui n'a jamais franchi le seuil.
       Un geste annulé n'en est pas un non plus. */
    onTap: () => {
      if (geste.annule) { juger("annulé (pointercancel)"); return; }
      juger("tap");
      onTap();
    },
    onDepot: (creneau) => {
      if (geste.annule) { juger("annulé (pointercancel)"); return; }
      if (sousLeSeuil()) { juger(`tap (sous le seuil de ${REGLAGE.seuil} px)`); onTap(); return; }
      if (geste.axe === "x") { juger(`déposé dans ${creneau}`); onDepot(creneau); return; }
      juger("REFUSÉ — geste vertical");
    },
    onHorsCible: () => {
      if (geste.annule) { juger("annulé (pointercancel)"); return; }
      if (sousLeSeuil()) { juger(`tap (sous le seuil de ${REGLAGE.seuil} px)`); onTap(); return; }
      if (geste.axe === "x") { juger("lâché hors cible"); if (onHorsCible) onHorsCible(); return; }
      juger("REFUSÉ — geste vertical");
    }
  });
}

/** LA BOURSE — quatre nombres, redessinés à chaque ajustement. */
function dessinerBourse() {
  swapContent(document.getElementById("purse"), BOURSE.map((piece) => {
    const bloc = document.createElement("span");
    bloc.className = "purse-piece";
    const n = document.createElement("b");
    n.className = "purse-nombre";
    n.textContent = String(bourse[piece]);
    const mot = document.createElement("span");
    mot.className = "purse-mot";
    mot.textContent = piece;
    bloc.append(n, mot);
    return bloc;
  }));

  /* Les quatre pastilles de choix — `.skills-cat`, la brique « une parmi N »
     du dépôt : l'active se remplit d'un lavis d'accent, les autres sont nues.
     ⛔ Pas de `<select>` : quatre choix courts se montrent, ils ne se
     déroulent pas — et un menu déroulant au pouce coûte deux gestes. */
  swapContent(document.getElementById("argent-pieces"), BOURSE.map((piece) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "skills-cat";
    b.textContent = piece;
    b.setAttribute("aria-current", piece === pieceChoisie ? "true" : "false");
    b.addEventListener("click", () => { pieceChoisie = piece; dessinerBourse(); mesurer(); });
    return b;
  }));

}

/** AJUSTER — `signe` vaut +1 ou −1. ⛔ Jamais en dessous de zéro : une bourse
 *  négative n'est pas une correction, c'est une faute qu'on propage. */
function ajuster(signe) {
  const champ = document.getElementById("argent-montant");
  const montant = Math.max(0, Math.floor(Number(champ.value) || 0));
  bourse[pieceChoisie] = Math.max(0, bourse[pieceChoisie] + signe * montant);
  dessinerBourse();
  mesurer();
}

/* ══ POSER, REPRENDRE — les deux seules choses que le banc fait d'un objet ══ */

/** Le premier récepteur libre, dans l'ordre du croquis (le sac avant la
 *  forge). C'est ce que le TAP choisit : « le glisser désigne SA case, le tap
 *  laisse l'écran choisir » (en-tête de `glisser.mjs`). */
function premierLibre() {
  return RECEPTEURS.find((r) => recepteurs[r] === null) ?? null;
}

function poser(creneau, objet) {
  if (!Object.prototype.hasOwnProperty.call(recepteurs, creneau)) return;
  recepteurs[creneau] = objet;
  dessiner();
}

function reprendre(creneau) {
  recepteurs[creneau] = null;
  dessiner();
}

/** UNE LIGNE D'OBJET — `.equipment-gear-row` du vrai écran, sur UNE ligne,
 *  et c'est elle l'objet qu'on prend.
 *
 *  ⭐ L'ASCENSEUR ET LE GLISSER NE SE DISPUTENT PLUS RIEN, ET C'EST L'AXE QUI
 *  LES A RÉCONCILIÉS. En août, la seule issue connue était de supprimer
 *  l'ascenseur (« il ne faut plus d'ascenseurs couplés avec des actions drag
 *  and drop », 2026-08-20). La règle d'Eric du 22 fait mieux : la colonne
 *  garde son ascenseur, et le geste se distingue par sa DIRECTION.
 *  Voir `armerSelonAxe` plus haut — c'est là que la règle vit. */
function faireLigne(etagere, n) {
  /* ⭐ DES NOMS DE LA LONGUEUR RÉELLE, pas « exemple 01 ». Le sujet du jour
     EST la longueur des noms : un banc qui n'éprouve que des libellés courts
     aurait déclaré la tuile bonne alors que « Baguette de détection de la
     magie » ne tient pas. Le nom de l'étagère fournit la vraie mesure, et le
     numéro garde chaque ligne distincte. */
  const objet = `${etagere} ${String(n).padStart(2, "0")}`;

  const ligne = document.createElement("button");
  ligne.type = "button";
  ligne.className = "equipment-gear-row r-ligne";

  const nom = document.createElement("span");
  nom.className = "equipment-gear-name";
  nom.textContent = objet;

  /* ⛔ PLUS DE LIGNE DE MESURES — Eric, 2026-08-22 : *« faut vraiment que juste
     le titre s'affiche »*. Troisième état de cette tuile en une heure, et
     c'est le bon usage d'un banc : il itère sur ce qu'il VOIT. Cette consigne
     REMPLACE les deux précédentes (le poids retiré, puis remis sous le nom) ;
     on ne cherche pas à les concilier.
     📌 Le poids et le prix vivent sur la fiche de l'objet, qu'on ouvre au tap.
     Rien n'est perdu — c'est une question de PRIORITÉ dans la vitrine. */
  ligne.append(nom);

  armerSelonAxe(ligne, {
    /* LE TAP : dans le premier récepteur libre. S'il n'y en a plus, on ne
       fait rien — un banc ne remplace pas en silence ce qu'on y a posé. */
    onTap: () => {
      const libre = premierLibre();
      if (libre) poser(libre, objet);
    },
    /* LE GLISSER HORIZONTAL : dans le récepteur VISÉ. `creneau` est la chaîne
       rendue par l'organe, lue sur `data-creneau` — les clefs de `recepteurs`
       sont les mêmes, exprès. */
    onDepot: (creneau) => poser(creneau, objet)
  });

  return ligne;
}

/** LE CONTENU D'UN RÉCEPTEUR — armé par le MÊME organe que la ligne d'où il
 *  vient, pour que le retour emprunte exactement le chemin de l'aller. */
function dessinerRecepteurs() {
  for (const clef of RECEPTEURS) {
    const slot = document.querySelector(`[data-creneau="${clef}"]`);
    const objet = recepteurs[clef];
    slot.dataset.rempli = objet === null ? "false" : "true";

    /* ⛔ PLUS D'ÉTIQUETTE `R.BAG.SLOT` DANS LA CASE : le badge du bloc la nomme
       déjà, et dans une case de 74 px elle occupait la place de ce qu'on y
       dépose. Un creux se lit à sa FORME, pas à sa légende. */
    if (objet === null) {
      const vide = document.createElement("span");
      vide.className = "glisse-creneau-valeur";
      vide.textContent = "déposer";
      swapContent(slot, [vide]);
      continue;
    }

    const pose = document.createElement("button");
    pose.type = "button";
    /* ⭐ LA MÊME CLASSE QUE DANS UNE TUILE — donc la même coupure sur deux
       lignes, le même corps, la même ellipse. Un seul code pour les deux
       endroits : c'est ce que « le récepteur a la taille de l'item » veut dire
       jusqu'au bout. */
    pose.className = "equipment-gear-name r-depose";
    pose.textContent = objet;
    pose.title = objet;
    armerJeton(pose, {
      onTap: () => reprendre(clef),
      /* Glissé d'un récepteur vers l'autre : c'est un déplacement, pas une
         copie — la case de départ se vide. */
      onDepot: (vers) => {
        if (vers === clef) return;
        recepteurs[clef] = null;
        poser(vers, objet);
      },
      /* Lâché dans le vide DEPUIS un récepteur : c'est l'annulation d'Eric
         (« on annule en ressortant l'objet »). L'organe distingue ce cas
         exprès — voir `onHorsCible` dans son en-tête. */
      onHorsCible: () => reprendre(clef)
    });
    swapContent(slot, [pose]);
  }
}

function dessiner() {
  const rayon = trouveRayon(rayonCourant);
  if (!rayon.etageres.some((e) => e.nom === etagereChoisie)) {
    etagereChoisie = etagereCourante();
  }

  /* ── la rangée du HAUT : sept rayons, fixes ── */
  swapContent(belts.rayons, CATALOGUE.map((r) =>
    faireCran(r.rayon, r.compte, r.rayon === rayonCourant, () => {
      if (r.rayon === rayonCourant) return;
      rayonCourant = r.rayon;
      /* LE POINT QUE LE BANC TRANCHE : en A, on retombe sur la première
         étagère ; en B, sur celle qu'on avait laissée. Une seule ligne les
         sépare, et c'est `etagereCourante()` qui la porte. */
      etagereChoisie = etagereCourante();
      dessiner();
    })
  ));

  /* ── la rangée du BAS : les étagères du rayon choisi ── */
  swapContent(belts.etageres, rayon.etageres.map((e) =>
    faireCran(e.nom, e.compte, e.nom === etagereChoisie, () => {
      etagereChoisie = e.nom;
      /* La mémoire est tenue dans LES DEUX modes — voir la note de l'état. */
      souvenir.set(rayonCourant, e.nom);
      dessiner();
    })
  ));

  /* Les deux pistes montrent ce qu'elles désignent — chacune la sienne. */
  for (const piste of [belts.rayons, belts.etageres]) {
    keepInView(piste, piste.querySelector('[data-status="current"]'), "x");
  }

  /* ── R.list : le contenu de l'étagère ── */
  const etagere = rayon.etageres.find((e) => e.nom === etagereChoisie);

  if (etagere.compte === 0) {
    const vide = document.createElement("p");
    vide.className = "r-list-vide";
    /* ⚠️ UNE ÉTAGÈRE À ZÉRO N'EST PAS UNE ERREUR — les quatre de Companions
       et deux de Crafting sont annoncées à 0 par la commande. Le banc le DIT
       plutôt que de rendre une boîte muette. */
    vide.textContent = "Rien sur cette étagère — annoncée à 0.";
    swapContent(listeBoite, [vide]);
  } else {
    const lignes = [];
    for (let n = 1; n <= etagere.compte; n += 1) lignes.push(faireLigne(etagere.nom, n));
    swapContent(listeBoite, lignes);
  }
  dessinerRecepteurs();
  mesurer();
}

/** Combien de lignes ENTIÈRES la fenêtre de `R.list` montre. La hauteur vient
 *  de la première ligne posée, jamais d'un littéral. */
function lignesVisibles() {
  const une = listeBoite.querySelector(".r-ligne");
  if (!une) return 0;
  const haut = une.getBoundingClientRect().height;
  return haut > 0 ? Math.floor(listeBoite.clientHeight / haut) : 0;
}

/* ══ LE BUDGET DE HAUTEUR — mesuré, jamais estimé ════════════════════════
   Eric, 2026-08-22 : *« calcule bien la quantité d'espace qu'on a en hauteur,
   qu'on n'ait pas de mauvaises surprises en arrivant dans le builder »*.

   ⭐ AUCUN CHIFFRE N'EST ÉCRIT ICI. La ceinture est une VRAIE ceinture, posée
   dans le banc : sa hauteur se lit sur elle. Les quatre blocs de `R` se
   mesurent aussi. Le jour où une cote change, ce relevé change tout seul —
   c'est la différence entre un budget et une croyance. */
function budgetHauteur() {
  const h = (sel) => {
    const n = document.querySelector(sel);
    return n ? Math.round(n.getBoundingClientRect().height) : 0;
  };
  const fenetre = window.innerHeight;
  const belt = h("#belt-chassis");
  const topbar = 0;                       // tranché : `R` ne s'en sert pas
  /* 🔴 L'UTILE SE MESURE, IL NE SE SOUSTRAIT PLUS. `fenêtre − belt` supposait
     que `innerHeight` soit la place réelle — l'hypothèse exacte qui a produit
     « la carte n'est pas fixe » sur l'iPhone d'Eric. On lit maintenant la
     hauteur de la zone que `.app` attribue vraiment à la scène : c'est le
     navigateur qui répond, barres de Safari comprises. */
  const utile = h(".banc-scroll");

  const blocs = [...document.querySelectorAll(".colonne-r > .bloc")];
  const detail = blocs.map((b) => {
    const id = b.querySelector(".bloc-id");
    return `${id ? id.textContent : "?"} ${Math.round(b.getBoundingClientRect().height)}`;
  }).join(" · ");
  const carte = Math.round(document.querySelector(".colonne-r").getBoundingClientRect().height);
  const coulisse = Math.round(listeBoite.getBoundingClientRect().height);
  /* La carte tient-elle sous la ceinture ? Si elle déborde, la règle d'Eric
     s'applique — on demande ce qu'elle porte EN TROP, on n'ajoute pas
     d'ascenseur. Le banc pose la question avec le nombre. */
  const reste = utile - carte;
  const scene = Math.round(document.querySelector(".scene").getBoundingClientRect().height);
  /* La tuile se remesure ici : `budgetHauteur` est appelée depuis `mesurer`,
     mais elle ne partage pas ses locales — et une valeur passée en argument de
     plus se serait périmée le jour où l'ordre des appels change. */
  const tuile = listeBoite.querySelector(".r-ligne");
  const tuileBox = tuile ? tuile.getBoundingClientRect() : { width: 0, height: 0 };


  /* ══ LA LIGNE QUI NE PEUT PAS MENTIR ═════════════════════════════════
     Trois hauteurs côte à côte : ce que le script croit (`innerHeight`), ce
     que Safari laisse vraiment (`visualViewport`), et ce que le CSS applique
     (`100dvh`, lu sur la sonde). Sur un bureau les trois sont égales — c'est
     pour ça que l'émulateur nous a menti à tous les deux. Sur un iPhone elles
     divergent, et l'écart est le nombre de pixels que le banc s'inventait. */
  const dvh = Math.round(document.querySelector(".sonde-dvh").getBoundingClientRect().height);
  const vv = window.visualViewport ? Math.round(window.visualViewport.height) : fenetre;
  const accord = fenetre === vv && vv === dvh;

  /* ══ L'ARBITRAGE ENTIER, SUR QUATRE LIGNES ══════════════════════════
     Les quatre chiffres qui bougent ENSEMBLE quand on déplace le curseur de
     partage. Sans eux, élargir les tuiles se choisit à l'aveugle : on voit ce
     qu'on gagne (des noms lisibles) et jamais ce qu'on paie (une carte plus
     étroite, donc plus haute, donc qui déborde davantage). */
  const t = nomsTronques();
  const railL = Math.round(document.querySelector(".r-list-col").getBoundingClientRect().width);
  const carteL = Math.round(document.querySelector(".colonne-r").getBoundingClientRect().width);
  const debord = carte - utile;
  /* ⭐ LES TROIS CHIFFRES QUI DISENT D'UN COUP SI LE CADRAGE TIENT : la
     largeur EFFECTIVE de la colonne (entre ses deux bornes), ce qu'elle
     tronque encore, et le vide qui reste de chaque côté. Les deux vides
     doivent être ÉGAUX — c'est la preuve du centrage, et elle se lit sans
     calculer. */
  const sceneBox = document.querySelector(".scene").getBoundingClientRect();
  const groupe = Math.round(railL + carteL);
  const videG = Math.round(document.querySelector(".r-list-col").getBoundingClientRect().left - sceneBox.left);
  const videD = Math.round(sceneBox.right - document.querySelector(".colonne-r").getBoundingClientRect().right);
  const arbitrage = `\n`
    + `── cadrage ───────────────────────────────────────────────\n`
    + `tuiles           ${railL} px   (plancher 90 · plafond 140, mesurés)\n`
    + `noms tronqués    ${t.tronques} sur ${t.total}\n`
    + `carte            ${carteL} px   (--card-w, plafond ${getComputedStyle(document.documentElement).getPropertyValue("--card-w").trim()})\n`
    + `groupe           ${groupe} px\n`
    + `vide g. / d.     ${videG} / ${videD} px   ${videG === videD ? "✓ centré" : `✗ décalé de ${Math.abs(videG - videD)} px`}\n`
    + `hauteur carte    ${carte} px → ${debord > 0 ? `DÉBORDE de ${debord} px` : `il reste ${-debord} px`}\n`
    + `crans R.cat      ${cransEntiers(belts.rayons)} entiers sur ${belts.rayons.children.length}\n`
    + `tuiles visibles  ${lignesVisibles()}\n`;

  return arbitrage + `\n`
    + `── viewport ──────────────────────────────────────────────\n`
    + `innerHeight      ${fenetre} px\n`
    + `visualViewport   ${vv} px\n`
    + `100dvh (sonde)   ${dvh} px\n`
    + `                 ${accord
        ? "les trois s'accordent — écran sans chrome mobile (bureau ou émulateur)"
        : `✗ ILS DIVERGENT de ${Math.max(fenetre, vv, dvh) - Math.min(fenetre, vv, dvh)} px — `
          + "les barres de Safari. C'est ce que `vh` ignorait."}\n`
    + `\n`
    + `── budget de hauteur ─────────────────────────────────────\n`
    + `fenêtre          ${fenetre} px\n`
    + `belt (mesuré)    ${belt} px   ceinture réelle, posée dans le banc\n`
    + `stage-topbar     ${topbar} px   TRANCHÉ : R ne s'en sert pas (bourse dans R.find, catégories dans R.cat)\n`
    + `utile            ${utile} px   MESURÉ sur la zone que .app attribue, jamais soustrait\n`
    + `carte R          ${carte} px   ${detail}\n`
    + `reste sous R     ${reste} px   ${reste >= 0 ? "✓ la carte tient" : "✗ la carte DÉBORDE — que porte-t-elle en trop ?"}\n`
    + `coulisse gauche  ${coulisse} px sur ${utile} utiles   ${coulisse <= utile ? "✓" : "✗ dépasse"}\n`
    /* 🔴 LA VRAIE QUESTION EST LA SCÈNE ENTIÈRE, PAS LA CARTE SEULE. À deux
       colonnes, `R` et les tuiles se partagent la largeur et la plus haute
       décide ; EMPILÉES (≤ 640 px), elles s'ADDITIONNENT. C'est là que ça
       casse en premier, et le relevé le dit avec le nombre plutôt que de
       laisser la surprise pour le builder. */
    + `scène (2 colonnes) ${scene} px sur ${utile} utiles   `
    /* ⛔ « LA PAGE DÉFILERA » ÉTAIT FAUX DEPUIS LE PASSAGE EN `dvh` : la scène
       est en `overflow: hidden`, donc rien ne défile — ce qui dépasse est
       COUPÉ, et la carte ne bouge pas. C'est exactement ce qu'Eric demandait,
       et le verdict doit dire ce qui arrive vraiment. */
    + `${scene <= utile ? "✓ tout tient" : `✗ dépasse de ${scene - utile} px — coupé en bas (la carte, elle, ne bouge pas)`}\n`
    /* ══ LES DEUX ÉCRANS CÔTE À CÔTE, CE QU'ERIC A FAIT SUR SON IPHONE ═════
       Les chiffres de Species sont RELEVÉS dans le vrai builder à 375 × 812
       (`index.html`, même serveur, 2026-08-22), pas estimés. Les mettre ici
       est ce qui rend l'écart lisible sans changer d'écran. */
    + `\n── Species (relevé) vs R (mesuré ici), à 375 ──────────────\n`
    + `                 Species              R\n`
    + `belt             60                   ${belt}\n`
    + `stage-topbar     0                    ${topbar}\n`
    + `utile            752                  ${utile}${utile < 700 ? "  ← chrome mobile réel" : ""}\n`
    + `colonne étroite  90 (--rail-w)        ${Math.round(document.querySelector(".r-list-col").getBoundingClientRect().width)}\n`
    + `colonne large    285                  ${Math.round(document.querySelector(".colonne-r").getBoundingClientRect().width)}\n`
    + `air de la carte  8 px (.fiche-dalle)  ${getComputedStyle(document.querySelector(".colonne-r")).padding}\n`
    + `écart interne    8 px                 ${getComputedStyle(document.querySelector(".colonne-r")).gap}\n`
    + `carte            440 (F1 dans 752)    ${carte}\n`
    + `item étroit      74 × 30 · --t2       ${Math.round(tuileBox.width)} × ${Math.round(tuileBox.height)} · --t2\n`
    + `la page défile   non                  ${scene <= utile ? "non ✓" : "OUI ✗"}\n`;
}

/** Combien de crans ENTIERS une piste montre — le critère d'Eric, mesuré à
 *  chaque redessin plutôt que jugé à l'œil. Un cran seulement amorcé ne
 *  compte pas : c'est justement ce que la première pose confondait. */
function cransEntiers(piste) {
  const boite = piste.getBoundingClientRect();
  const cs = getComputedStyle(piste);
  const gauche = boite.left + parseFloat(cs.paddingLeft || 0);
  const droite = boite.right - parseFloat(cs.paddingRight || 0);
  let n = 0;
  for (const cran of piste.children) {
    const k = cran.getBoundingClientRect();
    if (k.left >= gauche - 0.5 && k.right <= droite + 0.5) n += 1;
  }
  return n;
}

function mesurer() {
  const l = (n) => (n ? Math.round(n.getBoundingClientRect().width) : 0);
  const h = (n) => (n ? Math.round(n.getBoundingClientRect().height) : 0);
  const cranHaut = belts.rayons.querySelector(".belt-item");
  const cranBas = belts.etageres.querySelector(".belt-item");
  const air = Math.round(parseFloat(getComputedStyle(belts.rayons).paddingLeft) || 0);
  const debordeHaut = belts.rayons.scrollWidth > belts.rayons.clientWidth;
  const debordeBas = belts.etageres.scrollWidth > belts.etageres.clientWidth;
  const entiersHaut = cransEntiers(belts.rayons);
  const entiersBas = cransEntiers(belts.etageres);
  const fond = getComputedStyle(document.querySelector(".app")).backgroundImage;
  const fondPose = fond && fond !== "none";
  const uneLigne = listeBoite.querySelector(".r-ligne");
  const hauteurLigne = uneLigne ? Math.round(uneLigne.getBoundingClientRect().height) : 0;

  document.getElementById("mesures").textContent =
      `écran            ${window.innerWidth} × ${window.innerHeight}\n`
    + `colonne R.cat    ${l(belts.rayons.parentElement)} px de large\n`
    + `air aux bouts    ${air} px  (8 attendus — shell.css en impose 37 aux onglets)\n`
    + `cran du haut     ${l(cranHaut)} × ${h(cranHaut)}   dalle, --t3\n`
    + `cran du bas      ${l(cranBas)} × ${h(cranBas)}   mot, --t2\n`
    /* 🔴 LE CRITÈRE D'ERIC, CHIFFRÉ : au moins 4 crans ENTIERS et le 5ᵉ
       amorcé. Le relevé le dit, verdict compris — un banc qui affiche la
       mesure sans la juger laisse le lecteur faire l'arithmétique. */
    + `crans entiers    haut ${entiersHaut} ${entiersHaut >= 4 ? "✓" : "✗ (4 exigés)"} · bas ${entiersBas}   sur ${belts.rayons.children.length} et ${belts.etageres.children.length}\n`
    + `débordement      haut ${debordeHaut ? "oui" : "non"} · bas ${debordeBas ? "oui" : "non"}  (la piste défile)\n`
    + `tuiles R.list    ${lignesVisibles()} visibles · ${listeBoite.children.length} en tout · tuile = ${hauteurLigne} px\n`
    + `récepteurs       bag ${recepteurs.bag ?? "—"} · craft ${recepteurs.craft ?? "—"}\n`
    + `sensibilité      distance ${REGLAGE.seuil} px · angle k ${REGLAGE.k.toFixed(1)} (${angleDeK(REGLAGE.k)}°)\n`
    /* ⭐ LE DERNIER GESTE, ET SURTOUT SON ANGLE. Un refus muet se lit « ça
       marche pas » ; un refus chiffré se lit « j'ai raté de 18° », et c'est ce
       qui permet de choisir `k` plutôt que de le subir. */
    + `dernier geste    ${dernierGeste.angle === null
        ? "aucun"
        : `${dernierGeste.angle}° · ${dernierGeste.axe ?? "sous le seuil"} → ${dernierGeste.verdict}`}`
    + `${dernierGeste.verdict.startsWith("REFUSÉ")
        ? `   (il fallait moins de ${angleDeK(REGLAGE.k)}°)`
        : ""}\n`
    + `cote F1          ${COTE_F1}  (lue dans fiche.css, jamais recopiée)\n`
    + `zone de coulisse ${Math.round(listeBoite.getBoundingClientRect().height)} px — sans cadre, tuiles posées sur le fond\n`
    + `bourse           ${BOURSE.map((c) => `${bourse[c]} ${c}`).join(" · ")}   ajustable à la main (3ᵉ geste, pas de « sell »)\n`
    + `R.bag.image      place réservée 48 × 48 — destination B3 ou SB3.1, non tranchée\n`
    + `fond             ${fondPose ? "posé (.app, --bg-image)" : "ABSENT — rien ne se juge"}\n`
    + `R.purse.ajust    le MJ donne, ou le joueur se corrige. ⛔ pas de « vendre » :\n`
    + `                 retirer un objet du sac ne rend pas l'argent (acheter · gratuit · ajuster)\n`
    + budgetHauteur()
    + `mode             ${mode} — ${mode === "A" ? "le bas oublie" : "le bas se souvient"}\n`
    + `ouvert sur       ${rayonCourant} › ${etagereChoisie}`;
}

/* ── L'INTERRUPTEUR A/B ─────────────────────────────────────────────── */
const dit = document.getElementById("variante-dit");
const boutons = [...document.querySelectorAll(".variante .record-option")];

function poserMode(nouveau) {
  mode = nouveau;
  for (const b of boutons) b.dataset.active = b.dataset.mode === mode ? "true" : "false";
  dit.textContent = mode === "A"
    ? "A — changer de rayon retombe toujours sur la première étagère alphabétique."
    : "B — chaque rayon garde l'étagère où on l'avait laissé. Va poser une étagère dans deux rayons, puis reviens.";
  etagereChoisie = etagereCourante();
  dessiner();
}

for (const b of boutons) b.addEventListener("click", () => poserMode(b.dataset.mode));

/* R.menu : les ⋮ n'ouvrent rien — `R.html` dit qu'on ne sait pas encore ce
   qu'ils font. Un banc ne comble pas un trou de conception en douce. */
document.getElementById("argent-plus").addEventListener("click", () => ajuster(+1));
document.getElementById("argent-moins").addEventListener("click", () => ajuster(-1));

/* GET BACK — il reprend ce que `R.craft.slot` tient, et rien d'autre. C'est
   le bouton du croquis, à sa place ; il ne double aucun geste, il donne un
   nom au retour depuis la forge. */
document.getElementById("r-getback").addEventListener("click", () => reprendre("craft"));

document.getElementById("r-menu").addEventListener("click", (e) => {
  e.currentTarget.setAttribute("aria-label", "R.menu — sans destination, à nommer");
});

/* ══ LA CEINTURE INERTE — les dix étapes du vrai builder ═════════════════
   Recopiées de `shell.mjs` parce que ce sont des LIBELLÉS, pas une cote : ce
   qu'on mesure ici est la HAUTEUR de la ceinture, et elle vient du CSS. Si un
   libellé changeait, la hauteur ne bougerait pas d'un pixel.
   ⛔ Aucun `data-status`, aucun écouteur : elle occupe la place, rien de plus. */
const ETAPES = ["Menu", "Identity", "Species", "Inheritance", "Destiny",
                "Class", "Abilities", "Skills", "Equipment", "Sheet"];
swapContent(document.getElementById("belt-etapes"), ETAPES.map((mot, i) => {
  const cran = document.createElement("div");
  cran.className = "belt-item";
  const num = document.createElement("span");
  num.className = "belt-index";
  num.textContent = String(i);
  const lab = document.createElement("span");
  lab.className = "belt-label";
  lab.textContent = mot;
  cran.append(num, lab);
  return cran;
}));

/* ══ LE PANNEAU DU BANC — il se superpose, il n'habite pas la scène ══════
   ⭐ Le relevé n'est recalculé qu'à L'OUVERTURE : mesurer en continu un
   panneau fermé ne sert personne, et `mesurer()` lit une trentaine de
   rectangles. Un banc n'a pas à peser sur le geste qu'il éprouve. */
const panneau = document.getElementById("banc-panneau");
function panneauOuvert() { return !panneau.hidden; }
function ouvrirPanneau(ouvert) {
  panneau.hidden = !ouvert;
  if (ouvert) mesurer();
}
document.getElementById("banc-bouton").addEventListener("click", () => ouvrirPanneau(true));
document.getElementById("banc-fermer").addEventListener("click", () => ouvrirPanneau(false));
/* Le voile ferme, le corps non — sinon régler un curseur refermerait tout. */
panneau.addEventListener("click", (e) => { if (e.target === panneau) ouvrirPanneau(false); });

/** COMBIEN DE NOMS SONT ENCORE TRONQUÉS — mesuré sur TOUTES les tuiles de
 *  l'étagère, jamais sur un échantillon ni à l'œil.
 *
 *  🔴 ET LE TEST EST VERTICAL, PAS HORIZONTAL. La consigne disait de comparer
 *  `scrollWidth` à `clientWidth` — c'est le bon test pour une ellipse sur UNE
 *  ligne, et il ne voit plus rien depuis que le nom se déplie : `line-clamp`
 *  coupe en HAUTEUR. Un nom tronqué a donc `scrollHeight > clientHeight`, et
 *  sa largeur, elle, tient parfaitement. Le test d'hier aurait rendu « 0
 *  tronqué » sur trente-deux baguettes coupées. */
function nomsTronques() {
  const noms = listeBoite.querySelectorAll(".equipment-gear-name");
  let n = 0;
  for (const nom of noms) if (nom.scrollHeight > nom.clientHeight + 1) n += 1;
  return { tronques: n, total: noms.length };
}

/* ── LES DEUX CURSEURS DE SENSIBILITÉ ───────────────────────────────────
   ⭐ L'ANGLE EST AFFICHÉ EN DEGRÉS À CÔTÉ DU RAPPORT : `k = 1,5` ne dit rien à
   un pouce, « 34° » si. La conversion est `atan(1/k)` — l'angle au-delà duquel
   le geste bascule du côté vertical. */
const regSeuil = document.getElementById("reg-seuil");
const regK = document.getElementById("reg-k");
const regDit = document.getElementById("reglage-dit");

function angleDeK(k) { return Math.round(Math.atan(1 / k) * 180 / Math.PI); }

function poserReglages() {
  REGLAGE.seuil = Number(regSeuil.value);
  REGLAGE.k = Number(regK.value);
  document.getElementById("reg-seuil-val").textContent = `${REGLAGE.seuil} px`;
  document.getElementById("reg-k-val").textContent =
    `k ${REGLAGE.k.toFixed(1)} · ${angleDeK(REGLAGE.k)}°`;
  regDit.textContent =
    `Au-delà de ${REGLAGE.seuil} px, un geste plus incliné que ${angleDeK(REGLAGE.k)}° `
    + `compte comme un défilement ; en deçà, il prend l'objet. `
    + `Plus k monte, plus défiler est sûr et plus prendre demande d'intention.`;
  if (panneauOuvert()) mesurer();
}
regSeuil.addEventListener("input", poserReglages);
regK.addEventListener("input", poserReglages);
poserReglages();

dessinerBourse();
poserMode("A");
window.addEventListener("resize", () => mesurer());
/* 🔴 ET `visualViewport`, QUI EST LE SEUL À PARLER SUR IPHONE. Quand la barre
   d'adresse de Safari se replie, la place disponible change de ~100 px SANS
   qu'un `resize` de fenêtre soit garanti — le relevé afficherait alors des
   chiffres périmés au moment précis où Eric regarde s'ils divergent. C'est le
   même défaut que `vh`, une couche plus haut : croire que `window` sait. */
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => mesurer());
  window.visualViewport.addEventListener("scroll", () => mesurer());
}

/* ══ LA RÈGLE — pour qu'Eric puisse me contredire ═══════════════════════
   Eric, 2026-08-22 : *« je ne te crois pas et j'ai aucun moyen de te
   contredire »*. Il avait raison : tous les chiffres de ce banc passaient
   par un rapport écrit, donc par quelqu'un. Un relevé qui se lit en bas de
   page demande la même confiance qu'une phrase.

   ⭐ Ce bloc ne mesure rien de plus — il DESSINE ce qui est déjà mesuré, à
   l'endroit exact où ça se passe. La ligne « fin de l'espace attribué » est
   posée par `getBoundingClientRect`, pas par une constante : si elle ment,
   elle ment visiblement. */
(function regle() {
  const nid = document.createElement("div");
  nid.id = "regle-couche";
  nid.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:9999;display:none";
  document.body.append(nid);

  const bouton = document.createElement("button");
  bouton.type = "button";
  bouton.id = "regle-bouton";
  bouton.textContent = "Afficher la règle";
  /* 🔴 IL ÉTAIT EN BAS À DROITE, ET IL RECOUVRAIT `GET BACK` sur les captures
     d'Eric. Il rejoint la barre d'outils du banc, en bas à GAUCHE, dans le
     coin mort sous la colonne de tuiles — le seul endroit de l'écran où aucun
     élément de `R` ne vit. Il garde sa teinte : Eric le reconnaît, et il a
     demandé à garder la règle. */
  bouton.style.cssText = "padding:3px 5px;font:600 10px/1.2 system-ui,sans-serif;"
    + "border-radius:8px;border:1px solid #0006;background:#e8c07d;color:#1a1a1a;"
    + "cursor:pointer;opacity:.85";
  bouton.textContent = "règle";
  (document.getElementById("banc-outils") || document.body).append(bouton);

  const trait = (haut, texte, couleur) => {
    const l = document.createElement("div");
    l.style.cssText = `position:absolute;left:0;right:0;top:${haut}px;height:0;`
      + `border-top:2px dashed ${couleur}`;
    const t = document.createElement("span");
    t.textContent = texte;
    t.style.cssText = `position:absolute;right:4px;top:-18px;font:600 12px/1 system-ui,sans-serif;`
      + `color:${couleur};background:#000a;padding:2px 6px;border-radius:4px`;
    l.append(t);
    nid.append(l);
  };

  const cadre = (r, texte, couleur) => {
    const d = document.createElement("div");
    d.style.cssText = `position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;`
      + `height:${r.height}px;outline:2px solid ${couleur};outline-offset:-1px`;
    const t = document.createElement("span");
    t.textContent = `${texte} — ${Math.round(r.width)} × ${Math.round(r.height)}`;
    t.style.cssText = `position:absolute;left:0;top:0;font:600 12px/1 system-ui,sans-serif;`
      + `color:#000;background:${couleur};padding:2px 6px`;
    d.append(t);
    nid.append(d);
  };

  const dessiner = () => {
    /* ⛔ `removeChild` ÉTAIT ÉCRIT ICI, et `tests/socle.test.mjs` l'interdit
       dans tout `ui/builder/` au même titre qu'`innerHTML` — le garde ne
       balaye aujourd'hui que les `.mjs`, donc il n'a rien dit. Le geste est
       le même : on passe par le seul remplaçant du dépôt. */
    swapContent(nid, []);
    const belt = document.querySelector(".belt");
    const scene = document.querySelector(".banc-scroll");
    /* 🔴 CES DEUX SÉLECTEURS ÉTAIENT FAUX, et l'overlay ne le disait pas :
       `.r-carte` et `.r-list-coulisse` n'existent nulle part dans ce banc. Le
       premier retombait sur le PARENT de `.r-cat` (juste par chance la carte),
       le second sur `[class*=r-list]` — qui attrape `.r-list-col`, le
       conteneur, et pas la zone qui coulisse. Les cadres encadraient donc
       autre chose que ce qu'ils annonçaient, en silence.
       ⭐ Nommés en dur maintenant, sans repli : un cadre qui ne trouve pas sa
       cible ne se dessine pas, plutôt que d'en encadrer une autre. */
    const carte = document.querySelector(".colonne-r");
    const liste = document.querySelector(".r-tuiles");
    if (belt) cadre(belt.getBoundingClientRect(), "belt (châssis)", "#7fd1ff");
    if (carte) cadre(carte.getBoundingClientRect(), "R — la carte", "#e8c07d");
    if (liste) cadre(liste.getBoundingClientRect(), "les tuiles", "#9fe38a");
    if (scene) {
      const r = scene.getBoundingClientRect();
      trait(r.top, "début de l'espace attribué", "#ff7a7a");
      trait(r.bottom, "FIN de l'espace attribué — rien ne devrait dépasser", "#ff7a7a");
    }
  };

  bouton.addEventListener("click", () => {
    const on = nid.style.display === "none";
    nid.style.display = on ? "block" : "none";
    bouton.textContent = on ? "règle ✓" : "règle";
    if (on) dessiner();
  });
  window.addEventListener("resize", () => { if (nid.style.display === "block") dessiner(); });
  window.addEventListener("scroll", () => { if (nid.style.display === "block") dessiner(); }, true);
})();

</script>
</body>
</html>
