<!doctype html><meta charset="utf-8">
<title>FHPC — prototype : les portes à image (Backpack · Wares · Gear)</title>
<!-- ══ PROTOTYPE — lot 310, 2026-09-27 ══════════════════════════════════════
     ⚖️ Eric, 27/09, mot pour mot : « Backpack, wares, gear. Fait des boutons format classique
     relief carré avec, les images de fond dessus, wares en petit (t0 t1 en italique) dessus.
     Fait un prototype déjà ».
     ⭐ CE BANC NE CHANGE RIEN AU BUILDER : il lit les VRAIES feuilles (`tokens.css`, `shell.css`)
     et les VRAIES images de fond des écrans (`sac-fond.webp`, `wares-fond.webp`, `pantin-x.png`),
     et pose, sur le vrai fond, trois tailles de porte carrée à comparer. Le relief est celui des
     portes du pied de R (`.gear-porte` : sa tuile `::before`, son liseré `::after`, bleu de
     navigation) — seul le FORMAT change (carré), et une image se pose dessus.
     ⛔ Les trois tailles (44 · 56 · 64) sont des PROPOSITIONS de banc, pas des cotes : la cote
     retenue ira dans le plan de chaque écran. -->
<link rel="stylesheet" href="./tokens.css?v=928">
<link rel="stylesheet" href="./shell.css?v=928">
<style>
  body { margin: 0; min-height: 100vh; background: var(--bg-image) center / cover, var(--bg); color: var(--text);
         font-family: var(--font, system-ui); }
  .banc { max-width: 375px; margin: 0 auto; padding: 16px 12px 40px; display: grid; gap: 22px; }
  .banc h2 { margin: 0 0 6px; font-size: var(--t2); font-weight: 600; }
  .banc p { margin: 0 0 8px; font-size: var(--t1); color: var(--text-soft, var(--text)); }
  .rangee { display: flex; justify-content: center; align-items: center; gap: var(--sp-8); padding: 8px 0;
            background: var(--glass, transparent); border-radius: 12px; }
  /* ── LA PORTE À IMAGE — ⚖️ RETENUE PAR ERIC, 27/09 : « Carré 40 (44) bien. Images : wares parfait,
     pantin fait le plus trapu, backpack fait le 15 % plus petit. Le texte centré horizontalement et
     verticalement ». ⭐ La cible reste 44 (`--touch`) ; le CORPS peint est 40 — le retrait du relief
     appliqué sur les QUATRE côtés, comme les options carrées de l'aiguilleur
     (`.aiguilleur-option::before`, shell.css). */
  .gear button.gear-porte.porte-imagee[data-porte] { position: relative; inline-size: var(--touch); min-inline-size: var(--touch);
    max-inline-size: var(--touch); block-size: var(--touch); min-height: 0; padding: 0;
    display: grid; place-items: center; }
  .gear .porte-imagee::before { inset: var(--bouton-retrait-v); }
  .gear .porte-imagee::after { inset: calc(var(--bouton-retrait-v) + var(--bouton-lisere-marge)); }
  /* ⭐ L'IMAGE EST UN FILIGRANE, PEINT COMME SUR SON ÉCRAN : un aplat `--text-soft` découpé par
     l'image (masque) — posée telle quelle, elle est sombre et disparaît la nuit (`.sac-fond`). */
  .gear .porte-imagee .porte-image { position: absolute; inset: calc(var(--bouton-retrait-v) + 3px);
    background: var(--text-soft); -webkit-mask: var(--img) center / var(--taille, contain) no-repeat;
    mask: var(--img) center / var(--taille, contain) no-repeat; pointer-events: none; }
  .gear .porte-imagee .porte-mot { position: relative; font-style: italic; font-weight: 600;
    font-size: var(--t0); line-height: 1; text-align: center; text-shadow: 0 0 3px var(--bg); }
  /* ⚖️ 27/09, deuxième passe d'Eric : « Harmoniser les couleurs des 3 images · Wares doit remplir
     tout le bas du bouton · Backpack, mot trop large, remplacé par pack, réduit encore l'image du sac à
     dos de 10 % · Gear : pantin 10 % moins haut 10 % plus large ».
     ⭐ LES COULEURS : les trois filigranes n'avaient pas la même opacité (alpha moyen : pantin 244,
     sac 135, wares 107 — mesuré) ; peints de la même encre, ils sortaient en trois tons. Trois
     SILHOUETTES PLEINES en sont tirées (`assets/porte-*.png`, 160 de haut, recadrées au plus près) :
     même encre, même ton. */
  /* ⚖️ « Redonne du relief au sac à dos, mais sa taille et sa couleur sont bien » (27/09) : sa silhouette
     garde les variations de l'original, relevées (courbe t^0,35) pour garder le ton des deux autres */
  .img-backpack { --img: url("./assets/porte-pack.png"); --taille: 68.9%; }  /* 85 % puis −10 %, puis −10 % (« Réduit ensuite pack, le dessin de 10 % ») */
  .img-gear { --img: url("./assets/porte-gear.png"); --taille: 32.7% 90%; }  /* l'homme : 90 % de haut, 110 % puis −5 % de large (« Pantin réduit largeur de 5 % ») */
  /* Wares : ⚖️ « Réduit wares de 10 %, centre-le dans le bouton, il ne touche plus le bas » (27/09) —
     90 % de la largeur dans le liseré, centré dans les deux sens */
  .gear .porte-imagee .porte-image.img-wares { inset: calc(var(--bouton-retrait-v) + var(--bouton-lisere-marge) + 1px); --img: url("./assets/porte-wares.png");
    -webkit-mask-size: 90% auto; mask-size: 90% auto; -webkit-mask-position: center; mask-position: center; }
</style>
<body>
<div class="banc gear">
  <section>
    <h2>Aujourd'hui</h2>
    <div class="rangee">
      <button class="gear-porte" data-porte="backpack" type="button">Backpack</button>
      <button class="gear-porte" data-porte="send" type="button">Send</button>
      <button class="gear-porte" data-porte="wares" type="button">Wares</button>
    </div>
  </section>
  <section id="variantes"></section>
</div>
<script type="module">
  const portes = [["backpack", "Pack"], ["wares", "Wares"], ["gear", "Gear"]];
  const hote = document.getElementById("variantes");
  const s = document.createElement("section");
  s.innerHTML = "<h2>Retenu — carré 40 dans 44, mot T0 italique, centré</h2>";
  const r = document.createElement("div");
  r.className = "rangee";
  for (const [id, mot] of portes) {
    const b = document.createElement("button");
    b.className = "gear-porte porte-imagee"; b.dataset.porte = id; b.type = "button";
    b.innerHTML = `<span class="porte-image img-${id}"></span><span class="porte-mot">${mot}</span>`;
    r.append(b);
    if (id === "backpack") {
      const send = document.createElement("button");
      send.className = "gear-porte"; send.dataset.porte = "send"; send.type = "button"; send.textContent = "Send";
      r.append(send);
    }
  }
  s.append(r);
  hote.append(s);
</script>
</body>
