<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FHPC — banc de Wares (lot 218)</title>

<!-- ══════════════════════════════════════════════════════════════════════════
     LE BANC DE WARES (lot 218) — l'écran seul, sur sa dalle, sans le builder.
     Il existe pour REGARDER le rendu : les gardes lisent des fichiers, ils ne
     voient pas ce que l'œil reçoit (NORMES §0).
     ⛔ IL NE PORTE AUCUNE COTE ET AUCUN HABIT. Tout vient de `tokens.css`, de
     `shell.css` et de la feuille que `wares-ecran.mjs` construit depuis le plan.
     Si quelque chose est faux ici, c'est faux dans le produit.
     ⚠️ ET UN BANC N'EST PAS UNE SITUATION : *« un rendu se regarde en image, EN
     SITUATION — pas isolé sur une planche »*. Celui-ci sert à voir la géométrie
     et les matières ; le verdict se rend dans le builder servi.
     ══════════════════════════════════════════════════════════════════════ -->

<!-- ⚠️ LES TROIS FEUILLES DU PRODUIT, DANS SON ORDRE. `fiche.css` porte l'habit du
     livre et du `?` ; sans elle le banc les rendrait nus. ⛔ Un banc qui charge
     moins que le produit MENT. -->
<link rel="stylesheet" href="./tokens.css?v=774">
<link rel="stylesheet" href="./shell.css?v=774">
<link rel="stylesheet" href="./fiche.css?v=774">
<style>
  /* ⛔ L'ÉCHAFAUDAGE, ET RIEN D'AUTRE : la largeur du panneau et la hauteur d'une
     scène (560 − 60 de belt). */
  body { margin: 0; background: var(--bg, #1b1712); display: flex; justify-content: center; }
  .banc { width: 375px; height: 560px; display: flex; flex-direction: column; }
  .banc-belt {
    height: 60px; flex: none; display: flex; align-items: center; justify-content: center;
    font: 600 12px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-soft); box-shadow: inset 0 -1px 0 var(--border-strong);
  }
  .banc-scene { flex: 1 1 auto; min-height: 0; position: relative; display: flex; }
</style>
</head>
<body>
<div class="banc">
  <!-- ⭐ LA 3ᵉ LIGNE DU BELT DIT `Wares`, et c'est POUR ÇA que l'écran n'a plus de
       titre (Eric, 20/09 : *« Equipment browser dégage »*). Le banc la montre, sans
       quoi on ne verrait pas ce que le titre retiré laisse derrière lui. -->
  <div class="banc-belt">Équipement · Wares</div>
  <div class="banc-scene" id="scene"></div>
</div>
<script type="module">
import { construireLesWares } from "./wares-ecran.mjs?v=774";
import { PAR_PAGE } from "./wares-disposition.mjs?v=774";

/* ⭐ LE RANGEMENT DE DÉMONSTRATION — celui qu'Eric a tranché le 20/09, avec `Armory`
   et `Ranged Weapons` (qui a absorbé `projectiles`). ⛔ Aucune de ces valeurs n'est une
   donnée du produit : la vraie vient de `layers/srfh-shelving-en.layer.json`.
   📏 Les comptes SONT ceux mesurés sur la donnée, pour que la pagination du banc dise
   la vérité : une sous-catégorie à 33 objets fait 3 pages à douze par page. */
const RANGEMENT = [
  { nom: "Armory", sous: [
    { nom: "Magic Weapons", n: 33 }, { nom: "Melee Weapons", n: 28 }, { nom: "Magic Armor", n: 19 },
    { nom: "Armor", n: 13 }, { nom: "Ranged Weapons", n: 11 }] },
  { nom: "Arcana", sous: [
    { nom: "Consumables And Potions", n: 33 }, { nom: "Wands Rods Staves", n: 32 },
    { nom: "Scrolls Foci Components", n: 7 }] },
  { nom: "Marvels", sous: [
    { nom: "Foci And Curios", n: 33 }, { nom: "Clothing", n: 32 }, { nom: "Containers And Vehicles", n: 24 },
    { nom: "Rings", n: 22 }, { nom: "Jewellery", n: 15 }, { nom: "Consumables", n: 15 },
    { nom: "Helms And Lenses", n: 8 }] },
  { nom: "Adventuring", sous: [
    { nom: "Force And Trap", n: 10 }, { nom: "Ropes And Climbing", n: 8 }, { nom: "Packs", n: 7 },
    { nom: "Light And Fire", n: 6 }, { nom: "Watch And Signal", n: 5 },
    /* ⭐ ET UNE SOUS-CATÉGORIE COURTE, EXPRÈS : sans elle le banc ne peut RIEN montrer de
       la règle « une seule page n'a pas de chevrons ». Un banc qui ne peut pas montrer
       l'organe ne prouve rien de lui. */
    { nom: "Camp", n: 3 }] },
  { nom: "Mundane", sous: [
    { nom: "Containers", n: 16 }, { nom: "Writing And Reading", n: 6 }, { nom: "Clothing", n: 5 }] },
  { nom: "Crafting", sous: [{ nom: "Tools", n: 25 }] },
];

/* les noms de démonstration — ⛔ aucun prix, c'est la loi du jeton */
const MOTS = ["Ring of Jumping", "Ring of Swimming", "Ring of Warmth", "Ring of Protection",
  "Amulet of Health", "Boots of Elvenkind", "Cloak of Displacement", "Gauntlets of Ogre Power",
  "Hat of Disguise", "Bag of Holding", "Rope of Climbing", "Decanter of Endless Water"];

let categorie = 0, sousCategorie = 0, page = 0;

function peindre() {
  const cat = RANGEMENT[categorie];
  const sous = cat.sous[Math.min(sousCategorie, cat.sous.length - 1)];
  const pages = Math.max(1, Math.ceil(sous.n / PAR_PAGE));
  page = Math.max(0, Math.min(page, pages - 1));
  const reste = Math.min(PAR_PAGE, sous.n - page * PAR_PAGE);
  const objets = Array.from({ length: reste }, (_, i) => ({
    ref: `banc:${sous.nom}:${page}:${i}`,
    nom: MOTS[(page * PAR_PAGE + i) % MOTS.length],
    /* ⭐ un exemplaire en double et un verrouillé : la bande des quatre marques doit se
       VOIR au banc, sans quoi on ne sait pas ce qu'elle coûte en hauteur de jeton. */
    qte: i === 1 ? 2 : 1, locked: i === 5, equipped: i === 7, attuned: i === 9,
  }));

  const { noeud } = construireLesWares({
    categories: RANGEMENT.map((c) => ({ nom: c.nom })), categorie,
    sousCategories: cat.sous.map((s) => ({ nom: s.nom })), sousCategorie,
    objets, compte: sous.n, page, pages,
    bourse: "155 gp", compteTally: 2,
    sections: [{ valeur: "backpack", mot: "Backpack" }, { valeur: "self", mot: "Carried" }],
    destination: "backpack",
    surCategorie: (i) => { categorie = i; sousCategorie = 0; page = 0; peindre(); },
    surSousCategorie: (i) => { sousCategorie = i; page = 0; peindre(); },
    surPage: (sens) => { page += sens; peindre(); },
    surJeton: (ref) => { console.log("→ X2", ref); },
    surPorte: (id) => { console.log("→ porte", id); },
    surBouton: (id) => { console.log("→ bouton", id); },
    surDestination: (v) => { console.log("→ destination", v); },
  });
  const scene = document.getElementById("scene");
  scene.replaceChildren(noeud);
}

peindre();
/* 📌 POUR LES MESURES DU BANC : on publie l'état, ⛔ pas une seconde vérité — c'est le
   même objet que `peindre` lit. */
globalThis.__banc = { RANGEMENT, peindre, ou: () => ({ categorie, sousCategorie, page }) };
</script>
</body>
</html>
